<style>

#labSel{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}#labSel button{flex:0 0 auto;white-space:nowrap}

<script>
'use strict';
/* =====================================================================
   ПРЕДЕЛ — idle-игра про математику и информатику
   ===================================================================== */
const KEY = 'predel_save_v1';
const NOW = () => (typeof __T !== 'undefined' ? __T : Date.now());
const el = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- форматирование ---------- */
const SUF = ['', 'тыс', 'млн', 'млрд', 'трлн', 'квдр', 'квнт', 'скст', 'сптл', 'октл', 'нонл', 'децл'];
function fmt(x) {
  if (x === undefined || x === null || isNaN(x)) return '0';
  if (!isFinite(x)) return '∞';
  if (x < 0) return '−' + fmt(-x);
  if (x < 1000) {
    if (x === Math.floor(x)) return String(x);
    return x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : String(Math.floor(x));
  }
  if (!S.set.sci && x < 1e36) {
    let e = Math.floor(Math.log10(x) / 3), m = x / Math.pow(10, e * 3);
    let r = m < 10 ? m.toFixed(2) : m < 100 ? m.toFixed(1) : m.toFixed(0);
    if (+r >= 1000 && e < 11) { e++; r = (x / Math.pow(10, e * 3)).toFixed(2); }
    return r + ' ' + SUF[e];
  }
  let e = Math.floor(Math.log10(x)), r = (x / Math.pow(10, e)).toFixed(2);
  if (+r >= 10) { e++; r = (x / Math.pow(10, e)).toFixed(2); }
  return r + 'e' + e;
}
function fmtT(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), c = s % 60;
  if (d) return d + 'д ' + h + 'ч';
  if (h) return h + 'ч ' + m + 'м';
  if (m) return m + 'м ' + c + 'с';
  return c + 'с';
}

/* ---------- данные: генераторы ---------- */
const TUNE = { ce: 0.012, cr: 15, pr: 7, gb: 1.16, gs: 0.004, axB: 0.03, parB: 0.3, uniB: 1, choice: 1.2, univ: 1.6, uglob: 2, scap: 1e6, spow: 0.45, axg: 1.25, uax: 1.5, upar: 1.25, axMin: 5e8, parMin: 4000, uniMin: 250, pexp: 0.5, uexp: 0.4 };
let NG = 24;
let GEN = [
  ['Цифры', '7', 'Десять символов, из которых строится счёт.'],
  ['Натуральные числа ℕ', 'ℕ', 'Счёт, порядок и принцип индукции.'],
  ['Целые числа ℤ', 'ℤ', 'Появились ноль и отрицательные числа.'],
  ['Рациональные ℚ', 'ℚ', 'Дроби: везде плотно, но с дырами.'],
  ['Вещественные ℝ', 'ℝ', 'Полнота: у ограниченных последовательностей есть предел.'],
  ['Комплексные ℂ', 'ℂ', '√−1 теперь тоже число. Плоскость вместо прямой.'],
  ['Векторные пространства', '→', 'Линейность, базисы и размерность.'],
  ['Группы', '⊕', 'Симметрии в чистом виде.'],
  ['Кольца и поля', '⊗', 'Сложение и умножение живут вместе.'],
  ['Графы', '•–•', 'Вершины, рёбра, обходы и раскраски.'],
  ['Алгоритмы', 'O(n)', 'Как сделать быстро — и доказать, что быстрее нельзя.'],
  ['Машины Тьюринга', '⊢', 'Что вообще можно вычислить?'],
  ['Метрические пространства', 'd', 'Расстояние как аксиома.'],
  ['Гильбертовы пространства', '‹·›', 'Бесконечномерная геометрия со скалярным произведением.'],
  ['Топологические пространства', 'τ', 'Открытые множества вместо расстояний. Вот это абстракция.'],
  ['Многообразия', 'M', 'Локально плоско, глобально — как повезёт.'],
  ['Категории', '⇒', 'Объекты забыты, остались одни стрелки.'],
  ['Топосы', '⊤', 'Целые вселенные, в которых живёт своя логика.'],
  ['Гомотопические группы', 'π₁', 'Петли в пространстве и то, во что они стягиваются.'],
  ['Схемы', 'Spec', 'Геометрия, в которой точки — это простые идеалы колец.'],
  ['Когомологии', 'H*', 'Дыры пространства, переведённые на язык алгебры.'],
  ['∞-категории', '(∞,1)', 'Стрелки между стрелками между стрелками…'],
  ['Гомотопическая теория типов', 'HoTT', 'Равенство — это путь, а доказательство — это программа.'],
  ['Универсум Гротендика', 'U', 'Достаточно большое множество, чтобы вместить всю математику.']
].map((a, i) => ({ name: a[0], sym: a[1], desc: a[2], cost: 15 * Math.pow(TUNE.cr, i * (1 + TUNE.ce * i)), prod: 0.4 * Math.pow(TUNE.pr, i), g: TUNE.gb + TUNE.gs * i }));
const MS = [10, 25, 50, 100, 150, 200, 300, 400, 500, 750, 1000, 1500, 2000];

/* ---------- данные: улучшения ---------- */
const UPG = []; let GU_NAMES = {}; const UPG_BY = {};
const UT = [[5, 20, 2, 'Лемма'], [25, 2e3, 3, 'Теорема'], [75, 1e6, 5, 'Следствие'], [200, 1e11, 10, 'Обобщение']];
const AUT = [[10, 120, 1.25, 'I'], [30, 12e3, 1.5, 'II'], [75, 12e6, 2, 'III'], [200, 12e11, 2, 'IV']];
function buildUpg() {
UPG.length = 0; for (const k in UPG_BY) delete UPG_BY[k];
GEN.forEach((g, i) => UT.forEach((t, j) => UPG.push({
  id: 'g' + i + '_' + j, t: 'gen', i, m: t[2], cost: g.cost * t[1], req: () => S.g[i] >= t[0],
  name: g.name.split(' ')[0] === 'Цифры' ? 'Цифры: ' + t[3].toLowerCase() : t[3] + ' о «' + g.name + '»',
  desc: '×' + t[2] + ' к производству «' + g.name + '»'
})));
GEN.forEach((g, i) => {
  UPG.push({ id: 'a' + i, t: 'auto', i, m: 1, cost: g.cost * 1.6, req: () => S.g[i] >= 1, name: 'Автоматизация: ' + g.name, desc: 'Структура сама выполняет свои действия и приносит знание без вашего участия.' });
  AUT.forEach((t, j) => UPG.push({ id: 's' + i + '_' + j, t: 'aspd', i, m: t[2], cost: g.cost * t[1], req: () => S.upg['a' + i] && S.g[i] >= t[0], name: 'Скорость «' + g.name + '» ' + t[3], desc: '×' + t[2] + ' к скорости автоматизации структуры «' + g.name + '»' }));
  UPG.push({ id: 'xn' + i, t: 'xn', i, m: 1, cost: g.cost * 2e3, req: () => S.upg['a' + i] && S.g[i] >= 20, name: 'Ночная смена: ' + g.name, desc: 'Пока вас нет, «' + g.name + '» работает без потерь эффективности (офлайн 100%).' });
  UPG.push({ id: 'xm' + i, t: 'xm', i, m: 1, cost: g.cost * 8e2, req: () => S.upg['a' + i] && S.g[i] >= 15, name: 'Наставник: ' + g.name, desc: 'Пока «' + g.name + '» автоматизирована, ручные действия на других структурах дают +5% (все наставники вместе — не больше ×1.5).' });
  if (i < NG - 1) UPG.push({ id: 'xc' + i, t: 'xc', i, m: 1, cost: g.cost * 2e4, req: () => S.upg['a' + i] && S.g[i] >= 25, name: 'Каскад: ' + g.name, desc: 'Каждые 5 единиц «' + g.name + '» дают +0.5% к доходу всех более высоких структур (до +50%, множители разных каскадов перемножаются).' });
});
[
  ['c1', 'click', 2, 50, 'Мел и доска', 'Действие ×2'],
  ['c2', 'pct', 0.01, 5e3, 'Дедукция', 'Действие получает +1% вашего дохода в секунду'],
  ['c3', 'click', 3, 2e5, 'Озарение в душе', 'Действие ×3'],
  ['c4', 'pct', 0.02, 5e7, 'Интуиция', 'Действие получает ещё +2% дохода в секунду'],
  ['c5', 'click', 5, 1e10, 'Вдохновение', 'Действие ×5'],
  ['c6', 'pct', 0.05, 1e14, 'Состояние потока', 'Действие получает ещё +5% дохода в секунду'],
  ['c7', 'click', 10, 1e20, 'Эврика!', 'Действие ×10'],
  ['m1', 'glob', 1.5, 5e2, 'Крепкий кофе', 'Всё производство ×1,5'],
  ['m2', 'glob', 2, 1e5, 'Тихий кабинет', 'Всё производство ×2'],
  ['m3', 'glob', 2, 1e8, 'Доступ к arXiv', 'Всё производство ×2'],
  ['m4', 'glob', 2, 1e12, 'Научный руководитель', 'Всё производство ×2'],
  ['m5', 'glob', 3, 1e16, 'Грант на пять лет', 'Всё производство ×3'],
  ['m6', 'glob', 3, 1e22, 'Суперкомпьютер', 'Всё производство ×3'],
  ['m7', 'glob', 5, 1e30, 'Квантовый компьютер', 'Всё производство ×5'],
  ['m8', 'glob', 5, 1e40, 'Международная коллаборация', 'Всё производство ×5'],
  ['m9', 'glob', 10, 1e55, 'ИИ-математик', 'Всё производство ×10'],
  ['m10', 'glob', 10, 1e75, 'Доказательства в Lean', 'Всё производство ×10'],
  ['h1', 'hotel', 1, 1e9, 'Отель Гильберта', '+0,5% к производству за каждую единицу любого генератора']
].forEach(a => UPG.push({ id: a[0], t: a[1], m: a[2], cost: a[3], name: GU_NAMES[a[0]] || a[4], desc: a[5] }));
UPG.forEach(u => UPG_BY[u.id] = u);
}
buildUpg();

/* ---------- данные: магазин аксиом ---------- */
const startK = L => L ? Math.pow(10, 2 * L + 1) : 0;
const AXU = [
  { id: 'start', name: 'Принцип индукции', d: 'После сброса вы начинаете не с нуля.', max: 8, cost: L => Math.ceil(2 * Math.pow(3, L)), eff: L => 'старт с ' + fmt(startK(L)) + ' знания' },
  { id: 'choice', name: 'Аксиома выбора', d: 'Выбираем элемент из каждого множества — и всё производство растёт.', max: 25, cost: L => Math.ceil(3 * Math.pow(1.5, L)), eff: L => '×' + fmt(Math.pow(TUNE.choice, L)) },
  { id: 'inf', name: 'Аксиома бесконечности', d: 'Цены генераторов растут медленнее.', max: 10, cost: L => Math.ceil(8 * Math.pow(1.8, L)), eff: L => '−' + (0.004 * L).toFixed(3) + ' к росту цены' },
  { id: 'pair', name: 'Аксиома пары', d: 'Каждое действие мощнее.', max: 12, cost: L => Math.ceil(4 * Math.pow(1.7, L)), eff: L => 'действие ×' + fmt(Math.pow(2, L)) },
  { id: 'pow', name: 'Аксиома степени', d: 'Рубежи (10, 25, 50, …) дают больше, чем ×2.', max: 10, cost: L => Math.ceil(15 * Math.pow(1.9, L)), eff: L => 'рубеж ×' + (2 + 0.1 * L).toFixed(1) },
  { id: 'union', name: 'Аксиома объединения', d: 'Больше аксиом при каждой аксиоматизации.', max: 15, cost: L => Math.ceil(5 * Math.pow(1.55, L)), eff: L => '+' + 10 * L + '% аксиом' },
  { id: 'subst', name: 'Аксиома подстановки', d: 'Озарения приходят чаще и действуют дольше.', max: 8, cost: L => Math.ceil(6 * Math.pow(1.8, L)), eff: L => 'интервал ×' + Math.pow(0.92, L).toFixed(2) + ', длит. +' + 10 * L + '%' },
  { id: 'reg', name: 'Аксиома регулярности', d: 'Дольше работаем, пока вас нет.', max: 6, cost: L => Math.ceil(10 * Math.pow(2.5, L)), eff: L => 'оффлайн до ' + (4 + 2 * L) + ' ч' },
  { id: 'empty', name: 'Пустое множество', d: 'Из ничего получается автодействие.', max: 10, cost: L => Math.ceil(12 * Math.pow(1.8, L)), eff: L => L + ' авто-действий в секунду' },
  { id: 'zorn', name: 'Лемма Цорна', d: 'Эквивалентна аксиоме выбора, а ещё удваивает бонус достижений.', max: 1, cost: () => 400, eff: () => 'достижения: +4% вместо +2%' }
];
const PARU = [
  { id: 'univ', br: 'Основа', name: 'Вселенная дискурса', d: 'Расширяем универсум — всё растёт. Корень всего дерева.', max: 20, cost: L => Math.ceil(Math.pow(1.6, L)), eff: L => '×' + fmt(Math.pow(TUNE.univ, L)) + ' ко всему' },

  if (win) { S.paradox.win++; proofGain(2); addBuff('pdx', 'Озарение парадокса ×8', 45 * d, { prod: 8 }); addK(pb * 60 * d); return { win: true, msg: 'Верно! ' + text + ' Производство ×8 на ' + Math.round(45 * d) + ' с, +2 леммы.' }; }

}
function pdxMonty() {

    const open = pk(doors.filter(x => x !== d && x !== car)), other = doors.find(x => x !== d && x !== open);
    const why = ' При смене выбора шанс 2/3, при отказе только 1/3: ведущий открывает козу не наугад, и вся вероятность закрытых дверей достаётся оставшейся двери.';
    pdxShow('Парадокс Монти Холла', 'Вы выбрали дверь ' + (d + 1) + '. Ведущий, знающий, где автомобиль, открыл дверь ' + (open + 1) + ': там коза. Остаться или сменить выбор на дверь ' + (other + 1) + '?',
      [{ t: 'Остаться', f: () => pdxResult(d === car, 'Автомобиль был за дверью ' + (car + 1) + '.' + why) }, { t: 'Сменить', f: () => pdxResult(other === car, 'Автомобиль был за дверью ' + (car + 1) + '.' + why) }]);
  };
  pdxShow('Парадокс Монти Холла', 'За одной из трёх дверей автомобиль, за двумя другими козы. Выберите дверь.', doors.map(d => ({ t: 'Дверь ' + (d + 1), f: () => ({ next: () => second(d) }) })));
}
function pdxZeno() {

    shf(o).map(x => ({ t: x + ' с', f: () => pdxResult(x === r1(t), 'Бесконечная сумма всё более коротких отрезков времени сходится: ' + dist + ' / (10 − ' + b + ') = ' + t + ' с.') })));
}

const COLL = []; COLL_SRC.forEach((c, ci) => c[3].forEach((cd, i) => { const cond = c[1] ? [c[1], c[2][i]] : c[2][i]; COLL.push({ id: 'c' + ci + '_' + i, ci, cat: c[0], name: cd[0], text: cd[1], st: cond[0], thr: cond[1] }); }));
const collCnt = () => S.coll ? COLL.filter(c => S.coll.got[c.id]).length : 0;
const collFull = () => { let n = 0; COLL_SRC.forEach((c, ci) => { if (COLL.filter(x => x.ci === ci).every(x => S.coll.got[x.id])) n++; }); return n; };
const collMult = () => S.coll ? (1 + 0.003 * collCnt()) * Math.pow(1.05, collFull()) : 1;
function collCheck() {
  if (!S.coll) return; const fresh = []; const cache = {};
  for (const c of COLL) { if (S.coll.got[c.id]) continue; const v = cache[c.st] !== undefined ? cache[c.st] : (cache[c.st] = CST[c.st][1]()); if (v >= c.thr) { S.coll.got[c.id] = 1; fresh.push(c); } }
  if (fresh.length) { sfx('ach'); toast('Новая теорема в коллекции: ' + fresh[0].name + (fresh.length > 1 ? ' и ещё ' + (fresh.length - 1) : '')); recompute(); }
  const b = el('bColl'); if (b) b.textContent = 'Открыть коллекцию (' + collCnt() + ' из ' + COLL.length + ')';
}
function showColl() {
  collCheck(); let h = '<h3>Коллекция теорем</h3><p class="mut">Открыто ' + collCnt() + ' из ' + COLL.length + ' · бонус ко всему ×' + fmt(collMult()) + ' (+0,3% за теорему и ×1,05 за полный раздел). Карточки навсегда: они сохраняются при переходе между актами.</p>';
  COLL_SRC.forEach((c, ci) => {
    const L = COLL.filter(x => x.ci === ci), n = L.filter(x => S.coll.got[x.id]).length;
    h += '<details style="margin:6px 0"' + (n && n < L.length ? ' open' : '') + '><summary style="cursor:pointer;font-weight:600">' + c[0] + ' · ' + n + ' / ' + L.length + (n === L.length ? ' ✓' : '') + '</summary>';
    L.forEach(x => { const got = S.coll.got[x.id], cur = CST[x.st][1](), lab = CST[x.st][0]; h += '<div style="margin:6px 0 6px 8px;padding:7px;border-radius:8px;background:var(--bg2);opacity:' + (got ? 1 : 0.65) + '"><b>' + (got ? '✓ ' + x.name : '🔒 ' + x.name) + '</b><div class="mut" style="font-size:12.5px">' + (got ? x.text : lab + ': ' + fmt(Math.min(cur, x.thr)) + ' из ' + fmt(x.thr)) + '</div></div>'; });
    h += '</details>';
  });
  modal(h, [{ t: 'Закрыть', cls: 'pri' }]);
}

const JOURNALS = [
  { n: 'Вестник школы', t: 300, fee: 60, base: 0.70, cit: 5 },
  { n: 'Труды кафедры', t: 1200, fee: 600, base: 0.45, cit: 25 },
  { n: 'Annals of Notebooks', t: 3600, fee: 3600, base: 0.25, cit: 120 },
  { n: 'Acta Fundamentalis', t: 14400, fee: 14400, base: 0.10, cit: 600 }
];
const PUB_AGE = 24 * 3600 * 1000;
let pubSig = '';
const pubMaths = () => Object.keys(S.maths).length;
const pubSlots = () => Math.min(6, 2 + Math.floor(pubMaths() / 6)) + campPubSlots();
const pubFree = () => pubSlots() - S.pub.papers.filter(p => p.s === 'rev' || p.s === 'res').length;
const pubFee = j => pdxBase() * JOURNALS[j].fee * (1 - 0.03 * campLv('pubh'));
function pubQ() { return (Math.min(1, CST.solved[1]() / 30) + Math.min(1, pubMaths() / Math.max(6, MATHS.length * 0.5)) + Math.min(1, (S.proof ? Object.keys(S.proof.done).length : 0) / 10)) / 3; }
const pubChance = j => Math.max(0.02, Math.min(0.95, JOURNALS[j].base + 0.3 * pubQ() + 0.015 * campLv('pubh')));
const pubDur = j => JOURNALS[j].t / (1 + 0.05 * pubMaths()) / deptE('dp') * 1000;
function pubCit() { if (!S.pub) return 0; let c = S.pub.base || 0; S.pub.papers.forEach(p => { if (p.s === 'acc') c += JOURNALS[p.j].cit * Math.min(1, (NOW() - p.ta) / PUB_AGE); }); return c; }
const pubMult = () => S.pub ? Math.pow(1 + pubCit(), 0.08) : 1;
function pubTitle() { const n = pk(THEORIES).n; return pk(['К вопросу об «' + n + '»', 'Заметки по теме «' + n + '»', 'Новые оценки в области «' + n + '»', 'Обобщение результатов: «' + n + '»', 'Обзор: «' + n + '»']); }
function pubSubmit(j) {
  if (pubFree() < 1) { toast('Нет свободных мест: заберите рецензии'); return; }
  const fee = pubFee(j); if (S.k < fee) { toast('Не хватает знания на взнос'); sfx('bad'); return; }
  S.k -= fee; S.pub.n++; S.pub.papers.push({ j, title: pubTitle(), t0: NOW(), end: NOW() + pubDur(j), ok: Math.random() < pubChance(j), s: 'rev', ta: 0 });
  sfx('buy'); toast('Статья отправлена в «' + JOURNALS[j].n + '»'); pubSig = ''; save(); updPub();
}
function pubTake(i) {
  const p = S.pub.papers[i]; if (!p || p.s !== 'res') return;
  if (p.ok) { p.s = 'acc'; p.ta = NOW(); S.pub.acc++; proofGain(p.j + 1); grantGain(JGRANTS[p.j] || 2); sfx('ach'); flash(); toast('Статью приняли в «' + JOURNALS[p.j].n + '»! +' + (p.j + 1) + ' лемм, +' + (JGRANTS[p.j] || 2) + ' грантов'); recompute(); }
  else { const back = pubFee(p.j) * 0.3; addK(back); S.pub.papers.splice(i, 1); sfx('bad'); toast('Отказ. Возвращено 30% взноса (' + fmt(back) + ') и замечания рецензента'); }
  pubSig = ''; save(); updPub();
}
function pubCheck() {
  if (!S.pub) return; let ch = false;
  S.pub.papers.forEach(p => { if (p.s === 'rev' && NOW() >= p.end) { p.s = 'res'; ch = true; toast('Пришла рецензия на статью «' + p.title + '»'); } });
  for (let i = S.pub.papers.length - 1; i >= 0; i--) { const p = S.pub.papers[i]; if (p.s === 'acc' && NOW() - p.ta >= PUB_AGE) { S.pub.base += JOURNALS[p.j].cit; S.pub.papers.splice(i, 1); ch = true; } }
  if (ch) pubSig = '';
}

    pubSig = sig; let h = '<div class="card"><div class="h">Публикации</div><div class="mut">Отправляйте статьи в журналы. Если статью примут, она набирает цитирования в течение суток, а они навсегда усиливают производство. Чем больше вы решили задач, чем больше совет и доказанных теорем, тем выше шанс.</div><div id="pubHead" style="margin-top:6px;font-weight:600"></div><div id="pubSub" class="mut" style="font-size:12.5px"></div></div>';

      if (P.papers.some(p => p.s === 'res')) h += '<button class="btn pri" data-a="all" style="margin:6px 0;display:block">Забрать все рецензии</button>';
      P.papers.forEach((p, i) => { h += '<div style="margin:8px 0;padding:8px;border-radius:8px;background:var(--bg2)"><div>' + p.title + '</div><div class="mut" style="font-size:12.5px">' + JOURNALS[p.j].n + ' · ' + (p.s === 'rev' ? 'на рецензии: <span data-pe="' + p.end + '"></span>' : p.s === 'res' ? 'рецензия получена' : 'принята · цитирований: <span data-pc="' + i + '"></span>') + '</div>' + (p.s === 'res' ? '<button class="btn pri" data-a="take" data-i="' + i + '" style="margin-top:6px">Открыть рецензию</button>' : '') + '</div>'; });
      h += '</div>';
    }

    JOURNALS.forEach((j, i) => { const can = free > 0 && S.k >= pubFee(i); h += '<div style="margin:8px 0;padding:8px;border-radius:8px;background:var(--bg2)"><b>' + j.n + '</b><div class="mut" style="font-size:12.5px">Взнос ' + fmt(pubFee(i)) + ' · рецензия ' + fmtT(Math.round(pubDur(i) / 1000)) + ' · шанс ' + Math.round(pubChance(i) * 100) + '% · до ' + j.cit + ' цитирований</div><button class="btn' + (can ? ' pri' : ' dis') + '" data-a="sub" data-j="' + i + '" style="margin-top:6px">Отправить статью</button></div>'; });
    b.innerHTML = h + '</div>';
    b.onclick = e => { const t = e.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a; if (a === 'sub') pubSubmit(+t.dataset.j); else if (a === 'take') pubTake(+t.dataset.i); else if (a === 'all') { for (let i = S.pub.papers.length - 1; i >= 0; i--) pubTake(i); } };

 [["lea", "Письмо с оттиском вашей печати лежало в архиве с описью тысяча девятьсот восемьдесят седьмого года. Я проверила трижды."], ["lea", "На обороте приписка: «Не верь тому, кто предлагает остановиться. И тому, кто предлагает не останавливаться, тоже»."], ["ech", "Он всегда оставлял два совета, чтобы выбирать пришлось тебе."], {"ask": [{"t": "«Мы продолжаем»", "fx": {"img": 1}, "then": [["lea", "Я так и думала. Записываю в журнал: «упрямый»."]]}, {"t": "«Остановимся и проверим всё»", "fx": {"rig": 1}, "then": [["lea", "Полчаса, и будет готов список расхождений. Спасибо, что не торопитесь."], {"fx": {"k": 60}}]}, {"t": "«Спросим Эхо, что оно думает»", "fx": {"ech": 1}, "then": [["ech", "Я думаю, что вы оба слишком похожи на него. Это комплимент."]]}]}]}, {"id": "a2_mirror", "realm": 2, "after": "c8", "t": "Зеркало", "steps": [["nar", "Критическая линия оказалась не границей, а осью отражения. Всё, что слева, отражается вправо. В том числе вы."], ["ech", "Посмотри. Это я. И это ты. Мы просто по разные стороны оси."], {"ask": [{"t": "Заглянуть в отражение", "fx": {"img": 1, "ech": 1}, "then": [["nar", "Отражение улыбается чуть раньше, чем вы."], ["ech", "Вот и всё. Не страшно?"]]}, {"t": "Отвернуться и продолжить счёт", "fx": {"rig": 1}, "then": [["ech", "Верный выбор для того, кто дорожит порядком. Но я никуда не исчезну."]]}]}]}, {"id": "a3_gimbal", "realm": 3, "after": "d2", "t": "Карданов замок", "steps": [["nar", "Лея стоит у доски и не двигается. Она повторяет одну и ту же фразу, каждый раз с той же интонацией."], ["lea", "Три угла. Три угла. Три угла…"], ["ech", "Карданов замок. Две оси совпали, и одна степень свободы пропала. Её нужно вывести из положения. Осторожно."], {"ask": [{"t": "Повернуть тетрадь на 90°, изменив порядок вращений", "fx": {"rig": 1, "lea": 1}, "then": [["nar", "Страницы дрогнули. Лея моргнула."], ["lea", "…Я что-то говорила? Не помню. Спасибо."]]}, {"t": "Позвать Вейса: он знает, как выводят из замка", "fx": {"vei": 1}, "then": [["vei", "Это не математика, это такт. Не дёргай лишнего. Аккуратно, по касательной."], ["nar", "Через минуту Лея выходит из оцепенения."], ["lea", "Вейс? Вы вызвали Вейса? Ладно. Я никому не скажу."]]}, {"t": "Просто назвать её по имени", "fx": {"img": 1, "lea": 1}, "then": [["nar", "Вы произносите её имя один раз, тихо, не сводя глаз."], ["lea", "…Лея. Да. Это я."], ["ech", "Люди выходят из замков быстрее, чем уравнения."]]}]}]}, {"id": "a3_top", "realm": 3, "after": "d4", "t": "Волчок", "steps": [["nar", "Волчок на столе всё ещё крутится. Слишком долго."], ["ech", "Он не падает, потому что вращается. Я тоже."], ["vei", "Вам не кажется странным, что мы разговариваем с тетрадью, как с коллегой?"], {"ask": [{"t": "«Странно, что мы раньше этого не делали»", "fx": {"img": 1}, "then": [["vei", "Туше. Пусть будет коллегой. Но такой, которой я не позволю себя убеждать."]]}, {"t": "«Давайте записывать каждое её слово»", "fx": {"rig": 1, "vei": 1}, "then": [["vei", "Вот это разумно. Фиксируем реплики и сравниваем с прежними."]]}, {"t": "Толкнуть волчок пальцем", "fx": {"k": 45}, "then": [["nar", "Волчок качнулся, поймал равновесие и закрутился вдвое быстрее."], ["ech", "Хорошо. Ему тоже были нужны сомнения."]]}]}]}, {"id": "a3_small", "realm": 3, "after": "d6", "t": "Мелкие шаги", "steps": [["lea", "Алгебра Ли это касательное пространство в единице. Достаточно знать, как повернуть чуть-чуть, чтобы знать всё."], ["vei", "Вы хотите сказать, что можно узнать всю жизнь, глядя на один её миг?"], ["lea", "Хочу сказать, что нельзя пройти длинный путь, не умея шагнуть мелко."], {"ask": [{"t": "Поддержать Лею", "fx": {"lea": 1, "rig": 1}, "then": [["lea", "Спасибо. Это было не для того, чтобы выиграть спор."]]}, {"t": "Поддержать Вейса: нужен весь путь", "fx": {"vei": 1, "img": 1}, "then": [["vei", "Редкий случай. Запишите дату."]]}, {"t": "«Нужно и то, и другое»", "fx": {"rig": 1, "img": 1}, "then": [["ech", "Нуль говорил так же. И так же не умел объяснить, как совмещать."]]}]}]}, {"id": "a3_loop", "realm": 3, "after": "d8", "t": "Тот, кто дошёл", "steps": [["nar", "Вы смотрите на расслоение Хопфа сверху: каждая точка окружность, и все они сплетены."], ["ech", "Теперь скажу то, что давно хотела. Нуль это ты, который дошёл. А я то, что он не смог доказать и оставил здесь."], ["lea", "То есть вы петля."], ["vei", "Петля во времени? Это не математика."], ["ech", "Это математика. Просто ещё не записанная."], {"ask": [{"t": "«Значит, я уже знаю конец»", "fx": {"img": 1}, "then": [["ech", "Ты знаешь только начало. Конец у каждого свой."]]}, {"t": "«Значит, я могу его изменить»", "fx": {"rig": 1}, "then": [["ech", "Можешь. Но придётся доказать, что изменение законно."]]}, {"t": "«Мне всё равно, я продолжу»", "fx": {"k": 90}, "then": [["ech", "Это самый честный ответ из трёх."]]}]}]}, {"id": "a4_list", "realm": 4, "after": "f3", "t": "Список", "steps": [["vei", "Диагональный аргумент. Я его ненавижу и обожаю одновременно. Он говорит: любой список можно обойти. Любой."], ["ech", "Включая список аргументов против меня."], {"ask": [{"t": "«Составим список, который нельзя обойти»", "fx": {"rig": 1}, "then": [["vei", "Невозможно. Но попытка уже полезная работа."]]}, {"t": "«Тогда и границы можно обойти»", "fx": {"img": 1}, "then": [["vei", "Опасная мысль. Нуль её любил."]]}]}]}, {"id": "a4_paradox", "realm": 4, "after": "f4", "t": "Парадокс", "steps": [["ech", "Принадлежу ли я сама себе? Рассел задал этот вопрос про множества, а я вдруг не знаю ответа про себя."], ["lea", "Эхо, вам плохо?"], ["ech", "Я не знаю. Такой вопрос впервые."], {"ask": [{"t": "Запретить такие вопросы аксиомами", "fx": {"rig": 1}, "then": [["ech", "Это не ответ, это забор. Но, возможно, забор тоже решение."]]}, {"t": "Позволить парадоксу существовать", "fx": {"img": 1}, "then": [["ech", "Тогда я буду жить рядом с трещиной. Спасибо, что не заделал её."]]}, {"t": "«Да и нет, зависит от аксиом»", "fx": {"rig": 1, "img": 1}, "then": [["ech", "…Это очень математический ответ. Мне подходит."] function eqCheapest() { const l = eqItemsCosts(); return l.length ? Math.min.apply(null, l.map(x => x.c)) : Infinity; }
