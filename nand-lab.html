<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NAND-мастерская</title>
<style>
:root{
  --bg:#0e2535; --bar:#0a1d2b; --panel:#12303f; --panel2:#1a4157; --line:#2b5870;
  --text:#e3f1f8; --dim:#8fb0c4; --on:#ffc247; --ok:#5fe0a8; --bad:#ff6b6b; --sel:#6ee7c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:var(--panel2);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
button.pri{background:var(--on);color:#2a1b00;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
#bMenu{width:44px;padding:0;font-size:20px}
#ttl{flex:1;min-width:0;padding:2px 4px;cursor:pointer}
#tName{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tSub{display:flex;gap:12px;color:var(--dim);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:16px;white-space:nowrap;overflow:hidden}
#tSub .w{color:var(--bad)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#selbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel);
  border:1px solid var(--sel);border-radius:14px;padding:5px;max-width:96%;overflow-x:auto}
#selbar[hidden],#clk[hidden]{display:none}
#selbar button{min-height:40px;white-space:nowrap}
#hist{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px}
#hist button{width:42px;min-height:42px;padding:0;font-size:19px;background:var(--panel);border:1px solid var(--line);border-radius:21px}
#hist button.on{background:var(--on);color:#2a1b00;border-color:var(--on)}
#clk{position:absolute;left:10px;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:5px}
#fab{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;
  background:var(--on);color:#2a1b00;font-size:32px;font-weight:300;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#fit{position:absolute;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:22px;padding:0;
  background:var(--panel);border:1px solid var(--line);font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);padding:10px 16px;border-radius:12px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center}
#toast.on{opacity:1}
#back{position:fixed;inset:0;background:rgba(3,10,16,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);transform:translateY(105%);transition:transform .22s ease;z-index:11;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));touch-action:pan-y;overscroll-behavior:contain}
#sheet.on{transform:none}
.sh-h{padding:16px 16px 8px;font-size:18px;font-weight:700}
.sec{padding:12px 16px 4px;color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border-radius:0;background:transparent;text-align:left;border-bottom:1px solid rgba(43,88,112,.5)}
.row .n{width:28px;height:28px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:13px;flex:none;font-family:ui-monospace,Menlo,monospace}
.row .n.ok{background:var(--ok);color:#06281a}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--dim);display:block;font-size:12px}
.row[disabled]{opacity:.4}
.row .x{width:40px;min-height:40px;padding:0;flex:none;background:transparent;color:var(--bad);font-size:20px}
.modal{position:fixed;inset:0;background:rgba(3,10,16,.7);display:grid;place-items:center;z-index:40;padding:16px;touch-action:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column}
.card h2{margin:0;padding:16px 16px 6px;font-size:18px}
.card .body{padding:4px 16px 8px;overflow:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.card .body p{margin:0 0 10px}
.card .btns{display:flex;gap:8px;padding:10px 16px 16px;flex-wrap:wrap;justify-content:flex-end}
.fl{display:block;margin:6px 0 0;color:var(--dim);font-size:13px}
.inp{display:block;margin:4px 0 0;width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bar);color:var(--text);padding:0 12px;font:inherit;user-select:text;-webkit-user-select:text}
textarea.inp{min-height:150px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.inp[multiple],select.inp{appearance:auto}
.bitgrid{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.bitgrid button{min-height:40px;width:34px;padding:0;font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--bar);border:1px solid var(--line)}
.bitgrid button.on{background:var(--on);color:#2a1b00;border-color:var(--on)}
.bitgrid small{width:100%;color:var(--dim);font-size:12px}
table{border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin:6px 0}
th,td{padding:4px 7px;text-align:center;border-bottom:1px solid rgba(43,88,112,.6);white-space:nowrap}
th{color:var(--dim);font-weight:500}
td.sep,th.sep{border-left:1px solid var(--line)}
td.bad{background:rgba(255,107,107,.25);color:#ffd0d0;font-weight:700}
td.dc{color:var(--dim)}
.res-ok{color:var(--ok);font-weight:700}
.res-bad{color:var(--bad);font-weight:700}
.scroll-x{overflow-x:auto;touch-action:pan-x pan-y}
.new li{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){#sheet,#back,#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="bMenu" aria-label="Меню">☰</button>
    <div id="ttl" role="button" tabindex="0"><span id="tName"></span><span id="tSub"></span></div>
    <button id="bTab" class="ghost" hidden>Таблица</button>
    <button id="bAct" class="pri"></button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="selbar" hidden></div>
    <div id="clk" hidden></div>
    <div id="hist"><button id="bUndo" aria-label="Отменить">↶</button><button id="bRedo" aria-label="Повторить">↷</button><button id="bSelM" aria-label="Выделение группы">☐</button><button id="bPaste" hidden aria-label="Вставить">📋</button><button id="bSnd" hidden aria-label="Звук">🔊</button></div>
    <button id="fit" aria-label="Показать всё">⌖</button>
    <button id="fab" aria-label="Добавить элемент">+</button>
  </main>
</div>
<div id="back"></div>
<div id="sheet" role="dialog"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   ДВИЖОК: разворачивание схемы (с шинами) в сеть NAND-вентилей + память
   ===================================================================== */
//ENGINE-START
let CHIPS={};
const NAND_DEF={id:'NAND',name:'NAND',inputs:['A','B'],outputs:['Y']};
const chipInfo=id=>id==='NAND'?NAND_DEF:(CHIPS[id]||null);
const ones=n=>Array(n).fill(1);
const sumOf=a=>a.reduce((s,x)=>s+x,0);
const defIn=d=>d.inW||ones(d.inputs.length);
const defOut=d=>d.outW||ones(d.outputs.length);
const maskOf=w=>w>=32?0xFFFFFFFF:(2**w-1);
function pinSpec(n){
  const w=n.w||1;
  switch(n.type){
    case 'in':case 'clock':case 'const':return {i:[],o:[n.type==='clock'?1:w]};
    case 'c0':case 'c1':return {i:[],o:[1]};
    case 'out':return {i:[w],o:[]};
    case 'btn':return {i:[],o:[1]};
    case 'seg':return {i:[n.w===8?8:4],o:[]};
    case 'sound':return {i:[n.nb||6,1],o:[]};
    case 'screen':return {i:[n.xb||4,n.yb||4,n.cb||1,1,1],o:[]};
    case 'tty':return {i:[8,1,1],o:[]};
    case 'delay':return {i:[w],o:[w]};
    case 'switch':return {i:[],o:[1]};
    case 'rng':return {i:[],o:[n.w||8]};
    case 'scope':return {i:(n.ch||[1,1,1,1]).slice(),o:[]};
    case 'note':return {i:[],o:[]};
    case 'split':return {i:[sumOf(n.ws)],o:n.ws.slice()};
    case 'merge':return {i:n.ws.slice(),o:[sumOf(n.ws)]};
    case 'rom':return {i:[n.aw],o:[n.dw]};
    case 'ram':return {i:[n.aw,n.dw,1,1],o:[n.dw]};
    case 'chip':{
      if(n.chip==='NAND')return {i:[w,w],o:[w]};
      const d=chipInfo(n.chip);return d?{i:defIn(d),o:defOut(d)}:{i:[],o:[]};
    }
  }
  return {i:[],o:[]};
}
function pinCount(n){const s=pinSpec(n);return [s.i.length,s.o.length];}
function calcDelay(g,n,targets){
  const drv=new Int32Array(n).fill(-1),m=g.length/3;
  for(let i=0;i<m;i++)drv[g[3*i+2]]=i;
  const memo=new Int32Array(n).fill(-2);let cyc=false;
  function d(net){
    if(memo[net]>=0)return memo[net];
    if(memo[net]===-3){cyc=true;return 0;}
    const k=drv[net];if(k<0){memo[net]=0;return 0;}
    memo[net]=-3;const r=1+Math.max(d(g[3*k]),d(g[3*k+1]));memo[net]=r;return r;
  }
  let mx=0;for(const t of targets)mx=Math.max(mx,d(t));
  return cyc?null:mx;
}
function flatten(circ){
  const parent=[0,1];let nNets=2;
  const nl=()=>{parent.push(nNets);return nNets++;};
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  const union=(a,b)=>{a=find(a);b=find(b);if(a===b||(a<2&&b<2))return;if(a<2)parent[b]=a;else parent[a]=b;};
  const fresh=w=>{const r=[];for(let k=0;k<w;k++)r.push(nl());return r;};
  const fitArr=(a,w)=>{const r=new Array(w);for(let k=0;k<w;k++)r[k]=(a&&a[k]!==undefined)?a[k]:0;return r;};
  const gates=[],cells=[],probes={};
  function inst(c,inNets,depth){
    if(depth>32)throw new Error('Слишком глубокая вложенность чипов');
    const outs={};
    for(const n of c.nodes){
      const sp=pinSpec(n);
      if(n.type==='in')outs[n.id]=[inNets?fitArr(inNets[n.id],sp.o[0]):fresh(sp.o[0])];
      else if(n.type==='switch')outs[n.id]=depth===0?[fresh(1)]:[[(n.val|0)&1]];
      else if(n.type==='clock'||n.type==='btn')outs[n.id]=[fresh(1)];
      else if(n.type==='const'){const v=(n.val>>>0),w=sp.o[0],a=[];for(let k=0;k<w;k++)a.push(k<32&&((v>>>k)&1)?1:0);outs[n.id]=[a];}
      else if(n.type==='c1')outs[n.id]=[[1]];
      else if(n.type==='c0')outs[n.id]=[[0]];
      else if(n.type==='out')outs[n.id]=[];
      else outs[n.id]=sp.o.map(w=>fresh(w));
    }
    const into={};
    for(const w of c.wires){
      const so=outs[w.from.node];
      if(!so||so[w.from.pin]===undefined)continue;
      into[w.to.node+':'+w.to.pin]=so[w.from.pin];
    }
    const get=(n,k,w)=>fitArr(into[n.id+':'+k],w);
    const result={};
    for(const n of c.nodes){
      const sp=pinSpec(n);
      if(n.type==='out')result[n.id]=get(n,0,sp.i[0]);
      else if(n.type==='chip'){
        const d=chipInfo(n.chip);if(!d)continue;
        if(n.chip==='NAND'){
          const A=get(n,0,sp.i[0]),B=get(n,1,sp.i[1]),O=outs[n.id][0];
          for(let k=0;k<O.length;k++)gates.push(A[k],B[k],O[k]);
        }else{
          const m={};defIn(d).forEach((w,i)=>{m[d.inIds[i]]=get(n,i,w);});
          const r=inst(d.circuit,m,depth+1);
          defOut(d).forEach((w,i)=>{const rn=fitArr(r.result[d.outIds[i]],w);rn.forEach((x,k)=>union(outs[n.id][i][k],x));});
        }
      }else if(n.type==='split'){
        const a=get(n,0,sp.i[0]);let p=0;
        n.ws.forEach((wk,i)=>{for(let k=0;k<wk;k++)union(outs[n.id][i][k],a[p+k]);p+=wk;});
      }else if(n.type==='merge'){
        let p=0;
        n.ws.forEach((wk,i)=>{const a=get(n,i,wk);for(let k=0;k<wk;k++)union(outs[n.id][0][p+k],a[k]);p+=wk;});
      }else if(n.type==='rom'){
        cells.push({t:'rom',a:get(n,0,n.aw),o:outs[n.id][0],data:n.data||[]});
      }else if(n.type==='ram'){
        cells.push({t:'ram',a:get(n,0,n.aw),d:get(n,1,n.dw),we:get(n,2,1)[0],clk:get(n,3,1)[0],o:outs[n.id][0],data:n.data||[]});
      }else if(n.type==='seg'||n.type==='sound'){
        if(depth===0)probes[n.id]=sp.i.map((pw,k)=>get(n,k,pw));
      }else if(n.type==='screen'){
        cells.push({t:'screen',x:get(n,0,sp.i[0]),y:get(n,1,sp.i[1]),d:get(n,2,sp.i[2]),we:get(n,3,1)[0],clk:get(n,4,1)[0],nid:depth===0?n.id:null});
      }else if(n.type==='tty'){
        cells.push({t:'tty',d:get(n,0,8),we:get(n,1,1)[0],clk:get(n,2,1)[0],nid:depth===0?n.id:null});
      }else if(n.type==='delay'){
        cells.push({t:'delay',a:get(n,0,sp.i[0]),o:outs[n.id][0]});
      }else if(n.type==='rng'){
        cells.push({t:'rng',o:outs[n.id][0]});
      }else if(n.type==='scope'){
        if(depth===0)probes[n.id]=sp.i.map((pw,k)=>get(n,k,pw));
      }
    }
    return {outs,result};
  }
  const top=inst(circ,null,0);
  const garr=new Int32Array(gates.length);
  for(let i=0;i<gates.length;i++)garr[i]=find(gates[i]);
  const F=a=>a.map(find);
  const fc=cells.map(c=>({t:c.t,a:F(c.a||[]),x:c.x?F(c.x):null,y:c.y?F(c.y):null,d:c.d?F(c.d):null,we:c.we!==undefined?find(c.we):0,clk:c.clk!==undefined?find(c.clk):0,o:F(c.o||[]),data:c.data||[],nid:c.nid||null}));
  const cellOf={};fc.forEach((c,i)=>{if(c.nid)cellOf[c.nid]=i;});
  const prb={};for(const id in probes)prb[id]=probes[id].map(F);
  const outs={};for(const id in top.outs)outs[id]=top.outs[id].map(F);
  const res={};for(const id in top.result)res[id]=F(top.result[id]);
  const tg=[];Object.values(res).forEach(a=>a.forEach(x=>tg.push(x)));
  return {n:nNets,gates:garr,cells:fc,cellOf,probes:prb,outs,res,nand:garr.length/3,delay:calcDelay(garr,nNets,tg)};
}
function ttyPut(t,c){
  const COLS=16,ROWS=4;c&=127;
  if(c===12){t.buf.fill(32);t.cur=0;return;}
  if(c===10)t.cur=(Math.floor(t.cur/COLS)+1)*COLS;
  else if(c===8){if(t.cur>0){t.cur--;t.buf[t.cur]=32;}return;}
  else if(c>=32&&c<127){t.buf[t.cur]=c;t.cur++;}
  else return;
  if(t.cur>=COLS*ROWS){t.buf.splice(0,COLS);for(let i=0;i<COLS;i++)t.buf.push(32);t.cur-=COLS;}
}
class Sim{
  constructor(fl){
    this.fl=fl;this.v=new Uint8Array(fl.n);this.t=new Uint8Array(fl.n);this.v[1]=1;this.unstable=false;
    this.initMem();
  }
  initMem(){
    this.mem=this.fl.cells.map(c=>{
      if(c.t==='screen')return new Array((1<<c.x.length)*(1<<c.y.length)).fill(0);
      if(c.t==='tty')return {buf:new Array(64).fill(32),cur:0};
      if(c.t==='delay'||c.t==='rng')return new Array(c.o.length).fill(0);
      return Array.from({length:1<<c.a.length},(_,i)=>(c.data[i]|0)>>>0);
    });
    this.prev=this.fl.cells.map(()=>0);
  }
  rdn(arr,nets){let x=0;for(let k=0;k<nets.length;k++)x|=arr[nets[k]]<<k;return x>>>0;}
  rd(nets){return this.rdn(this.v,nets);}
  reset(){this.v.fill(0);this.v[1]=1;this.initMem();return this.settle();}
  cellStep(src,dst){
    const cs=this.fl.cells;let ch=false;
    for(let i=0;i<cs.length;i++){
      const c=cs[i],m=this.mem[i];
      if(c.t==='ram'||c.t==='screen'||c.t==='tty'){
        const clk=src[c.clk],rise=clk&&!this.prev[i];this.prev[i]=clk;
        if(rise&&src[c.we]){
          if(c.t==='ram')m[this.rdn(src,c.a)]=this.rdn(src,c.d);
          else if(c.t==='screen')m[this.rdn(src,c.y)*(1<<c.x.length)+this.rdn(src,c.x)]=this.rdn(src,c.d);
          else if(c.t==='tty')ttyPut(m,this.rdn(src,c.d));
        }
      }
      if(c.t==='rom'||c.t==='ram'){
        const val=m[this.rdn(src,c.a)]>>>0;
        for(let k=0;k<c.o.length;k++){const nv=(val>>>k)&1;if(dst[c.o[k]]!==nv){dst[c.o[k]]=nv;ch=true;}}
      }else if(c.t==='delay'||c.t==='rng'){
        for(let k=0;k<c.o.length;k++){const nv=m[k];if(dst[c.o[k]]!==nv){dst[c.o[k]]=nv;ch=true;}}
      }
    }
    return ch;
  }
  /* один такт: задержки запоминают вход, генераторы выдают новое число; затем схема успокаивается */
  tick(){
    const cs=this.fl.cells,caps=[];
    for(let i=0;i<cs.length;i++)if(cs[i].t==='delay')caps[i]=cs[i].a.map(n=>this.v[n]);
    for(let i=0;i<cs.length;i++){
      if(cs[i].t==='delay')this.mem[i]=caps[i];
      else if(cs[i].t==='rng')this.mem[i]=cs[i].o.map(()=>Math.random()<.5?1:0);
    }
    return this.settle();
  }
  settle(){
    const g=this.fl.gates,m=g.length/3,v=this.v,t=this.t,hasC=this.fl.cells.length>0;
    for(let it=0;it<400;it++){
      t.set(v);let ch=hasC?this.cellStep(v,t):false;
      for(let i=0,j=0;i<m;i++,j+=3){const o=g[j+2],nv=(v[g[j]]&v[g[j+1]])^1;if(t[o]!==nv){t[o]=nv;ch=true;}}
      if(!ch){this.unstable=false;return true;}
      v.set(t);
    }
    for(let it=0;it<400;it++){
      let ch=hasC?this.cellStep(v,v):false;
      for(let i=0,j=0;i<m;i++,j+=3){const o=g[j+2],nv=(v[g[j]]&v[g[j+1]])^1;if(v[o]!==nv){v[o]=nv;ch=true;}}
      if(!ch){this.unstable=false;return true;}
    }
    this.unstable=true;return false;
  }
}
/* ---------- Уровни ---------- */
const bits=(n,w)=>Array.from({length:w},(_,i)=>(n>>i)&1);
const num=a=>a.reduce((s,b,i)=>s+(b<<i),0);

const CPU_PROG=[0x05,0x80,0x7F,0xC1,0x09,0x43,0x80,0x00,0xC0,0x80,0x3F,0x41,0x80,0xCD];
function cpuDriver(io){
  const rows=[];let pc=0,acc=0,out=0;
  io.reset();
  const clock=(rst,ins)=>{io.set(1,rst);io.set(2,ins);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};
  clock(1,0);
  rows.push({in:[1,0],exp:[0,0],got:[io.get(0),io.get(1)]});
  for(let i=0;i<48;i++){
    const ins=CPU_PROG[io.get(0)]??0;
    clock(0,ins);
    const mi=CPU_PROG[pc]??0,op=mi>>6,imm=mi&63;let npc=(pc+1)&255;
    if(op===0)acc=imm;
    else if(op===1)acc=(acc+(imm>=32?imm-64:imm))&255;
    else if(op===2)out=acc;
    else if(acc!==0)npc=imm;
    pc=npc;
    rows.push({in:[0,ins],exp:[pc,out],got:[io.get(0),io.get(1)]});
  }
  return rows;
}
const PROG30=[0x09,0x80,0x7D,0xC1,0x1F,0x5F,0x80,0x42,0x80,0xC8];
function isaRun(prog){
  let pc=0,acc=0,out=0;
  return {reset(){pc=0;acc=0;out=0;},
    step(){const mi=prog[pc]??0,op=mi>>6,imm=mi&63;let np=(pc+1)&255;
      if(op===0)acc=imm;else if(op===1)acc=(acc+(imm>=32?imm-64:imm))&255;else if(op===2)out=acc;else if(acc!==0)np=imm;pc=np;},
    get pc(){return pc;},get out(){return out;}};
}
function disasm(prog){
  return prog.map((w,i)=>{const op=w>>6,n=w&63;return i+': '+(op===0?'LDI '+n:op===1?'ADDI '+(n>=32?n-64:n):op===2?'OUT':'JNZ '+n);}).join('\n');
}
function computerDriver(io){
  const rows=[],m=isaRun(PROG30);
  io.reset();
  const clock=rst=>{io.set(1,rst);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};
  clock(1);m.reset();rows.push({in:[1],exp:[0],got:[io.get(0)]});
  for(let i=0;i<40;i++){clock(0);m.step();rows.push({in:[0],exp:[m.out],got:[io.get(0)]});}
  return rows;
}

function genVecs(L){
  const W=L.inW||L.ins.map(()=>1),T=sumOf(W),out=[];
  if(T<=10){
    for(let k=0;k<(1<<T);k++){let r=k;out.push(W.map(w=>{const v=r&((1<<w)-1);r>>>=w;return v;}));}
    return out;
  }
  const mx=W.map(w=>maskOf(w));
  for(let m=0;m<(1<<Math.min(W.length,4));m++)out.push(W.map((w,i)=>(m>>i)&1?mx[i]:0));
  out.push(W.map((w,i)=>i===0?1:0));out.push(W.map(()=>1));
  if(L.edges)L.edges.forEach(e=>out.push(e.slice()));
  let s=12345;
  const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
  for(let i=0;i<300;i++)out.push(W.map(w=>Math.floor(rnd()*2**w)));
  return out;
}
function runTests(L,circ){
  let fl;try{fl=flatten(circ);}catch(e){return {error:e.message};}
  const sim=new Sim(fl);
  const inN=L.ins.map((_,i)=>fl.outs['i'+i]?.[0]);
  const outN=L.outs.map((_,i)=>fl.res['o'+i]);
  if(inN.some(x=>x===undefined)||outN.some(x=>x===undefined))return {error:'Не найдены входы или выходы уровня'};
  const setOne=(i,x)=>{const nets=inN[i];for(let k=0;k<nets.length;k++)sim.v[nets[k]]=k<32?(x>>>k)&1:0;};
  const setv=vec=>vec.forEach((x,i)=>setOne(i,x));
  const getv=()=>outN.map(nets=>sim.rd(nets));
  const rows=[];let unst=0;
  const same=(e,g)=>e===null||e===g;
  if(L.driver){
    const rs=L.driver({reset:()=>sim.reset(),set:setOne,settle:()=>{if(!sim.settle())unst++;},get:i=>sim.rd(outN[i])});
    rs.forEach(r=>rows.push({in:r.in,exp:r.exp,got:r.got,ok:r.exp.every((e,i)=>same(e,r.got[i]))}));
  }else if(L.seq){
    const model=L.model();sim.reset();
    for(const vec of L.seq){
      setv(vec);if(!sim.settle())unst++;
      const exp=model(vec),got=getv();
      rows.push({in:vec,exp,got,ok:exp.every((e,i)=>same(e,got[i]))});
      if(L.ticks&&!sim.tick())unst++;
    }
  }else{
    for(const vec of genVecs(L)){
      sim.reset();setv(vec);if(!sim.settle())unst++;
      const exp=L.fn(vec),got=getv();
      rows.push({in:vec,exp,got,ok:exp.every((e,i)=>same(e,got[i]))});
    }
  }
  const bad=rows.filter(r=>!r.ok).length;
  return {rows,bad,ok:bad===0,unst,fl,seq:!!(L.seq||L.driver),
    inNames:L.drvIn||L.ins,inWs:L.drvW||L.inW||L.ins.map(()=>1)};
}

const ptrs=new Map();

function evPt(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function hitPin(wx,wy,rad,wantOut,wf){
  let best=null,bd=rad*rad;
  for(const n of cur.nodes){
    const sp=pinSpec(n);
    if(wantOut!==true)sp.i.forEach((pw,k)=>{
      if(wf&&pw!==wf)return;
      const p=pinPos(n,false,k),d=(p.x-wx)**2+(p.y-wy)**2;if(d<bd){bd=d;best={node:n.id,pin:k,out:false,x:p.x,y:p.y};}

      const p=pinPos(n,true,k),d=(p.x-wx)**2+(p.y-wy)**2;if(d<bd){bd=d;best={node:n.id,pin:k,out:true,x:p.x,y:p.y};}
    });
  }

}
function hitNode(wx,wy){
  for(let i=cur.nodes.length-1;i>=0;i--){
    const n=cur.nodes[i],[w,h]=nodeSize(n);
    if(wx>=n.x&&wx<=n.x+w&&wy>=n.y&&wy<=n.y+h)return n;
  }

}
function hitWire(wx,wy,rad){
  let best=-1,bd=rad;
  cur.wires.forEach((w,i)=>{
    const A=nodeById(w.from.node),B=nodeById(w.to.node);if(!A||!B)return;
    const pts=wirePts(pinPos(A,true,w.from.pin),pinPos(B,false,w.to.pin));

function fit(){
  if(!cur.nodes.length){view={x:W/2,y:H/2,s:1};need();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

function parseWidths(str,loose){
  const out=[];
  for(const tok of String(str).split(/[\s,;]+/).filter(Boolean)){
    const m=tok.match(/^(\d+)[*x×](\d+)$/i);
    if(m){for(let i=0;i<+m[1];i++)out.push(+m[2]);}
    else if(/^\d+$/.test(tok))out.push(+tok);
    else return {err:'Не понял «'+tok+'». Пример: 4,4 или 8*1'};
  }
  if(!out.length)return {err:'Список ширин пуст'};
  if(out.some(x=>x<1||x>32))return {err:'Каждая ширина — от 1 до 32 бит'};
  if(out.length>(loose?8:32))return {err:'Не больше '+(loose?8:32)+' групп'};
  if(!loose&&sumOf(out)>32)return {err:'Суммарная ширина не больше 32 бит'};
  return {ws:out};
}
function memToText(data,words){
  let last=-1;for(let i=0;i<data.length;i++)if(data[i])last=i;
  const out=[];for(let i=0;i<=last;i++){out.push((data[i]>>>0).toString(16).toUpperCase().padStart(Math.ceil(words/4),'0'));}
  const lines=[];for(let i=0;i<out.length;i+=8)lines.push(out.slice(i,i+8).join(' '));
  return lines.join('\n');
}
function parseMem(text,aw,dw){
  const size=1<<aw,data=new Array(size).fill(0),mk=maskOf(dw);let k=0;
  const push=v=>{if(k>=size)throw new Error('Слов больше, чем ячеек ('+size+')');data[k++]=(v&mk)>>>0;};
  for(let line of text.split('\n')){
    line=line.replace(/[;#].*$/,'').trim();if(!line)continue;
    const m=line.match(/^([A-Za-z]+)\s*(-?\w+)?$/);
    if(m&&/^(LDI|ADDI|OUT|JNZ)$/i.test(m[1])){
      const op=m[1].toUpperCase(),a=m[2]===undefined?0:(/^-?\d+$/.test(m[2])?parseInt(m[2],10):parseNum(m[2]));
      if(op!=='OUT'&&Number.isNaN(a))throw new Error('Неверное число в «'+line+'»');
      if(op==='LDI')push(a&63);else if(op==='ADDI')push(0x40|(a&63));else if(op==='OUT')push(0x80);else push(0xC0|(a&63));
    }else{
      for(const t of line.split(/[\s,]+/)){
        if(!t)continue;
        const v=/^0x/i.test(t)||/^0b/i.test(t)?parseNum(t):(/^[0-9a-f]+$/i.test(t)?parseInt(t,16):NaN);
        if(Number.isNaN(v))throw new Error('Неверное слово «'+t+'»');
        push(v);
      }
    }
  }
  return data;
}
function pruneCirc(c){
  const m=new Map(c.nodes.map(n=>[n.id,n]));let r=0;
  c.wires=c.wires.filter(w=>{
    const A=m.get(w.from.node),B=m.get(w.to.node);
    let ok=false;
    if(A&&B){const a=pinSpec(A).o[w.from.pin],b=pinSpec(B).i[w.to.pin];ok=a!==undefined&&a===b;}
    if(!ok)r++;return ok;
  });
  return r;
}
const pruneWires=()=>pruneCirc(cur);
function dependsOn(id,target,seen=new Set()){
  if(id===target)return true;
  if(seen.has(id))return false;seen.add(id);
  const d=S.chips[id];if(!d)return false;
  return d.circuit.nodes.some(n=>n.type==='chip'&&n.chip!=='NAND'&&dependsOn(n.chip,target,seen));
}
const circUses=(c,target)=>c.nodes.some(n=>n.type==='chip'&&n.chip!=='NAND'&&dependsOn(n.chip,target));

  if(n.type==='in'||n.type==='out'){

  }else if(n.type==='scope'){

  }else if(n.type==='note'){

  }else if(n.type==='seg'){

  }else if(n.type==='sound'){

  const r=await dlg({title,fields,buttons:[{t:'Отмена',v:null},{t:'Готово',v:'ok',p:true}]});

let AC=null,master=null,gest=false,muted=false;const snd={};
function initAudio(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(AC||!C)return;
  try{AC=new C();master=AC.createGain();master.gain.value=.12;master.connect(AC.destination);}catch(e){AC=null;}
}
document.addEventListener('pointerdown',()=>{gest=true;if(AC&&AC.state==='suspended')AC.resume();},true);
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();});
function audioSync(){
  const sounds=cur.nodes.filter(n=>n.type==='sound');
  $('#bSnd').hidden=!sounds.length||readonly();
  $('#bSnd').textContent=muted?'🔇':'🔊';
  if(!AC){if(gest&&sounds.length)initAudio();if(!AC)return;}
  const seen=new Set(),t=AC.currentTime;
  for(const n of sounds){
    const pr=live&&live.fl.probes[n.id];if(!pr)continue;
    seen.add(n.id);
    let o=snd[n.id];
    if(!o){const osc=AC.createOscillator(),g=AC.createGain();g.gain.value=0;osc.connect(g);g.connect(master);osc.start();o=snd[n.id]={osc,g,wave:null};}
    const wv=n.wave||'square';if(o.wave!==wv){o.osc.type=wv;o.wave=wv;}
    const note=live.sim.rd(pr[0]),en=live.sim.rd(pr[1]);
    o.osc.frequency.setTargetAtTime(55*Math.pow(2,note/12),t,.01);
    o.g.gain.setTargetAtTime(en&&!muted?1:0,t,.012);
  }
  for(const id in snd)if(!seen.has(id)){try{snd[id].osc.stop();snd[id].g.disconnect();}catch(e){}delete snd[id];}
}
$('#bSnd').onclick=()=>{muted=!muted;S.set.mute=muted?1:0;persist();initAudio();audioSync();toast(muted?'Звук выключен':'Звук включён');};

function exBuilder(){
  const nodes=[],wires=[];let k=1;
  return {nodes,wires,
    add:o=>{const n=Object.assign({id:'n'+k++,x:0,y:0},o);nodes.push(n);return n.id;},
    wire:(a,ap,b,bp)=>wires.push({from:{node:a,pin:ap},to:{node:b,pin:bp}}),
    done:()=>({nodes,wires,next:k})};
}
/* счётчик: RAM хранит число, ROM прибавляет единицу */
function exCounter(b,x,y,bits,clk){
  const a0=b.add({type:'const',w:1,val:0,x,y}),we=b.add({type:'const',w:1,val:1,x,y:y+50});
  const ram=b.add({type:'ram',aw:1,dw:bits,data:[0,0],x:x+120,y});
  const size=1<<bits,inc=[];for(let i=0;i<size;i++)inc.push((i+1)%size);
  const rom=b.add({type:'rom',aw:bits,dw:bits,data:inc,x:x+120,y:y+130});
  b.wire(a0,0,ram,0);b.wire(we,0,ram,2);b.wire(clk,0,ram,3);b.wire(ram,0,rom,0);b.wire(rom,0,ram,1);
  return ram;
}
function spiral(n){
  const pts=[];let x0=0,y0=0,x1=n-1,y1=n-1;
  while(x0<=x1&&y0<=y1){
    for(let x=x0;x<=x1;x++)pts.push([x,y0]);
    for(let y=y0+1;y<=y1;y++)pts.push([x1,y]);
    if(y0<y1)for(let x=x1-1;x>=x0;x--)pts.push([x,y1]);
    if(x0<x1)for(let y=y1-1;y>y0;y--)pts.push([x0,y]);
    x0++;y0++;x1--;y1--;
  }
  return pts;
}

function tick(){
  if(!live)return;

function newLevelCircuit(L){
  const ni=L.ins.length,no=L.outs.length,mx=Math.max(ni,no),sp=60,mid=(mx-1)*sp/2;
  const iw=L.inW||ones(ni),ow=L.outW||ones(no);
  const nodes=[];
  L.ins.forEach((l,k)=>nodes.push({id:'i'+k,type:'in',x:0,y:snap(mid+(k-(ni-1)/2)*sp-20),label:l,val:0,w:iw[k],fixed:true}));
  L.outs.forEach((l,k)=>nodes.push({id:'o'+k,type:'out',x:420,y:snap(mid+(k-(no-1)/2)*sp-20),label:l,w:ow[k],fmt:'dec',fixed:true}));
  (L.extra||[]).forEach(e=>nodes.push(clone(e)));
  return {nodes,wires:[],next:1};
}

function specTable(L){
  if(L.seq||L.driver||L.inW||L.ins.length>3)return '';
  let h='<div class="scroll-x"><table><tr>'+L.ins.map(s=>`<th>${esc(s)}</th>`).join('')+L.outs.map((s,i)=>`<th class="${i?'':'sep'}">${esc(s)}</th>`).join('')+'</tr>';
  for(let k=0;k<(1<<L.ins.length);k++){
    const v=bits(k,L.ins.length),o=L.fn(v);
    h+='<tr>'+v.map(b=>`<td>${b}</td>`).join('')+o.map((b,i)=>`<td class="${i?'':'sep'}">${b}</td>`).join('')+'</tr>';
  }
  return h+'</table></div>';
}
async function showIntro(L){
  const base=L.id===1?'<p>Всё в компьютере строится из одного элемента — NAND. Здесь вы пройдёте путь от инвертора до собственного процессора.</p>':'';
  const lim=L.id===1?'':`<p style="color:var(--dim)">Доступны NAND и чипы предыдущих уровней.</p>`;
  const r=await dlg({title:`Уровень ${L.id}: ${L.name}`,html:base+`<p>${esc(L.desc)}</p>`+(L.prog?'<p>Программа в ПЗУ:</p><pre style="margin:0 0 10px;font:13px ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap">'+esc(disasm(L.prog))+'</pre>':'')+specTable(L)+lim,
    buttons:[{t:'Начать заново',v:'reset'},{t:'К схеме',v:'ok',p:true}]});
  if(r.v==='reset'){
    const c=await dlg({title:'Очистить схему?',html:'<p>Все провода и элементы этого уровня будут удалены.</p>',buttons:[{t:'Отмена',v:null},{t:'Очистить',v:'ok',p:true}]});
    if(c.v==='ok'){delete S.work[L.id];enterLevel(L.id,false);}
  }
}
$('#ttl').onclick=()=>{if(mode.kind==='level')showIntro(mode.L);else if(mode.kind==='sandbox')showHelp();};

/* ---------- проверка ---------- */
function resultTable(L,res){
  const rows=res.rows,iw=res.inWs,ow=L.outW||L.outs.map(()=>1);
  const idx=rows.map((r,i)=>i);
  let show=idx;
  if(rows.length>40){show=idx.filter(i=>!rows[i].ok).slice(0,40);if(res.ok)show=idx.slice(0,12);}
  let h='<div class="scroll-x"><table><tr>'+(res.seq?'<th>#</th>':'')+res.inNames.map(s=>`<th>${esc(s)}</th>`).join('')
    +L.outs.map((s,i)=>`<th class="${i?'':'sep'}">${esc(s)} ожид.</th>`).join('')
    +L.outs.map((s,i)=>`<th class="${i?'':'sep'}">${esc(s)} факт</th>`).join('')+'</tr>';
  for(const i of show){
    const r=rows[i];
    h+='<tr>'+(res.seq?`<td>${i+1}</td>`:'')+r.in.map((b,k)=>`<td>${cellFmt(b,iw[k])}</td>`).join('')
      +r.exp.map((b,k)=>`<td class="${k?'':'sep'}${b===null?' dc':''}">${cellFmt(b,ow[k])}</td>`).join('')
      +r.got.map((b,k)=>`<td class="${(k?'':'sep ')+((r.exp[k]!==null&&r.exp[k]!==b)?'bad':'')}">${cellFmt(b,ow[k])}</td>`).join('')+'</tr>';
  }
  h+='</table></div>';
  if(show.length<rows.length)h+=`<p style="color:var(--dim);font-size:13px">Показано ${show.length} из ${rows.length} строк.</p>`;
  if(L.ticks)h+='<p style="color:var(--dim);font-size:13px">Каждая строка — один такт: тест подаёт вход, читает выход, затем делает такт.</p>';
  if(res.seq)h+='<p style="color:var(--dim);font-size:13px">Точка — значение ещё не определено, такой выход не проверяется.</p>';
  if(Math.max(...iw,...ow)>4)h+='<p style="color:var(--dim);font-size:13px">Шины показаны в 16-ричном виде.</p>';
  return h;
}
async function runCheck(){
  if(mode.kind!=='level')return;
  const L=mode.L,res=runTests(L,cur);
  if(res.error){toast(res.error);return;}
  if(!res.ok){
    await dlg({title:'Не сходится',html:`<p class="res-bad">Ошибок: ${res.bad} из ${res.rows.length}</p>`+(res.unst?'<p>Схема не успокаивается — проверьте обратные связи.</p>':'')+resultTable(L,res),
      buttons:[{t:'К схеме',v:'ok',p:true}]});
    return;
  }
  const fl=res.fl,prev=S.done[L.id];
  const g=prev?Math.min(prev.g,fl.nand):fl.nand;
  const d=prev?(prev.d===null?fl.delay:fl.delay===null?prev.d:Math.min(prev.d,fl.delay)):fl.delay;
  S.done[L.id]={g,d};
  S.lchips['L'+L.id]={id:'L'+L.id,name:L.short,inputs:L.ins.slice(),outputs:L.outs.slice(),
    inW:(L.inW||ones(L.ins.length)).slice(),outW:(L.outW||ones(L.outs.length)).slice(),
    inIds:L.ins.map((_,i)=>'i'+i),outIds:L.outs.map((_,i)=>'o'+i),circuit:clone(cur),level:L.id,gates:fl.nand};
  rebuildChips();persist();
  const next=LEVELS.find(l=>l.id===L.id+1);
  const r=await dlg({title:'Уровень пройден',
    html:`<p class="res-ok">Все ${res.rows.length} проверок сошлись.</p><p>NAND: ${fl.nand} (лучший ${g}). ${fl.delay===null?'Схема с памятью.':'Задержка: '+fl.delay+' (лучшая '+(d??'—')+').'}</p><p>Чип «${esc(L.short)}» добавлен в набор: теперь его можно использовать в следующих уровнях и в песочнице.</p>`,
    buttons:[{t:'Остаться',v:'stay'},...(next?[{t:'Дальше',v:'next',p:true}]:[{t:'Готово',v:'stay',p:true}])]});
  if(r.v==='next')enterLevel(next.id,true);
}
$('#bAct').onclick=()=>{if(readonly())goBack();else if(mode.kind==='chipedit')saveChipEdit();else if(mode.kind==='level')runCheck();else saveChip();};

/* ---------- песочница ---------- */
const byPos=(a,b)=>a.y-b.y||a.x-b.x;
async function showTable(){
  const ins=cur.nodes.filter(n=>n.type==='in'||n.type==='clock').sort(byPos),outs=cur.nodes.filter(n=>n.type==='out').sort(byPos);
  if(!live||!ins.length||!outs.length){toast('Нужен хотя бы один вход и один выход');return;}
  const tb=sumOf(ins.map(n=>n.type==='clock'?1:(n.w||1)));
  if(tb>10){toast('Для таблицы нужно не больше 10 входных бит (сейчас '+tb+')');return;}
  const sim=new Sim(live.fl);let rows='';
  const iw=ins.map(n=>n.type==='clock'?1:(n.w||1));
  for(let k=0;k<(1<<tb);k++){
    sim.reset();let r=k;const v=iw.map(w=>{const x=r&((1<<w)-1);r>>>=w;return x;});
    ins.forEach((n,i)=>{live.fl.outs[n.id][0].forEach((net,b)=>{sim.v[net]=(v[i]>>>b)&1;});});sim.settle();
    rows+='<tr>'+v.map((x,i)=>`<td>${cellFmt(x,iw[i])}</td>`).join('')+outs.map((n,i)=>`<td class="${i?'':'sep'}">${cellFmt(sim.rd(live.fl.res[n.id]),n.w||1)}</td>`).join('')+'</tr>';
  }
  const head='<tr>'+ins.map(n=>`<th>${esc(n.label||'')}</th>`).join('')+outs.map((n,i)=>`<th class="${i?'':'sep'}">${esc(n.label||'')}</th>`).join('')+'</tr>';
  await dlg({title:'Таблица истинности',html:`<div class="scroll-x"><table>${head}${rows}</table></div><p style="color:var(--dim);font-size:13px">Каждая строка считается с чистого листа, поэтому схемы с памятью показывают состояние после включения. Шины — в 16-ричном виде.</p>`,buttons:[{t:'Закрыть',v:'ok',p:true}]});
}
$('#bTab').onclick=()=>{if(mode.kind==='chipedit')cancelChipEdit();else showTable();};
async function saveChip(){
  const ins=cur.nodes.filter(n=>n.type==='in').sort(byPos),outs=cur.nodes.filter(n=>n.type==='out').sort(byPos);
  if(!ins.length||!outs.length){toast('Добавьте хотя бы один вход и один выход');return;}
  if(cur.nodes.some(n=>n.type==='clock'||n.type==='btn')){toast('Такт и кнопки нельзя класть внутрь чипа — сделайте их входами');return;}
  const r=await dlg({title:'Сохранить как чип',html:`<p>Входов: ${ins.length}, выходов: ${outs.length}. Порядок контактов — сверху вниз, как на схеме.</p>`,input:'',
    buttons:[{t:'Отмена',v:null},{t:'Сохранить',v:'ok',p:true}]});
  const name=r.text.trim();
  if(r.v!=='ok')return;
  if(!name){toast('Введите имя чипа');return;}
  const id='C'+(S.nextChip++);
  const circ=clone(cur);circ.nodes.forEach(n=>{if(n.type==='in')n.val=0;delete n.fixed;});
  S.chips[id]={id,name,inputs:ins.map(n=>n.label||'?'),outputs:outs.map(n=>n.label||'?'),
    inW:ins.map(n=>n.w||1),outW:outs.map(n=>n.w||1),
    inIds:ins.map(n=>n.id),outIds:outs.map(n=>n.id),circuit:circ,gates:live?live.fl.nand:undefined};
  rebuildChips();persist();toast('Чип «'+name+'» сохранён — он в палитре');
}

/* =====================================================================
   МЕНЮ, СПРАВКА, ЭКСПОРТ
   ===================================================================== */
function openSettings(){
  const st=S.set;
  const row=(k,t,sub)=>`<div class="row" role="button" tabindex="0" data-set="${k}"><div class="t"><b>${t}</b><small>${sub}</small></div></div>`;
  const h='<div class="sh-h">Настройки</div>'
    +row('wire','Стиль проводов',st.wire==='curve'?'Плавные кривые. Нажмите — ломаные':'Ломаные под прямым углом. Нажмите — плавные')
    +row('grid','Точки сетки',st.grid?'Показаны. Нажмите, чтобы скрыть':'Скрыты. Нажмите, чтобы показать')
    +row('mute','Звук',st.mute?'Выключен. Нажмите, чтобы включить':'Включён. Нажмите, чтобы выключить');
  openSheet(h,e=>{
    const r=e.target.closest('[data-set]');if(!r)return;
    const k=r.dataset.set;
    if(k==='wire')st.wire=st.wire==='curve'?'ortho':'curve';
    else if(k==='grid')st.grid=st.grid?0:1;
    else if(k==='mute'){st.mute=st.mute?0:1;muted=!!st.mute;audioSync();}
    persist();need();openSettings();
  });
}
function exportPng(){
  draw();
  if(!cv.toBlob){toast('Снимок не поддерживается в этом браузере');return;}
  cv.toBlob(b=>{
    if(!b){toast('Не удалось сделать снимок');return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nand-lab-schema.png';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('Снимок сохранён в загрузки');
  });
}
function openMenu(){
  let h='<div class="sh-h">NAND-мастерская</div>';
  h+=`<div class="row" role="button" data-go="sandbox"><div class="n">∞</div><div class="t"><b>Песочница</b><small>свободная сборка, шины, память, свои чипы</small></div></div>`;
  h+='<div class="sec">Уровни</div>';
  LEVELS.forEach(L=>{
    if(L.id===24)h+='<div class="sec">Синхронные схемы: задержка и такты</div>';
    if(L.id===30)h+='<div class="sec">Финал</div>';
    const ok=unlocked(L.id),d=S.done[L.id];
    h+=`<button class="row" ${ok?'':'disabled'} data-go="level:${L.id}"><div class="n ${d?'ok':''}">${d?'✓':L.id}</div><div class="t"><b>${esc(L.name)}</b><small>${d?`NAND ${d.g}${d.d===null?'':', задержка '+d.d}`:ok?esc(L.desc.slice(0,60))+'…':'откроется после: '+(L.req||[L.id-1]).join(', ')}</small></div></button>`;
  });
  h+='<div class="sec">Примеры для песочницы</div>';
  EXAMPLES.forEach((e,i)=>{h+=`<div class="row" role="button" data-go="ex:${i}"><div class="t"><b>${esc(e.name)}</b><small>${esc(e.desc.slice(0,64))}…</small></div></div>`;});
  h+='<div class="sec">Прочее</div>';
  h+='<div class="row" role="button" data-go="settings"><div class="t"><b>Настройки</b><small>стиль проводов, сетка, звук</small></div></div>';
  h+='<div class="row" role="button" data-go="shot"><div class="t"><b>Снимок схемы</b><small>сохранить текущий вид как PNG</small></div></div>';
  h+='<div class="row" role="button" data-go="help"><div class="t"><b>Как играть</b></div></div>';
  h+='<div class="row" role="button" data-go="new"><div class="t"><b>Что нового</b></div></div>';
  h+='<div class="row" role="button" data-go="io"><div class="t"><b>Сохранение: экспорт и импорт</b><small>перенос прогресса и чипов</small></div></div>';
  h+='<div class="row" role="button" data-go="wipe"><div class="t"><b style="color:var(--bad)">Сбросить всё</b></div></div>';
  openSheet(h,async e=>{
    const r=e.target.closest('[data-go]');if(!r||r.disabled)return;
    const v=r.dataset.go;closeSheet();
    if(v==='sandbox')enterSandbox();
    else if(v.startsWith('level:'))enterLevel(+v.slice(6),true);
    else if(v.startsWith('ex:'))loadExample(EXAMPLES[+v.slice(3)]);
    else if(v==='help')showHelp();
    else if(v==='settings')openSettings();
    else if(v==='shot')exportPng();
    else if(v==='new')showNew();
    else if(v==='io')showIO();
    else if(v==='wipe'){
      const c=await dlg({title:'Сбросить всё?',html:'<p>Прогресс, чипы и схемы будут удалены без возможности восстановления.</p>',buttons:[{t:'Отмена',v:null},{t:'Сбросить',v:'ok',p:true}]});
      if(c.v==='ok'){S={done:{},lchips:{},chips:{},work:{},sandbox:null,nextChip:1,mode:'level:1',seen:VER};rebuildChips();persist();enterLevel(1,true);}
    }
  });
}
$('#bMenu').onclick=openMenu;
function showNew(){
  return dlg({title:'Что нового в версии 5',html:`<ul class="new" style="padding-left:18px;margin:0">
  <li><b>Группы элементов.</b> Кнопка ☐ включает выделение: тап по элементам или рамка по пустому месту. Группу можно двигать, копировать, вырезать и удалять. Кнопка 📋 вставляет её, в том числе в другой уровень или чип.</li>
  <li><b>Правка своих чипов.</b> Выделите сохранённый чип в песочнице и нажмите «Править». После «Сохранить» обновятся все его копии.</li>
  <li><b>Три новых уровня.</b> Распознаватель 101, счётчик по модулю 10 и финал «Компьютер»: подключите свой процессор к ПЗУ с программой.</li>
  <li><b>Настройки.</b> Ломаные провода, сетка, звук.</li>
  <li><b>Поиск</b> в списке элементов и <b>снимок схемы</b> в PNG.</li></ul>`,buttons:[{t:'Понятно',v:'ok',p:true}]});
}
function showHelp(){
  dlg({title:'Как играть',html:`
  <p><b>Провод.</b> Потяните от кружка справа у элемента к кружку слева у другого. Чтобы переподключить, потяните за занятый вход; отпустите в пустом месте — провод удалится. Соединяются только контакты одной ширины.</p>
  <p><b>Шины.</b> Квадратные контакты и толстые провода несут несколько бит. «Разветвитель» делит шину, «Объединитель» собирает. Ширина задаётся в «Настроить».</p>
  <p><b>Входы.</b> Тап по одиночному входу переключает 0 и 1, по шине — открывает ввод числа. Тап по выходу-шине меняет формат: 10-ичный, 16-ричный, двоичный, со знаком.</p>
  <p><b>Элементы.</b> Кнопка «+» добавляет элементы. Перетаскивайте за корпус. Долгое нажатие или перетаскивание выделяет элемент: «Удалить», «Копия», «Настроить».</p>
  <p><b>Группы.</b> ☐ — режим выделения. Тап по элементу добавляет или убирает его, рамка по пустому месту выделяет всё внутри. Выделенное можно двигать пальцем. «Копировать» и «Вырезать» кладут группу вместе с проводами в буфер, 📋 вставляет. Двумя пальцами поле можно двигать и в режиме выделения.</p>
  <p><b>Чипы.</b> В песочнице выделите свой чип и нажмите «Править»: он откроется как схема. «Сохранить» обновит все копии.</p>
  <p><b>Время.</b> «Задержка» запоминает вход на один такт. Такт делается кнопкой «Такт» или кнопкой ▶. Тактовый генератор меняет значение на каждом такте, поэтому его период — два такта. Осциллограф рисует сигналы по тактам.</p>
  <p><b>Периферия.</b> Экран, терминал, индикатор, звук и кнопка — в «+» (песочница и последний уровень). Экран и терминал пишут по фронту CLK, когда WE=1. «Внутри» на выделенном чипе показывает его схему.</p>
  <p><b>Вид.</b> Один палец двигает поле, два — масштабируют. ⌖ показывает всю схему. ↶ и ↷ отменяют и повторяют действия.</p>
  <p><b>Уровни.</b> Соберите нужное поведение и нажмите «Проверить». Пройденная схема превращается в чип для следующих уровней.</p>
  <p><b>Песочница.</b> Свои входы, выходы, такт и память. «В чип» сохраняет схему как новый элемент. Схемы с обратной связью работают: время идёт по одному такту на вентиль.</p>
  <p style="color:var(--dim)">Всё сохраняется автоматически на этом устройстве.</p>`,buttons:[{t:'Понятно',v:'ok',p:true}]});
}
async function showIO(){
  persist();
  const json=JSON.stringify(S);
  const r=await dlg({title:'Экспорт и импорт',html:'<p>Скопируйте текст, чтобы сохранить прогресс. Чтобы загрузить — вставьте текст в поле и нажмите «Загрузить».</p>',area:json,
    buttons:[{t:'Закрыть',v:null},
      {t:'Копировать',keep:async(vals,btn)=>{try{await navigator.clipboard.writeText(vals.text);btn.textContent='Скопировано';}catch(e){const ta=document.querySelector('.modal textarea');ta.select();btn.textContent='Выделено — копируйте';}}},
      {t:'Загрузить',v:'load',p:true}]});
  if(r.v==='load'){
    try{
      const s=JSON.parse(r.text);if(!s||typeof s!=='object'||!s.done)throw 0;
      S=s;persist();S=loadSave();rebuildChips();
      if(S.mode==='sandbox')enterSandbox();else enterLevel(+(S.mode.split(':')[1])||1,false);
      toast('Сохранение загружено');
    }catch(e){toast('Не удалось прочитать сохранение');}
  }
}

/* =====================================================================
   СТАРТ
   ===================================================================== */
resize();
muted=!!S.set.mute;
{
  const veteran=S.seen<VER&&(Object.keys(S.done).length>0||S.sandbox);
  S.seen=VER;
  if(S.mode==='sandbox')enterSandbox();
  else{const id=+(S.mode.split(':')[1])||1;enterLevel(unlocked(id)&&LEVELS.some(l=>l.id===id)?id:1,true);}
  if(veteran)showNew();
}
