<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NAND">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Соберите компьютер из одного элемента NAND: головоломки по цифровой логике.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NAND-мастерская</title>
<style>
:root{
  --bg:#0e2535; --bar:#0a1d2b; --panel:#12303f; --panel2:#1a4157; --line:#2b5870;
  --text:#e3f1f8; --dim:#8fb0c4; --on:#ffc247; --ok:#5fe0a8; --bad:#ff6b6b; --sel:#6ee7c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 Roboto,"Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:var(--panel2);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}
button:active{filter:brightness(1.25)}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
button.pri{background:var(--on);color:#2a1b00;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
#bMenu{width:44px;padding:0;font-size:20px}
#ttl{flex:1;min-width:0;padding:2px 4px;cursor:pointer}
#tName{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tSub{display:flex;gap:12px;color:var(--dim);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:16px;white-space:nowrap;overflow:hidden}
#tSub .w{color:var(--bad)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none;display:block}
#selbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel);
  border:1px solid var(--sel);border-radius:14px;padding:5px;max-width:96%;overflow-x:auto}
#selbar[hidden],#clk[hidden]{display:none}
#stepbar{position:absolute;top:8px;left:8px;right:8px;background:var(--panel);border:1px solid var(--on);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#stepbar .tx{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:nowrap}
#stepbar .tx .ok{color:var(--ok)}#stepbar .tx .bad{color:var(--bad);font-weight:700}#stepbar .tx .chg{color:var(--on)}
#stepbar .bt{display:flex;gap:6px}#stepbar .bt button{min-height:40px;flex:1}
 #hintMap{position:absolute;z-index:5;left:12px;top:90px;width:min(390px,calc(100% - 24px));background:var(--panel);border:1px solid var(--on);border-radius:14px;box-shadow:0 8px 28px #0009;touch-action:none}
 #hintMap .hm-head{padding:9px 12px;background:var(--bar);border-radius:13px 13px 0 0;display:flex;justify-content:space-between;align-items:center;cursor:move;font-weight:700}
 #hintMap .hm-body{padding:12px;max-height:42vh;overflow:auto;touch-action:pan-y;user-select:text}
 #hintMap .hm-body p{margin:0 0 8px}#hintMap .hm-body .hm-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
 #hintMap .hm-flow span{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bar);font:12px ui-monospace,monospace}
 #saveBadge{min-height:34px;padding:0 9px;font-size:11px;white-space:nowrap;color:var(--ok)}
 #saveBadge.pending{color:var(--on)}#saveBadge.failed{color:var(--bad);border-color:var(--bad)}
 @media(max-width:700px){#saveBadge{font-size:0;width:36px;padding:0}#saveBadge::first-letter{font-size:15px}}
#selbar button{min-height:40px;white-space:nowrap}
#hist{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px}
#hist button{width:42px;min-height:42px;padding:0;font-size:19px;background:var(--panel);border:1px solid var(--line);border-radius:21px}
#hist button.on{background:var(--on);color:#2a1b00;border-color:var(--on)}
#clk{position:absolute;left:10px;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:5px}
#fab{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;
  background:var(--on);color:#2a1b00;font-size:32px;font-weight:300;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#fit{position:absolute;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:22px;padding:0;
  background:var(--panel);border:1px solid var(--line);font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);padding:10px 16px;border-radius:12px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center}
#toast.on{opacity:1}
#back{position:fixed;inset:0;background:rgba(3,10,16,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);transform:translateY(105%);transition:transform .22s ease;z-index:11;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));touch-action:pan-y;overscroll-behavior:contain}
#sheet.on{transform:none}
.sh-h{padding:16px 16px 8px;font-size:18px;font-weight:700}
.sec{padding:12px 16px 4px;color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border-radius:0;background:transparent;text-align:left;border-bottom:1px solid rgba(43,88,112,.5)}
.row .n{width:28px;height:28px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:13px;flex:none;font-family:ui-monospace,Menlo,monospace}
.row .n.ok{background:var(--ok);color:#06281a}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--dim);display:block;font-size:12px}
.row[disabled]{opacity:.4}
.row .x{width:40px;min-height:40px;padding:0;flex:none;background:transparent;color:var(--bad);font-size:20px}
.modal{position:fixed;inset:0;background:rgba(3,10,16,.7);display:grid;place-items:center;z-index:40;padding:16px;touch-action:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column}
.card h2{margin:0;padding:16px 16px 6px;font-size:18px}
.card .body{padding:4px 16px 8px;overflow:auto;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.card .body p{margin:0 0 10px}
.card .btns{display:flex;gap:8px;padding:10px 16px 16px;flex-wrap:wrap;justify-content:flex-end}
.fl{display:block;margin:6px 0 0;color:var(--dim);font-size:13px}
.inp{display:block;margin:4px 0 0;width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bar);color:var(--text);padding:0 12px;font:inherit;user-select:text;-webkit-user-select:text}
textarea.inp{min-height:150px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.inp[multiple],select.inp{appearance:auto}
.bitgrid{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.bitgrid button{min-height:40px;width:34px;padding:0;font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--bar);border:1px solid var(--line)}
.bitgrid button.on{background:var(--on);color:#2a1b00;border-color:var(--on)}
.bitgrid small{width:100%;color:var(--dim);font-size:12px}
table{border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin:6px 0}
th,td{padding:4px 7px;text-align:center;border-bottom:1px solid rgba(43,88,112,.6);white-space:nowrap}
th{color:var(--dim);font-weight:500}
td.sep,th.sep{border-left:1px solid var(--line)}
td.bad{background:rgba(255,107,107,.25);color:#ffd0d0;font-weight:700}
td.dc{color:var(--dim)}
.res-ok{color:var(--ok);font-weight:700}
.res-bad{color:var(--bad);font-weight:700}
.scroll-x{overflow-x:auto;touch-action:pan-x pan-y}
.new li{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){#sheet,#back,#toast{transition:none}}

/* ===== 14.0: темы, доступность, нижняя панель ===== */
:root[data-theme="light"]{--bg:#eef4f8;--bar:#dce8f0;--panel:#ffffff;--panel2:#e1ecf3;--line:#a9c1d0;--text:#12303f;--dim:#4a6a7e;--on:#d98200;--ok:#0a8a5a;--bad:#c62828;--sel:#00806a;color-scheme:light}
:root[data-theme="light"] .modal{background:rgba(20,40,55,.45)}
:root[data-theme="contrast"]{--bg:#000;--bar:#000;--panel:#0a0a0a;--panel2:#1c1c1c;--line:#fff;--text:#fff;--dim:#d6d6d6;--on:#ffe600;--ok:#00ff9c;--bad:#ff5c5c;--sel:#00e5ff}
:root[data-theme="contrast"] button:not(.pri){border:1px solid #fff}
:root[data-theme="contrast"] .row{border-bottom-color:#fff}
:root[data-theme="colorblind"]{--on:#f0e442;--ok:#56b4e9;--bad:#e3622a;--sel:#cc79a7;--dim:#9db8c9}
:root[data-text="large"] #sheet,:root[data-text="large"] .modal,:root[data-text="large"] #bar{font-size:18px}
:root[data-text="large"] .row{min-height:68px}
:root[data-text="large"] .row small{font-size:14px}
:root[data-motion="reduced"] *,:root[data-motion="reduced"] *::before,:root[data-motion="reduced"] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.row small{display:block;color:var(--dim);font-size:12px}
.row:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
#bTools{width:44px;padding:0;font-size:19px}
#sheet:focus{outline:none}
/* Верхняя панель никогда не переносится на вторую строку: название сжимается, кнопки остаются на месте. */
#bar{flex-wrap:nowrap!important}
#bar>button,#bar>#saveBadge{flex:none}
#bTab{padding:0 12px}
#ttl{flex:1 1 0!important;min-width:0!important;overflow:hidden}
@media (max-width:400px){#bTab{padding:0 8px;font-size:14px}#bAct{padding:0 12px;font-size:15px}#bar{gap:6px}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="bMenu" aria-label="Меню">☰</button>
    <div id="ttl" role="button" tabindex="0"><span id="tName"></span><span id="tSub"></span></div>
    <button id="bTab" class="ghost" hidden>Таблица</button>
    <button id="saveBadge" class="ghost" title="Сохранение на этом устройстве · нажмите для экспорта">✓ Локально</button>
    <button id="bAct" class="pri"></button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="selbar" hidden></div>
    <div id="stepbar" hidden></div>
    <div id="clk" hidden></div>
    <div id="hist"><button id="bUndo" aria-label="Отменить">↶</button><button id="bRedo" aria-label="Повторить">↷</button><button id="bSelM" aria-label="Выделение группы">☐</button><button id="bPaste" hidden aria-label="Вставить">📋</button><button id="bSnd" hidden aria-label="Звук">🔊</button></div>
    <button id="fit" aria-label="Показать всё">⌖</button>
    <button id="fab" aria-label="Добавить элемент">+</button>
  </main>
</div>
<div id="back"></div>
<div id="sheet" role="dialog"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   ДВИЖОК: разворачивание схемы (с шинами) в сеть NAND-вентилей + память
   ===================================================================== */
//ENGINE-START
let CHIPS={};
const NAND_DEF={id:'NAND',name:'NAND',inputs:['A','B'],outputs:['Y']};
const chipInfo=id=>id==='NAND'?NAND_DEF:(CHIPS[id]||null);
const ones=n=>Array(n).fill(1);
const sumOf=a=>a.reduce((s,x)=>s+x,0);
const defIn=d=>d.inW||ones(d.inputs.length);
const defOut=d=>d.outW||ones(d.outputs.length);
const maskOf=w=>w>=32?0xFFFFFFFF:(2**w-1);
const lanes=(n,d)=>(n.w>1&&defIn(d).every(x=>x===1)&&defOut(d).every(x=>x===1))?n.w:1;
function pinSpec(n){
  const w=n.w||1;
  switch(n.type){
    case 'in':case 'clock':case 'const':return {i:[],o:[n.type==='clock'?1:w]};
    case 'c0':case 'c1':return {i:[],o:[1]};
    case 'out':return {i:[w],o:[]};
    case 'btn':return {i:[],o:[1]};
    case 'seg':return {i:[n.w===8?8:4],o:[]};
    case 'sound':return {i:[n.nb||6,1],o:[]};
    case 'screen':return {i:[n.xb||4,n.yb||4,n.cb||1,1,1],o:[]};
    case 'tty':return {i:[8,1,1],o:[]};
    case 'delay':return {i:[w],o:[w]};
    case 'switch':return {i:[],o:[1]};
    case 'rng':return {i:[],o:[n.w||8]};
    case 'scope':return {i:(n.ch||[1,1,1,1]).slice(),o:[]};
    case 'note':return {i:[],o:[]};
    case 'split':return {i:[sumOf(n.ws)],o:n.ws.slice()};
    case 'merge':return {i:n.ws.slice(),o:[sumOf(n.ws)]};
    case 'rom':return {i:n.wr?[n.aw,n.dw,1,1]:[n.aw],o:[n.dw]};
    case 'ram':return {i:[n.aw,n.dw,1,1],o:[n.dw]};
    case 'chip':{
      if(n.chip==='NAND')return {i:[w,w],o:[w]};
      const d=chipInfo(n.chip);if(!d)return {i:[],o:[]};const W=lanes(n,d);return W>1?{i:defIn(d).map(()=>W),o:defOut(d).map(()=>W)}:{i:defIn(d),o:defOut(d)};
    }
  }
  return {i:[],o:[]};
}
function pinCount(n){const s=pinSpec(n);return [s.i.length,s.o.length];}
function calcDelay(g,n,targets){
  const drv=new Int32Array(n).fill(-1),m=g.length/3;
  for(let i=0;i<m;i++)drv[g[3*i+2]]=i;
  const memo=new Int32Array(n).fill(-2);let cyc=false;
  const stk=[];
  function run(root){
    stk.push(root);
    while(stk.length){
      const net=stk[stk.length-1],k=drv[net];
      if(memo[net]>=0){stk.pop();continue;}
      if(k<0){memo[net]=0;stk.pop();continue;}
      const a=g[3*k],b=g[3*k+1];
      if(memo[net]===-2){
        memo[net]=-3;
        if(memo[a]===-2)stk.push(a);
        if(b!==a&&memo[b]===-2)stk.push(b);
        continue;
      }
      let va=memo[a],vb=memo[b];
      if(va<0){cyc=true;va=0;}
      if(vb<0){cyc=true;vb=0;}
      memo[net]=1+Math.max(va,vb);stk.pop();
    }
  }
  let mx=0;
  for(const t of targets){if(memo[t]===-2)run(t);mx=Math.max(mx,memo[t]>0?memo[t]:0);}
  return cyc?null:mx;
}
function flatten(circ){
  const parent=[0,1];let nNets=2;
  const nl=()=>{parent.push(nNets);return nNets++;};
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  const union=(a,b)=>{a=find(a);b=find(b);if(a===b||(a<2&&b<2))return;if(a<2)parent[b]=a;else parent[a]=b;};
  const fresh=w=>{const r=[];for(let k=0;k<w;k++)r.push(nl());return r;};
  const fitArr=(a,w)=>{const r=new Array(w);for(let k=0;k<w;k++)r[k]=(a&&a[k]!==undefined)?a[k]:0;return r;};
  const gates=[],cells=[],probes={};
  function inst(c,inNets,depth){
    if(depth>32)throw new Error('Слишком глубокая вложенность чипов');
    const outs={};
    for(const n of c.nodes){
      const sp=pinSpec(n);
      if(n.type==='in')outs[n.id]=[inNets?fitArr(inNets[n.id],sp.o[0]):fresh(sp.o[0])];
      else if(n.type==='switch')outs[n.id]=depth===0?[fresh(1)]:[[(n.val|0)&1]];
      else if(n.type==='clock'||n.type==='btn')outs[n.id]=[fresh(1)];
      else if(n.type==='const'){const v=(n.val>>>0),w=sp.o[0],a=[];for(let k=0;k<w;k++)a.push(k<32&&((v>>>k)&1)?1:0);outs[n.id]=[a];}
      else if(n.type==='c1')outs[n.id]=[[1]];
      else if(n.type==='c0')outs[n.id]=[[0]];
      else if(n.type==='out')outs[n.id]=[];
      else outs[n.id]=sp.o.map(w=>fresh(w));
    }
    const into={};
    for(const w of c.wires){
      const so=outs[w.from.node];
      if(!so||so[w.from.pin]===undefined)continue;
      into[w.to.node+':'+w.to.pin]=so[w.from.pin];
    }
    const get=(n,k,w)=>fitArr(into[n.id+':'+k],w);
    const result={};
    for(const n of c.nodes){
      const sp=pinSpec(n);
      if(n.type==='out')result[n.id]=get(n,0,sp.i[0]);
      else if(n.type==='chip'){
        const d=chipInfo(n.chip);if(!d)continue;
        if(n.chip==='NAND'){
          const A=get(n,0,sp.i[0]),B=get(n,1,sp.i[1]),O=outs[n.id][0];
          for(let k=0;k<O.length;k++)gates.push(A[k],B[k],O[k]);
        }else if(lanes(n,d)>1){
          const W=lanes(n,d),ins=defIn(d).map((_,i)=>get(n,i,W));
          for(let k=0;k<W;k++){const m={};defIn(d).forEach((_,i)=>{m[d.inIds[i]]=[ins[i][k]];});
            const r=inst(d.circuit,m,depth+1);defOut(d).forEach((_,i)=>union(outs[n.id][i][k],fitArr(r.result[d.outIds[i]],1)[0]));}
        }else{
          const m={};defIn(d).forEach((w,i)=>{m[d.inIds[i]]=get(n,i,w);});
          const r=inst(d.circuit,m,depth+1);
          defOut(d).forEach((w,i)=>{const rn=fitArr(r.result[d.outIds[i]],w);rn.forEach((x,k)=>union(outs[n.id][i][k],x));});
        }
      }else if(n.type==='split'){
        const a=get(n,0,sp.i[0]);let p=0;
        n.ws.forEach((wk,i)=>{for(let k=0;k<wk;k++)union(outs[n.id][i][k],a[p+k]);p+=wk;});
      }else if(n.type==='merge'){
        let p=0;
        n.ws.forEach((wk,i)=>{const a=get(n,i,wk);for(let k=0;k<wk;k++)union(outs[n.id][0][p+k],a[k]);p+=wk;});
      }else if(n.type==='rom'){
        cells.push(n.wr?{t:'rom',wr:1,a:get(n,0,n.aw),d:get(n,1,n.dw),we:get(n,2,1)[0],clk:get(n,3,1)[0],o:outs[n.id][0],data:n.data||[],nid:depth===0?n.id:null}:{t:'rom',a:get(n,0,n.aw),o:outs[n.id][0],data:n.data||[],nid:depth===0?n.id:null});
      }else if(n.type==='ram'){
        cells.push({t:'ram',a:get(n,0,n.aw),d:get(n,1,n.dw),we:get(n,2,1)[0],clk:get(n,3,1)[0],o:outs[n.id][0],data:n.data||[],nid:depth===0?n.id:null});
      }else if(n.type==='seg'||n.type==='sound'){
        if(depth===0)probes[n.id]=sp.i.map((pw,k)=>get(n,k,pw));
      }else if(n.type==='screen'){
        cells.push({t:'screen',x:get(n,0,sp.i[0]),y:get(n,1,sp.i[1]),d:get(n,2,sp.i[2]),we:get(n,3,1)[0],clk:get(n,4,1)[0],nid:depth===0?n.id:null});
      }else if(n.type==='tty'){

function ttyPut(t,c){
  const COLS=16,ROWS=4;c&=127;

  if(c===10)t.cur=(Math.floor(t.cur/COLS)+1)*COLS;

  else if(c>=32&&c<127){t.buf[t.cur]=c;t.cur++;}

function cpuDriver(io){
  const rows=[];let pc=0,acc=0,out=0;

  const clock=(rst,ins)=>{io.set(1,rst);io.set(2,ins);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};
  clock(1,0);
  rows.push({in:[1,0],exp:[0,0],got:[io.get(0),io.get(1)]});
  for(let i=0;i<48;i++){

    clock(0,ins);

    else if(op===2)out=acc;
    else if(acc!==0)npc=imm;

  }

}

function isaRun(prog){

    step(){const mi=prog[pc]??0,op=mi>>6,imm=mi&63;let np=(pc+1)&255;
      if(op===0)acc=imm;else if(op===1)acc=(acc+(imm>=32?imm-64:imm))&255;else if(op===2)out=acc;else if(acc!==0)np=imm;pc=np;},
    get pc(){return pc;},get out(){return out;}};
}
function disasm(prog){

}
function computerDriver(io){

  const clock=rst=>{io.set(1,rst);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};

function genVecs(L){
  const W=L.inW||L.ins.map(()=>1),T=sumOf(W),out=[];
  if(T<=10){
    for(let k=0;k<(1<<T);k++){let r=k;out.push(W.map(w=>{const v=r&((1<<w)-1);r>>>=w;return v;}));}
    return out;
  }
  const mx=W.map(w=>maskOf(w));
  for(let m=0;m<(1<<Math.min(W.length,4));m++)out.push(W.map((w,i)=>(m>>i)&1?mx[i]:0));
  out.push(W.map((w,i)=>i===0?1:0));out.push(W.map(()=>1));
  if(L.edges)L.edges.forEach(e=>out.push(e.slice()));
  let s=12345;
  const rnd=()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
  for(let i=0;i<300;i++)out.push(W.map(w=>Math.floor(rnd()*2**w)));
  return out;
}
function runTests(L,circ){
  let fl;try{fl=flatten(circ);}catch(e){return {error:e.message};}
  const sim=new Sim(fl);
  const inN=L.ins.map((_,i)=>fl.outs['i'+i]?.[0]);
  const outN=L.outs.map((_,i)=>fl.res['o'+i]);
  if(inN.some(x=>x===undefined)||outN.some(x=>x===undefined))return {error:'Не найдены входы или выходы уровня'};
  const setOne=(i,x)=>{const nets=inN[i];for(let k=0;k<nets.length;k++)sim.v[nets[k]]=k<32?(x>>>k)&1:0;};
  const setv=vec=>vec.forEach((x,i)=>setOne(i,x));
  const getv=()=>outN.map(nets=>sim.rd(nets));
  const rows=[];let unst=0;
  const same=(e,g)=>e===null||e===g;
  if(L.driver){
    const rs=L.driver({reset:()=>sim.reset(),set:setOne,settle:()=>{if(!sim.settle())unst++;},get:i=>sim.rd(outN[i])});
    rs.forEach(r=>rows.push({in:r.in,exp:r.exp,got:r.got,ok:r.exp.every((e,i)=>same(e,r.got[i]))}));
  }else if(L.seq){
    const model=L.model();sim.reset();
    for(const vec of L.seq){
      setv(vec);if(!sim.settle())unst++;
      const exp=model(vec),got=getv();
      rows.push({in:vec,exp,got,ok:exp.every((e,i)=>same(e,got[i]))});
      if(L.ticks&&!sim.tick())unst++;
    }
  }else{
    for(const vec of genVecs(L)){
      sim.reset();setv(vec);if(!sim.settle())unst++;
      const exp=L.fn(vec),got=getv();
      rows.push({in:vec,exp,got,ok:exp.every((e,i)=>same(e,got[i]))});
    }
  }
  const bad=rows.filter(r=>!r.ok).length;
  return {rows,bad,ok:bad===0,unst,fl,seq:!!(L.seq||L.driver),
    inNames:L.drvIn||L.ins,inWs:L.drvW||L.inW||L.ins.map(()=>1)};
}

/* =====================================================================
   ТОЧКИ РАСШИРЕНИЯ
   Раньше каждая версия подменяла функции предыдущих: `const old=fn; fn=function(){old();…}`.
   Теперь функция регистрируется один раз (ext.fn), а расширения подключаются по имени:
     ext.wrap(name, next => function(...args){ … next(...args) … })  — перехватчик (как раньше, но в реестре)
     ext.after(name, (args, result) => …)                            — после вызова (в т.ч. async)
     ext.before(name, args => …)                                     — перед вызовом
     ext.replace(name, fn)                                           — полная замена базовой реализации
     ext.feature(id, install)                                        — изолированная установка модуля
   Ошибки в after/before-хуках и в feature() не ломают основной поток.
   ===================================================================== */
const APP=Object.freeze({name:'NAND-мастерская',version:'14.0',saveKey:'nandlab.v1'});
const ext=(()=>{
  const reg=Object.create(null);        // name -> {base, wraps:[{id,factory}], before:[], after:[], chain:null}
  const faults=[], features=[];
  const slot=n=>reg[n]||(reg[n]={base:null,wraps:[],before:[],after:[],chain:null});
  function fault(where,e){
    faults.push({where,msg:String(e&&e.message||e)});
    try{console.error('[ext]',where,e);}catch(_){}
  }
  function build(s){let c=s.base;for(const w of s.wraps)c=w.factory(c);return c;}
  function fn(name,base){
    const s=slot(name);s.base=base;s.chain=null;
    const f=function(...args){
      for(let i=s.before.length-1;i>=0;i--){try{s.before[i].fn(args);}catch(e){fault(name+':before:'+s.before[i].id,e);}}
      const chain=s.chain||(s.chain=build(s));
      const r=chain.apply(this,args);
      const done=v=>{for(const h of s.after){try{h.fn(args,v);}catch(e){fault(name+':after:'+h.id,e);}}return v;};
      return (r&&typeof r.then==='function')?r.then(done):done(r);
    };
    Object.defineProperty(f,'name',{value:name});
    return f;
  }
  const need=(name)=>{if(!reg[name]||!reg[name].base)throw Error('ext: функция «'+name+'» не зарегистрирована');return reg[name];};
  const tools=[],settings=[],selftests=[];
  const idOf=(id,f)=>id||f.name||'ext';
  return {
    fn,
    base:name=>need(name).base,
    wrap(name,factory,id){const s=need(name);s.wraps.push({id:idOf(id,factory),factory});s.chain=null;},
    after(name,f,id){need(name).after.push({id:idOf(id,f),fn:f});},
    /* Обработчик параметров любого диалога: fn(options) может изменить options или вернуть новый объект. */
    dialog(f,id){this.before('dlg',a=>{const r=f(a[0]);if(r)a[0]=r;},id);},
    before(name,f,id){need(name).before.push({id:idOf(id,f),fn:f});},
    replace(name,f){const s=need(name);s.base=f;s.wraps.length=0;s.chain=null;},
    feature(id,install){
      const rec={id,ok:true};features.push(rec);
      try{install();}catch(e){rec.ok=false;rec.error=String(e&&e.message||e);fault('feature:'+id,e);}
    },
    /* Реестр инструментов: один раз регистрируются, показываются в едином окне «Инструменты».
       def: {id, group, icon, title, sub, run, when}; title/sub могут быть функциями. */
    tool(def){if(tools.some(x=>x.id===def.id))throw Error('ext.tool: дубль '+def.id);tools.push({order:tools.length,...def});},
    tools:()=>tools.filter(x=>{try{return !x.when||x.when();}catch(e){return false;}}),
    /* Реестр настроек: def {id, group, title, sub, run, keepOpen, when}. */
    setting(def){if(settings.some(x=>x.id===def.id))throw Error('ext.setting: дубль '+def.id);settings.push(def);},
    settings:()=>settings.filter(x=>{try{return !x.when||x.when();}catch(e){return false;}}),
    /* Самотесты модулей: fn() -> массив {name, ok, msg} (может быть async). */
    selftest(id,title,f){selftests.push({id,title,run:f});},
    async runSelftests(){const out=[];for(const s of selftests){let r;try{r=await s.run();}catch(e){r=[{name:'запуск набора',ok:false,msg:e.message}];}out.push({id:s.id,title:s.title,results:r});}return out;},
    faults:()=>faults.slice(),
    features:()=>features.map(f=>({...f})),
    report:()=>Object.keys(reg).filter(k=>reg[k].wraps.length||reg[k].before.length||reg[k].after.length)
      .map(k=>({name:k,wraps:reg[k].wraps.map(w=>w.id),before:reg[k].before.map(h=>h.id),after:reg[k].after.map(h=>h.id)}))
  };
})();

function parseNum(s){
  s=String(s).trim().replace(/_/g,'');
  let v;
  if(/^[-+]?0x[0-9a-f]+$/i.test(s))v=parseInt(s,16);
  else if(/^[-+]?0b[01]+$/i.test(s))v=parseInt(s.replace(/0b/i,''),2);
  else if(/^[-+]?\d+$/.test(s))v=parseInt(s,10);

    const bt=m.querySelector('.btns');

    const close=v=>{const vals=collect();m.remove();res({v,vals,text:vals.text||''});};
    (buttons||[{t:'Ок',v:'ok',p:true}]).forEach(b=>{
      const e=document.createElement('button');e.textContent=b.t;if(b.p)e.className='pri';
      e.onclick=()=>{if(b.keep){b.keep(collect(),e);return;}close(b.v);};bt.appendChild(e);

const FMTS=['dec','hex','bin','sdec'];
const FMT_NAME={dec:'10-ичный',hex:'16-ричный',bin:'двоичный',sdec:'со знаком'};
function fmtVal(v,w,f){
  v=v>>>0;
  if(w===1)return String(v&1);
  if(f==='hex')return '0x'+v.toString(16).toUpperCase().padStart(Math.ceil(w/4),'0');
  if(f==='bin'&&w<=8)return v.toString(2).padStart(w,'0');
  if(f==='sdec'){const neg=w>=32?(v>>>31):((v>>>(w-1))&1);return String(neg?v-(w>=32?4294967296:2**w):v);}
  return String(v);
}
const hexShort=(v,w)=>(v>>>0).toString(16).toUpperCase().padStart(Math.ceil(w/4),'0');
const cellFmt=(v,w)=>v===null?'·':(w===1?String(v):(w<=4?String(v):hexShort(v,w)));

  node:'#17384d',chip:'#1d4a64',edge:'#86b9d4',text:'#e3f1f8',dim:'#8fb0c4',sel:'#6ee7c8',bad:'#ff6b6b'};

const nodeById=id=>cur.nodes.find(n=>n.id===id);
const mcache={};
function tw(txt,font){
  const k=font+'|'+txt;if(mcache[k]!==undefined)return mcache[k];
  ctx.save();ctx.font=font;const w=ctx.measureText(txt).width;ctx.restore();return mcache[k]=w;
}
const rng=(p,w)=>w===1?String(p):`${p+w-1}:${p}`;
const wl=(s,w)=>w>1?`${s}[${w}]`:s;
function boxDesc(n){
  if(n.type==='chip'){
    const d=chipInfo(n.chip);
    if(!d)return {title:'?',il:[],ol:[],bad:true};
    const W=lanes(n,d),iw=defIn(d).map(x=>W>1?W:x),ow=defOut(d).map(x=>W>1?W:x);
    return {title:d.name+(W>1?' ×'+W:''),il:d.inputs.map((s,i)=>wl(s,iw[i])),ol:d.outputs.map((s,i)=>wl(s,ow[i]))};
  }
  if(n.type==='split'){let p=0;const ol=n.ws.map(w=>{const l=rng(p,w);p+=w;return l;});return {title:'Разделить',il:[rng(0,sumOf(n.ws))],ol};}
  if(n.type==='merge'){let p=0;const il=n.ws.map(w=>{const l=rng(p,w);p+=w;return l;});return {title:'Собрать',il,ol:[rng(0,sumOf(n.ws))]};}
  if(n.type==='rom')return {title:'ROM',il:n.wr?['ADR['+n.aw+']','DIN['+n.dw+']','WE','CLK']:['ADR['+n.aw+']'],ol:['D['+n.dw+']']};
  if(n.type==='ram')return {title:'RAM',il:['ADR['+n.aw+']','DIN['+n.dw+']','WE','CLK'],ol:['DOUT['+n.dw+']']};
  if(n.type==='sound')return {title:'',il:[wl('NOTE',n.nb||6),'EN'],ol:[]};
  if(n.type==='screen')return {title:'',il:[wl('X',n.xb||4),wl('Y',n.yb||4),(n.cb||1)>1?wl('C',n.cb):'D','WE','CLK'],ol:[]};
  if(n.type==='tty')return {title:'',il:['CHR[8]','WE','CLK'],ol:[]};
  if(n.type==='delay')return {title:'Задержка',il:[wl('D',n.w||1)],ol:[wl('Q',n.w||1)]};
  if(n.type==='rng')return {title:'Случайно',il:[],ol:[wl('R',n.w||8)]};
  return null;
}
function valBoxW(w){return w===1?64:w<=8?104:w<=16?128:156;}
function nodeSize(n){
  switch(n.type){
    case 'in':case 'out':return [valBoxW(n.w||1),40];
    case 'clock':return [64,40];
    case 'const':return [valBoxW(n.w||1),40];
    case 'c0':case 'c1':return [40,40];
    case 'btn':return [64,40];
    case 'switch':return [72,40];
    case 'scope':return [220,((n.ch||[1,1,1,1]).length+1)*G];
    case 'note':return [Math.max(60,Math.min(300,Math.ceil(tw(n.text||'','13px '+FONT)+16))),30];
    case 'seg':return [72,90];
    case 'sound':return [120,60];
    case 'screen':return [192,148];
    case 'tty':return [204,80];
    case 'chip':if(n.chip==='NAND')return [80,60];
  }
  const d=boxDesc(n);if(!d)return [40,40];
  const h=(Math.max(d.il.length,d.ol.length,1)+1)*G;
  const f1='600 14px '+FONT,f2='10px '+FONT;
  const nm=tw(d.title,f1);
  const li=Math.max(0,...d.il.map(s=>tw(s,f2))),lo=Math.max(0,...d.ol.map(s=>tw(s,f2)));
  return [Math.ceil(Math.max(nm+16,li+lo+26,70)/G)*G,h];
}
function pinY(n,isOut,k){
  const [,h]=nodeSize(n),[a,b]=pinCount(n),c=isOut?b:a;
  return h/2+(k-(c-1)/2)*G;
}
function pinPos(n,isOut,k){const [w]=nodeSize(n);return {x:n.x+(isOut?w:0),y:n.y+pinY(n,isOut,k)};}
function pinNum(n,k){
  if(!live)return 0;
  const o=live.fl.outs[n.id];if(!o||!o[k])return 0;
  return live.sim.rd(o[k]);
}
function pinW(id,pin,out){const n=nodeById(id);if(!n)return 0;const s=pinSpec(n);return (out?s.o:s.i)[pin]||0;}

/* ---------- сборка живой симуляции ---------- */
function applySources(){
  for(const n of cur.nodes){
    if(n.type==='in'||n.type==='clock'||n.type==='btn'||n.type==='switch'){
      const o=live.fl.outs[n.id];if(!o)continue;
      const v=n.val>>>0;o[0].forEach((net,k)=>{live.sim.v[net]=k<32?(v>>>k)&1:0;});
    }
  }
}
const SC_LEN=30;
let scopeHist={};
function scopeLive(){
  if(!live)return;
  for(const n of cur.nodes){
    if(n.type!=='scope')continue;const pr=live.fl.probes[n.id];if(!pr)continue;
    const h=scopeHist[n.id]||(scopeHist[n.id]=pr.map(()=>[]));
    pr.forEach((nets,k)=>{const v=live.sim.rd(nets),a=h[k];if(a.length)a[a.length-1]=v;else a.push(v);});
  }
}
function sampleScopes(){
  if(!live)return;
  for(const n of cur.nodes){
    if(n.type!=='scope')continue;const pr=live.fl.probes[n.id];if(!pr)continue;
    const h=scopeHist[n.id]||(scopeHist[n.id]=pr.map(()=>[]));
    pr.forEach((nets,k)=>{h[k].push(live.sim.rd(nets));if(h[k].length>SC_LEN)h[k].shift();});
  }
}
function rebuild(){
  scopeHist={};
  try{
    const fl=flatten(cur);const sim=new Sim(fl);
    live={fl,sim};applySources();sim.settle();scopeLive();
  }catch(e){live=null;toast(e.message);}
  updateStat();
}
function resettle(){if(!live)return;applySources();live.sim.settle();scopeLive();updateStat();}
let lastStat='';
function updateStat(){
  const el=$('#tSub');
  let h='';
  if(live){
    const f=live.fl;
    const parts=`<span>${cur.nodes.length} эл.</span><span>${cur.wires.length} соед.</span>`;
    h=parts+`<span>NAND ${f.nand}</span><span>${f.delay===null?'есть память':'задержка '+f.delay}</span>`+(f.cells.some(c=>c.t==='rom'||c.t==='ram')?'<span>ROM/RAM</span>':'')+(live.sim.unstable?'<span class="w">не стабилизируется</span>':'');
  }
  if(h!==lastStat){el.innerHTML=h;lastStat=h;}
}

/* ---------- история (отмена / повтор) ---------- */
let hist=[],hi=-1;
function snapStr(){
  const c=clone({nodes:cur.nodes,wires:cur.wires,next:cur.next});
  c.nodes.forEach(n=>{if(n.type==='in'||n.type==='clock'||n.type==='btn'||n.type==='switch')delete n.val;});
  return JSON.stringify(c);
}
function updateHist(){$('#bUndo').disabled=hi<=0;$('#bRedo').disabled=hi>=hist.length-1;}
function commit(){
  const s=snapStr();if(hist[hi]===s)return;
  hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1;updateHist();
}
function resetHist(){hist=[];hi=-1;commit();}
function restoreHist(i){
  const old=new Map(cur.nodes.map(n=>[n.id,n]));
  const c=JSON.parse(hist[i]);
  c.nodes.forEach(n=>{if(n.type==='in'||n.type==='clock'||n.type==='btn'||n.type==='switch'){const o=old.get(n.id);n.val=o?o.val:0;}});
  cur.nodes=c.nodes;cur.wires=c.wires;cur.next=c.next;
  hi=i;sel=null;rebuild();updateSelBar();updateClk();updateHist();persistSoon();need();
}
$('#bUndo').onclick=()=>{if(hi>0)restoreHist(hi-1);};
$('#bRedo').onclick=()=>{if(hi<hist.length-1)restoreHist(hi+1);};
function changed(){
  stopStep();
  if(sel&&sel.t==='wire')sel=null;
  rebuild();commit();updateSelBar();updateClk();persistSoon();need();
}

let raf=0;
const need=()=>{if(!raf)raf=requestAnimationFrame(draw);};
function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';need();
}
new ResizeObserver(resize).observe($('#stage'));
const toWorld=(px,py)=>({x:(px-view.x)/view.s,y:(py-view.y)/view.s});
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wirePts(p,q){
  if(S.set.wire==='ortho'){
    if(q.x-p.x>=40){const mx=Math.round((p.x+q.x)/20)*10;return [p,{x:mx,y:p.y},{x:mx,y:q.y},q];}
    const my=Math.abs(q.y-p.y)<30?Math.max(p.y,q.y)+40:(p.y+q.y)/2;
    return [p,{x:p.x+20,y:p.y},{x:p.x+20,y:my},{x:q.x-20,y:my},{x:q.x-20,y:q.y},q];
  }
  const dx=Math.max(40,Math.abs(q.x-p.x)/2),pts=[];
  for(let j=0;j<=16;j++){
    const t=j/16,u=1-t;
    pts.push({x:u*u*u*p.x+3*u*u*t*(p.x+dx)+3*u*t*t*(q.x-dx)+t*t*t*q.x,y:u*u*u*p.y+3*u*u*t*p.y+3*u*t*t*q.y+t*t*t*q.y});
  }
  return pts;
}
function wireMid(p,q){
  const pts=wirePts(p,q);
  if(S.set.wire!=='ortho')return pts[8];
  let tot=0;for(let i=1;i<pts.length;i++)tot+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  let acc=0;
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(acc+d>=tot/2){const t=d?(tot/2-acc)/d:0;return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*t,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*t};}
    acc+=d;
  }
  return pts[0];
}
function wirePath(p,q){
  ctx.beginPath();
  if(S.set.wire==='ortho'){
    const pts=wirePts(p,q);ctx.lineJoin='round';ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    return;
  }
  const dx=Math.max(40,Math.abs(q.x-p.x)/2);
  ctx.moveTo(p.x,p.y);ctx.bezierCurveTo(p.x+dx,p.y,q.x-dx,q.y,q.x,q.y);
}
let drag=null;
function draw(){
  raf=0;
  audioSync();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.x,dpr*view.y);
  const x0=-view.x/view.s,y0=-view.y/view.s,x1=x0+W/view.s,y1=y0+H/view.s;
  const step=view.s<0.6?G*2:G;
  ctx.fillStyle=COL.grid;
  if(S.set.grid)for(let x=Math.floor(x0/step)*step;x<x1;x+=step)for(let y=Math.floor(y0/step)*step;y<y1;y+=step)ctx.fillRect(x-1,y-1,2,2);
  const nm=new Map(cur.nodes.map(n=>[n.id,n]));
  const inVal={};
  ctx.lineCap='round';
  const badges=[];
  cur.wires.forEach((w,i)=>{
    const A=nm.get(w.from.node),B=nm.get(w.to.node);if(!A||!B)return;
    const p=pinPos(A,true,w.from.pin),q=pinPos(B,false,w.to.pin);
    const ww=pinSpec(A).o[w.from.pin]||1;
    const val=pinNum(A,w.from.pin);inVal[w.to.node+':'+w.to.pin]=val;
    const on=val!==0,bus=ww>1;
    const isSel=sel&&sel.t==='wire'&&sel.i===i;
    wirePath(p,q);
    if(on||isSel){ctx.strokeStyle=isSel?'rgba(110,231,200,.28)':COL.glow;ctx.lineWidth=bus?12:9;ctx.stroke();}
    ctx.strokeStyle=isSel?COL.sel:on?COL.on:COL.off;ctx.lineWidth=bus?5.5:3;ctx.stroke();
    if(bus&&view.s>=0.55){const m=wireMid(p,q);badges.push({x:m.x,y:m.y,t:fmtVal(val,ww,mode.kind==='level'&&mode.L.wireFmt==='sdec'?'sdec':'hex'),on});}
  });
  for(const b of badges){
    ctx.font='600 11px '+MONO;ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(b.t).width+10;
    rr(b.x-w/2,b.y-9,w,18,6);ctx.fillStyle=COL.bar;ctx.fill();ctx.strokeStyle=b.on?COL.on:COL.off;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=b.on?COL.on:COL.dim;ctx.fillText(b.t,b.x,b.y+.5);
  }
  for(const n of cur.nodes)drawNode(n,inVal);
  if(selSet.size){
    ctx.setLineDash([5,4]);ctx.strokeStyle=COL.sel;ctx.lineWidth=2;
    for(const n of cur.nodes)if(selSet.has(n.id)){const [nw,nh]=nodeSize(n);rr(n.x-6,n.y-6,nw+12,nh+12,12);ctx.stroke();}
    ctx.setLineDash([]);
  }
  if(drag&&drag.t==='band'&&drag.moved){
    const bx=Math.min(drag.x0,drag.cur.x),by=Math.min(drag.y0,drag.cur.y),bw=Math.abs(drag.cur.x-drag.x0),bh=Math.abs(drag.cur.y-drag.y0);
    ctx.fillStyle='rgba(110,231,200,.10)';ctx.fillRect(bx,by,bw,bh);ctx.setLineDash([6,4]);ctx.strokeStyle=COL.sel;ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);ctx.setLineDash([]);
  }
  if(drag&&drag.t==='wire'){
    const A=nm.get(drag.a.node);
    if(A){
      const pp=pinPos(A,drag.a.out,drag.a.pin),c=drag.cur;
      const p=drag.a.out?pp:c,q=drag.a.out?c:pp;
      wirePath(p,q);ctx.setLineDash([6,5]);ctx.strokeStyle=COL.sel;ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([]);
      const hv=drag.hover||drag.bad;
      if(hv){ctx.beginPath();ctx.arc(hv.x,hv.y,11,0,7);ctx.strokeStyle=drag.hover?COL.sel:COL.bad;ctx.lineWidth=2.5;ctx.stroke();}
    }
  }
}
function drawPins(n,inVal){
  const sp=pinSpec(n);
  sp.i.forEach((w,k)=>{
    const p=pinPos(n,false,k),key=n.id+':'+k,wired=key in inVal;
    ctx.beginPath();
    if(w>1)ctx.rect(p.x-6,p.y-6,12,12);else ctx.arc(p.x,p.y,5,0,7);
    if(wired){ctx.fillStyle=inVal[key]?COL.on:COL.off;ctx.fill();}
    else{ctx.fillStyle=COL.bg;ctx.fill();ctx.strokeStyle=COL.dim;ctx.lineWidth=2;ctx.stroke();}
  });
  sp.o.forEach((w,k)=>{
    const p=pinPos(n,true,k);
    ctx.beginPath();
    if(w>1)ctx.rect(p.x-6,p.y-6,12,12);else ctx.arc(p.x,p.y,5,0,7);
    ctx.fillStyle=pinNum(n,k)?COL.on:COL.off;ctx.fill();
    ctx.strokeStyle=COL.bg;ctx.lineWidth=1.5;ctx.stroke();
  });
}
function drawValBox(n,v,w,x,y,bw,h,label){
  const lit=v!==0;
  rr(x,y,bw,h,9);ctx.fillStyle=lit?(w===1?COL.on:COL.node):COL.node;ctx.fill();ctx.strokeStyle=COL.edge;ctx.lineWidth=2;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(w===1){
    ctx.fillStyle=lit?'#2a1b00':COL.text;ctx.font='700 18px '+MONO;ctx.fillText(String(v&1),x+bw/2,y+h/2+1);
  }else{
    ctx.fillStyle=lit?COL.on:COL.text;ctx.font='700 15px '+MONO;
    ctx.fillText(fmtVal(v,w,n.fmt||'dec'),x+bw/2,y+(w<=16?14:h/2));
    if(w<=16){
      const s=4,g=1.5,tot=w*s+(w-1)*g,sx=x+(bw-tot)/2;
      for(let k=0;k<w;k++){ctx.fillStyle=((v>>>(w-1-k))&1)?COL.on:'#0a1d2b';ctx.fillRect(sx+k*(s+g),y+h-10,s,5);}
    }
  }
  if(label){ctx.fillStyle=COL.dim;ctx.font='12px '+FONT;ctx.textBaseline='alphabetic';ctx.fillText(wl(label,w),x+bw/2,y-6);}
}
const HEXSEG=[0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F,0x77,0x7C,0x39,0x5E,0x79,0x71];
const PAL=['#04101a','#3b7bff','#2fd27a','#19d9d9','#ff5252','#d65cff','#ffd23d','#ffffff'];
function drawSeg(n,x,y,w,h){
  const pr=live&&live.fl.probes[n.id],v=pr?live.sim.rd(pr[0]):0;
  const m=n.w===8?(v&255):HEXSEG[v&15];
  rr(x,y,w,h,10);ctx.fillStyle='#07151f';ctx.fill();ctx.strokeStyle=COL.edge;ctx.lineWidth=2;ctx.stroke();
  const ox=x+14,oy=y+10,S=28,T=7;
  const segs=[[ox+5,oy,S,T],[ox+S+5,oy+5,T,S],[ox+S+5,oy+S+10,T,S],[ox+5,oy+2*S+10,S,T],[ox,oy+S+10,T,S],[ox,oy+5,T,S],[ox+5,oy+S+5,S,T]];
  segs.forEach((g,i)=>{rr(g[0],g[1],g[2],g[3],2.5);ctx.fillStyle=(m>>i)&1?COL.on:'#17303f';ctx.fill();});
  ctx.beginPath();ctx.arc(x+61,y+81,3.5,0,7);ctx.fillStyle=(n.w===8&&(m>>7)&1)?COL.on:'#17303f';ctx.fill();
}
function drawSwitch(n,x,y,w,h){
  const on=(n.val|0)&1;
  rr(x,y,w,h,9);ctx.fillStyle=COL.node;ctx.fill();ctx.strokeStyle=COL.edge;ctx.lineWidth=2;ctx.stroke();
  rr(x+14,y+10,44,20,10);ctx.fillStyle=on?COL.on:'#0a1d2b';ctx.fill();ctx.strokeStyle=on?'#fff3cf':COL.off;ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(on?x+48:x+24,y+20,7,0,7);ctx.fillStyle=on?'#2a1b00':COL.text;ctx.fill();
  if(n.label){ctx.fillStyle=COL.dim;ctx.font='12px '+FONT;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(n.label,x+w/2,y-6);}
}
function drawScope(n,x,y,w,h){
  const ch=n.ch||[1,1,1,1];
  rr(x,y,w,h,10);ctx.fillStyle='#07151f';ctx.fill();ctx.strokeStyle=COL.edge;ctx.lineWidth=2;ctx.stroke();
  const ox=x+34,step=(w-42)/SC_LEN,hist=scopeHist[n.id];
  ch.forEach((cw,k)=>{
    const cy=y+pinY(n,false,k),arr=hist&&hist[k]?hist[k]:[];
    ctx.lineWidth=1.5;
    if(cw===1){
      ctx.beginPath();
      for(let i=0;i<arr.length;i++){const px=ox+i*step,py=cy+(arr[i]?-6:6);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);ctx.lineTo(px+step,py);}
      ctx.strokeStyle=COL.on;ctx.stroke();
    }else{
      let i=0;
      while(i<arr.length){

function hitPin(wx,wy,rad,wantOut,wf){

    const sp=pinSpec(n);
    if(wantOut!==true)sp.i.forEach((pw,k)=>{
      const p=pinPos(n,false,k),d=(p.x-wx)**2+(p.y-wy)**2;if(d<bd){bd=d;best={node:n.id,pin:k,out:false,x:p.x,y:p.y};}

    });
  }

}
function hitNode(wx,wy){
  for(let i=cur.nodes.length-1;i>=0;i--){
    const n=cur.nodes[i],[w,h]=nodeSize(n);

  }

function hitWire(wx,wy,rad){
  let best=-1,bd=rad;
  cur.wires.forEach((w,i)=>{
    const A=nodeById(w.from.node),B=nodeById(w.to.node);if(!A||!B)return;
    const pts=wirePts(pinPos(A,true,w.from.pin),pinPos(B,false,w.to.pin));

function fit(){
  if(!cur.nodes.length){view={x:W/2,y:H/2,s:1};need();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of cur.nodes){const [w,h]=nodeSize(n);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y-16);x1=Math.max(x1,n.x+w);y1=Math.max(y1,n.y+h);}
  const bw=x1-x0+80,bh=y1-y0+80;

function parseWidths(str,loose){
  const out=[];
  for(const tok of String(str).split(/[\s,;]+/).filter(Boolean)){
    const m=tok.match(/^(\d+)[*x×](\d+)$/i);
    if(m){for(let i=0;i<+m[1];i++)out.push(+m[2]);}
    else if(/^\d+$/.test(tok))out.push(+tok);
    else return {err:'Не понял «'+tok+'». Пример: 4,4 или 8*1'};
  }
  if(!out.length)return {err:'Список ширин пуст'};
  if(out.some(x=>x<1||x>32))return {err:'Каждая ширина — от 1 до 32 бит'};
  if(out.length>(loose?8:32))return {err:'Не больше '+(loose?8:32)+' групп'};
  if(!loose&&sumOf(out)>32)return {err:'Суммарная ширина не больше 32 бит'};
  return {ws:out};
}
function memToText(data,words){
  let last=-1;for(let i=0;i<data.length;i++)if(data[i])last=i;
  const out=[];for(let i=0;i<=last;i++){out.push((data[i]>>>0).toString(16).toUpperCase().padStart(Math.ceil(words/4),'0'));}
  const lines=[];for(let i=0;i<out.length;i+=8)lines.push(out.slice(i,i+8).join(' '));
  return lines.join('\n');
}
function parseMem(text,aw,dw){
  const size=1<<aw,data=new Array(size).fill(0),mk=maskOf(dw);let k=0;
  const push=v=>{if(k>=size)throw new Error('Слов больше, чем ячеек ('+size+')');data[k++]=(v&mk)>>>0;};
  for(let line of text.split('\n')){
    line=line.replace(/[;#].*$/,'').trim();if(!line)continue;
    const m=line.match(/^([A-Za-z]+)\s*(-?\w+)?$/);
    if(m&&/^(LDI|ADDI|OUT|JNZ)$/i.test(m[1])){
      const op=m[1].toUpperCase(),a=m[2]===undefined?0:(/^-?\d+$/.test(m[2])?parseInt(m[2],10):parseNum(m[2]));
      if(op!=='OUT'&&Number.isNaN(a))throw new Error('Неверное число в «'+line+'»');
      if(op==='LDI')push(a&63);else if(op==='ADDI')push(0x40|(a&63));else if(op==='OUT')push(0x80);else push(0xC0|(a&63));
    }else{
      for(const t of line.split(/[\s,]+/)){
        if(!t)continue;
        const v=/^0x/i.test(t)||/^0b/i.test(t)?parseNum(t):(/^[0-9a-f]+$/i.test(t)?parseInt(t,16):NaN);
        if(Number.isNaN(v))throw new Error('Неверное слово «'+t+'»');
        push(v);
      }
    }
  }
  return data;
}
function pruneCirc(c){
  const m=new Map(c.nodes.map(n=>[n.id,n]));let r=0;
  c.wires=c.wires.filter(w=>{
    const A=m.get(w.from.node),B=m.get(w.to.node);
    let ok=false;
    if(A&&B){const a=pinSpec(A).o[w.from.pin],b=pinSpec(B).i[w.to.pin];ok=a!==undefined&&b!==undefined;/* шире источник — старшие биты обрезаются */}
    if(!ok)r++;return ok;
  });
  return r;
}
const pruneWires=()=>pruneCirc(cur);
function dependsOn(id,target,seen=new Set()){
  if(id===target)return true;
  if(seen.has(id))return false;seen.add(id);
  const d=S.chips[id];if(!d)return false;
  return d.circuit.nodes.some(n=>n.type==='chip'&&n.chip!=='NAND'&&dependsOn(n.chip,target,seen));
}

function audioSync(){
  const sounds=cur.nodes.filter(n=>n.type==='sound');
  $('#bSnd').hidden=!sounds.length||readonly();
  $('#bSnd').textContent=muted?'🔇':'🔊';

  const seen=new Set(),t=AC.currentTime;
  for(const n of sounds){
    const pr=live&&live.fl.probes[n.id];if(!pr)continue;
    seen.add(n.id);
    let o=snd[n.id];
    if(!o){const osc=AC.createOscillator(),g=AC.createGain();g.gain.value=0;osc.connect(g);g.connect(master);osc.start();o=snd[n.id]={osc,g,wave:null};}
    const wv=n.wave||'square';if(o.wave!==wv){setWave9(o.osc,wv);o.wave=wv;}
    const note=live.sim.rd(pr[0]),en=live.sim.rd(pr[1]);
    o.osc.frequency.setTargetAtTime(55*Math.pow(2,note/12),t,.01);
    o.g.gain.setTargetAtTime(en&&!muted?1:0,t,.012);
  }
  for(const id in snd)if(!seen.has(id)){try{snd[id].osc.stop();snd[id].g.disconnect();}catch(e){}delete snd[id];}
}

function exBuilder(){
  const nodes=[],wires=[];let k=1;
  return {nodes,wires,
    add:o=>{const n=Object.assign({id:'n'+k++,x:0,y:0},o);nodes.push(n);return n.id;},
    wire:(a,ap,b,bp)=>wires.push({from:{node:a,pin:ap},to:{node:b,pin:bp}}),
    done:()=>({nodes,wires,next:k})};
}
/* счётчик: RAM хранит число, ROM прибавляет единицу */
function exCounter(b,x,y,bits,clk){
  const a0=b.add({type:'const',w:1,val:0,x,y}),we=b.add({type:'const',w:1,val:1,x,y:y+50});
  const ram=b.add({type:'ram',aw:1,dw:bits,data:[0,0],x:x+120,y});
  const size=1<<bits,inc=[];for(let i=0;i<size;i++)inc.push((i+1)%size);
  const rom=b.add({type:'rom',aw:bits,dw:bits,data:inc,x:x+120,y:y+130});
  b.wire(a0,0,ram,0);b.wire(we,0,ram,2);b.wire(clk,0,ram,3);b.wire(ram,0,rom,0);b.wire(rom,0,ram,1);
  return ram;
}
function spiral(n){
  const pts=[];let x0=0,y0=0,x1=n-1,y1=n-1;
  while(x0<=x1&&y0<=y1){
    for(let x=x0;x<=x1;x++)pts.push([x,y0]);
    for(let y=y0+1;y<=y1;y++)pts.push([x1,y]);
    if(y0<y1)for(let x=x1-1;x>=x0;x--)pts.push([x,y1]);
    if(x0<x1)for(let y=y1-1;y>y0;y--)pts.push([x0,y]);
    x0++;y0++;x1--;y1--;
  }
  return pts;
}

/* Раскладка примеров по слоям: координаты в EXAMPLES заданы под старые маленькие блоки,
   а ROM/RAM/экран теперь крупные, и блоки налезали друг на друга. */
function layoutExample(c){
  const ns=c.nodes,idx=new Map(ns.map((n,i)=>[n.id,i]));
  const out=ns.map(()=>[]),hasIn=ns.map(()=>false);
  for(const w of c.wires){const a=idx.get(w.from.node),b=idx.get(w.to.node);if(a===undefined||b===undefined)continue;out[a].push(b);hasIn[b]=true;}
  const state=ns.map(()=>0),fwd=ns.map(()=>[]);
  const dfs=u=>{state[u]=1;for(const v of out[u]){if(state[v]===1)continue;fwd[u].push(v);if(state[v]===0)dfs(v);}state[u]=2;};
  ns.forEach((_,i)=>{if(!hasIn[i]&&state[i]===0)dfs(i);});
  ns.forEach((_,i)=>{if(state[i]===0)dfs(i);});
  const col=ns.map(()=>0);
  for(let pass=0;pass<ns.length;pass++){let ch=false;fwd.forEach((vs,u)=>{for(const v of vs)if(col[v]<col[u]+1){col[v]=col[u]+1;ch=true;}});if(!ch)break;}
  const cols=[];ns.forEach((n,i)=>{(cols[col[i]]=cols[col[i]]||[]).push(n);});
  let x=0;
  for(const list of cols){
    if(!list)continue;
    list.sort((a,b)=>a.y-b.y||a.x-b.x);
    let y=0,mw=0;
    for(const n of list){const [w,h]=nodeSize(n);n.x=snap(x);n.y=snap(y);y+=h+40;mw=Math.max(mw,w);}
    x+=mw+70;
  }
}

function newLevelCircuit(L){
  const ni=L.ins.length,no=L.outs.length,mx=Math.max(ni,no),sp=60,mid=(mx-1)*sp/2;
  const iw=L.inW||ones(ni),ow=L.outW||ones(no);
  const nodes=[];
  L.ins.forEach((l,k)=>nodes.push({id:'i'+k,type:'in',x:0,y:snap(mid+(k-(ni-1)/2)*sp-20),label:l,val:0,w:iw[k],fixed:true}));
  L.outs.forEach((l,k)=>nodes.push({id:'o'+k,type:'out',x:420,y:snap(mid+(k-(no-1)/2)*sp-20),label:l,w:ow[k],fmt:(L.outFmt||[])[k]||'dec',fixed:true}));
  (L.extra||[]).forEach(e=>nodes.push(clone(e)));
  return {nodes,wires:(L.extraWires||[]).map(clone),next:1};
}

function specTable(L){
  if(L.seq||L.driver||L.inW||L.ins.length>3)return '';
  let h='<div class="scroll-x"><table><tr>'+L.ins.map(s=>`<th>${esc(s)}</th>`).join('')+L.outs.map((s,i)=>`<th class="${i?'':'sep'}">${esc(s)}</th>`).join('')+'</tr>';
  for(let k=0;k<(1<<L.ins.length);k++){
    const v=bits(k,L.ins.length),o=L.fn(v);
    h+='<tr>'+v.map(b=>`<td>${b}</td>`).join('')+o.map((b,i)=>`<td class="${i?'':'sep'}">${b}</td>`).join('')+'</tr>';
  }
  return h+'</table></div>';
}

  const r=await dlg({title:`Уровень ${L.id}: ${L.name}`,html:base+levelGuide15(L)+(L.prog?'<p>Программа в ПЗУ:</p><pre style="margin:0 0 10px;font:13px ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap">'+esc(disasm(L.prog))+'</pre>':'')+specTable(L)+lim,
    buttons:[{t:'Начать заново',v:'reset'},...(L.hint?[{t:'Подсказка',v:'hint'}]:[]),{t:'К схеме',v:'ok',p:true}]});
  if(r.v==='hint'){

}

/* ---------- проверка ---------- */
function resultTable(L,res){
  const rows=res.rows,iw=res.inWs,ow=L.outW||L.outs.map(()=>1);
  const idx=rows.map((r,i)=>i);
  let show=idx;
  if(rows.length>40){show=idx.filter(i=>!rows[i].ok).slice(0,40);if(res.ok)show=idx.slice(0,12);}
  let h='<div class="scroll-x"><table><tr>'+(res.seq?'<th>#</th>':'')+res.inNames.map(s=>`<th>${esc(s)}</th>`).join('')
    +L.outs.map((s,i)=>`<th class="${i?'':'sep'}">${esc(s)} ожид.</th>`).join('')
    +L.outs.map((s,i)=>`<th class="${i?'':'sep'}">${esc(s)} факт</th>`).join('')+'</tr>';
  for(const i of show){
    const r=rows[i];
    h+='<tr>'+(res.seq?`<td>${i+1}</td>`:'')+r.in.map((b,k)=>`<td>${cellFmt(b,iw[k])}</td>`).join('')
      +r.exp.map((b,k)=>`<td class="${k?'':'sep'}${b===null?' dc':''}">${cellFmt(b,ow[k])}</td>`).join('')
      +r.got.map((b,k)=>`<td class="${(k?'':'sep ')+((r.exp[k]!==null&&r.exp[k]!==b)?'bad':'')}">${cellFmt(b,ow[k])}</td>`).join('')+'</tr>';
  }
  h+='</table></div>';
  if(show.length<rows.length)h+=`<p style="color:var(--dim);font-size:13px">Показано ${show.length} из ${rows.length} строк.</p>`;
  if(L.ticks)h+='<p style="color:var(--dim);font-size:13px">Каждая строка — один такт: тест подаёт вход, читает выход, затем делает такт.</p>';
  if(res.seq)h+='<p style="color:var(--dim);font-size:13px">Точка — значение ещё не определено, такой выход не проверяется.</p>';
  if(Math.max(...iw,...ow)>4)h+='<p style="color:var(--dim);font-size:13px">Шины показаны в 16-ричном виде.</p>';
  return h;
}
function edgeDiagnosis(L,res){
  if(!L.edge)return '';
  const {d,c}=L.edge;
  const msg={
    fall:'Похоже, схема срабатывает по спаду CLK (1→0), а нужен фронт 0→1. Поменяйте полярность тактового сигнала: ведущая защёлка должна быть открыта при CLK=0, ведомая — при CLK=1.',
    high:'Похоже, это защёлка: выход повторяет D, пока CLK=1. Триггер должен запоминать D только в момент фронта 0→1. Нужна пара защёлок: ведущая и ведомая.',
    low:'Похоже, это защёлка, открытая при CLK=0. Триггер должен запоминать D только в момент фронта 0→1. Нужна пара защёлок: ведущая и ведомая.'
  };
  for(const k of ['fall','high','low']){
    let q=null,pc=0,ok=true,any=false;
    for(const r of res.rows){
      const dv=d.map(i=>r.in[i]),cl=r.in[c];
      if(k==='fall'){if(pc&&!cl)q=dv;}else if(k==='high'){if(cl)q=dv;}else if(!cl)q=dv;
      pc=cl;
      if(q){any=true;if(!q.every((x,i)=>x===r.got[i])){ok=false;break;}}
    }
    if(ok&&any)return `<p class="res-bad" style="font-weight:600">${msg[k]}</p>`;
  }
  return '';
}
function describeFailure(L,res){
  const i=res.rows.findIndex(r=>!r.ok);if(i<0)return '';
  const r=res.rows[i],prev=res.rows[i-1],names=res.inNames,iw=res.inWs,ow=L.outW||L.outs.map(()=>1);
  const ch=[];
  if(prev)r.in.forEach((v,k)=>{if(v!==prev.in[k])ch.push(`${names[k]} ${cellFmt(prev.in[k],iw[k])}→${cellFmt(v,iw[k])}`);});
  const outs=L.outs.map((n,k)=>(r.exp[k]!==null&&r.exp[k]!==r.got[k])?`${n}: ожидалось ${cellFmt(r.exp[k],ow[k])}, получено ${cellFmt(r.got[k],ow[k])}`:null).filter(Boolean);
  return `<p>Первая ошибка — строка ${i+1}.${ch.length?' На этом шаге изменилось: '+ch.join(', ')+'.':''} ${outs.join('; ')}.</p>`+edgeDiagnosis(L,res);
}
/* ---- тест по шагам на живой схеме ---- */
let stepT=null;
function stopStep(){if(!stepT)return;stepT=null;$('#stepbar').hidden=true;updateSelBar();}
function startStepTest(){
  const L=mode.L;if(!L||!L.seq)return;
  stepT={L,k:0,rows:[]};sel=null;updateSelBar();$('#stepbar').hidden=false;replayStep(0);
}
function replayStep(n){
  const st=stepT,L=st.L;
  rebuild();
  const model=L.model();st.rows=[];
  for(let k=0;k<n;k++){
    if(k>0&&L.ticks){live.sim.tick();sampleScopes();}
    const vec=L.seq[k];
    vec.forEach((x,i)=>{const nd=nodeById('i'+i);if(nd)nd.val=x;});
    resettle();
    const exp=model(vec),got=L.outs.map((_,i)=>live.sim.rd(live.fl.res['o'+i]));
    st.rows.push({vec,exp,got});
  }
  st.k=n;renderStep();need();
}
function renderStep(){
  const st=stepT;if(!st)return;
  const L=st.L,N=L.seq.length,r=st.rows[st.rows.length-1],pr=st.rows[st.rows.length-2];
  const iw=L.inW||L.ins.map(()=>1),ow=L.outW||L.outs.map(()=>1);
  let t=`<b>Шаг ${st.k}/${N}</b>`;
  if(!r)t+='  Нажмите «Шаг»: тест подаст первый вход.';
  else{
    t+='<br>Вход:  '+L.ins.map((nm,k)=>{const ch=pr&&pr.vec[k]!==r.vec[k];return `<span class="${ch?'chg':''}">${esc(nm)}=${cellFmt(r.vec[k],iw[k])}${ch?'*':''}</span>`;}).join('  ');
    t+='<br>Выход: '+L.outs.map((nm,k)=>{const e=r.exp[k],g=r.got[k],ok=e===null||e===g;return `<span class="${ok?'ok':'bad'}">${esc(nm)}: ожид. ${cellFmt(e,ow[k])}, факт ${cellFmt(g,ow[k])}</span>`;}).join('  ');
  }
  $('#stepbar').innerHTML=`<div class="tx">${t}</div><div class="bt"><button data-s="prev" ${st.k<=0?'disabled':''}>◀</button><button data-s="next" class="pri" ${st.k>=N?'disabled':''}>Шаг ▶</button><button data-s="stop">Стоп</button></div>`;
}
$('#stepbar').addEventListener('click',e=>{
  const a=e.target.dataset.s;if(!a||!stepT)return;
  if(a==='stop')stopStep();
  else if(a==='next'&&stepT.k<stepT.L.seq.length)replayStep(stepT.k+1);
  else if(a==='prev'&&stepT.k>0)replayStep(stepT.k-1);
});
async function runCheck(){
  if(mode.kind!=='level')return;
  const L=mode.L,res=runTests(L,cur);
  if(res.error){toast(res.error);return;}
  if(!res.ok){
    const canStep=!!L.seq&&!L.driver;
    const r0=await dlg({title:'Не сходится',html:`<p class="res-bad">Ошибок: ${res.bad} из ${res.rows.length}</p>`+describeFailure(L,res)+(res.unst?'<p>Схема не успокаивается — проверьте обратные связи.</p>':'')+(canStep?'<p style="color:var(--dim)">«Пошагово» запустит тест на вашей схеме: вы увидите сигналы на каждом шаге.</p>':'')+resultTable(L,res),
      buttons:[{t:'К схеме',v:'ok',p:!canStep},...(canStep?[{t:'Пошагово',v:'step',p:true}]:[])]});
    if(r0.v==='step')startStepTest();
    return;
  }
  const fl=res.fl,prev=S.done[L.id];
  const g=prev?Math.min(prev.g,fl.nand):fl.nand;
  const d=prev?(prev.d===null?fl.delay:fl.delay===null?prev.d:Math.min(prev.d,fl.delay)):fl.delay;
  S.done[L.id]={g,d};
  S.lchips['L'+L.id]={id:'L'+L.id,name:L.short,inputs:L.ins.slice(),outputs:L.outs.slice(),
    inW:(L.inW||ones(L.ins.length)).slice(),outW:(L.outW||ones(L.outs.length)).slice(),
    inIds:L.ins.map((_,i)=>'i'+i),outIds:L.outs.map((_,i)=>'o'+i),circuit:clone(cur),level:L.id,gates:fl.nand};
  rebuildChips();persist();
  const next=nextLevelAfter(L);
  const r=await dlg({title:'Уровень пройден',
    html:`<p class="res-ok">Все ${res.rows.length} проверок сошлись.</p><p>NAND: ${fl.nand} (лучший ${g}). ${fl.delay===null?'Схема с памятью.':'Задержка: '+fl.delay+' (лучшая '+(d??'—')+').'}</p><p>Чип «${esc(L.short)}» добавлен в набор: теперь его можно использовать в следующих уровнях и в песочнице.</p>`,
    buttons:[{t:'Остаться',v:'stay'},...(next?[{t:'Дальше',v:'next',p:true}]:[{t:'Готово',v:'stay',p:true}])]});
  if(r.v==='next')enterLevel(next.id,true);
}

/* ---------- песочница ---------- */
const byPos=(a,b)=>a.y-b.y||a.x-b.x;
async function showTable(){
  const ins=cur.nodes.filter(n=>n.type==='in'||n.type==='clock').sort(byPos),outs=cur.nodes.filter(n=>n.type==='out').sort(byPos);
  if(!live||!ins.length||!outs.length){toast('Нужен хотя бы один вход и один выход');return;}
  const tb=sumOf(ins.map(n=>n.type==='clock'?1:(n.w||1)));
  if(tb>10){toast('Для таблицы нужно не больше 10 входных бит (сейчас '+tb+')');return;}
  const sim=new Sim(live.fl);let rows='';
  const iw=ins.map(n=>n.type==='clock'?1:(n.w||1));
  for(let k=0;k<(1<<tb);k++){
    sim.reset();let r=k;const v=iw.map(w=>{const x=r&((1<<w)-1);r>>>=w;return x;});
    ins.forEach((n,i)=>{live.fl.outs[n.id][0].forEach((net,b)=>{sim.v[net]=(v[i]>>>b)&1;});});sim.settle();
    rows+='<tr>'+v.map((x,i)=>`<td>${cellFmt(x,iw[i])}</td>`).join('')+outs.map((n,i)=>`<td class="${i?'':'sep'}">${cellFmt(sim.rd(live.fl.res[n.id]),n.w||1)}</td>`).join('')+'</tr>';
  }
  const head='<tr>'+ins.map(n=>`<th>${esc(n.label||'')}</th>`).join('')+outs.map((n,i)=>`<th class="${i?'':'sep'}">${esc(n.label||'')}</th>`).join('')+'</tr>';
  await dlg({title:'Таблица истинности',html:`<div class="scroll-x"><table>${head}${rows}</table></div><p style="color:var(--dim);font-size:13px">Каждая строка считается с чистого листа, поэтому схемы с памятью показывают состояние после включения. Шины — в 16-ричном виде.</p>`,buttons:[{t:'Закрыть',v:'ok',p:true}]});
}
$('#bTab').onclick=()=>{if(mode.kind==='chipedit')cancelChipEdit();else showTable();};
async function saveChip(){
  const ins=cur.nodes.filter(n=>n.type==='in').sort(byPos),outs=cur.nodes.filter(n=>n.type==='out').sort(byPos);
  if(!ins.length||!outs.length){toast('Добавьте хотя бы один вход и один выход');return;}
  if(cur.nodes.some(n=>n.type==='clock'||n.type==='btn')){toast('Такт и кнопки нельзя класть внутрь чипа — сделайте их входами');return;}
  const r=await dlg({title:'Сохранить как чип',html:`<p>Входов: ${ins.length}, выходов: ${outs.length}. Порядок контактов — сверху вниз, как на схеме.</p>`,input:'',
    buttons:[{t:'Отмена',v:null},{t:'Сохранить',v:'ok',p:true}]});
  const name=r.text.trim();
  if(r.v!=='ok')return;
  if(!name){toast('Введите имя чипа');return;}
  const id='C'+(S.nextChip++);
  const circ=clone(cur);circ.nodes.forEach(n=>{if(n.type==='in')n.val=0;delete n.fixed;});
  S.chips[id]={id,name,inputs:ins.map(n=>n.label||'?'),outputs:outs.map(n=>n.label||'?'),
    inW:ins.map(n=>n.w||1),outW:outs.map(n=>n.w||1),
    inIds:ins.map(n=>n.id),outIds:outs.map(n=>n.id),circuit:circ,gates:live?live.fl.nand:undefined};
  rebuildChips();persist();toast('Чип «'+name+'» сохранён — он в палитре');
}

function exportPng(){
  draw();

  cv.toBlob(b=>{
    if(!b){toast('Не удалось сделать снимок');return;}

function showHelp(){
  dlg({title:'Как играть',html:`
  <p><b>Провод.</b> Потяните от кружка справа у элемента к кружку слева у другого. Чтобы переподключить, потяните за занятый вход; отпустите в пустом месте — провод удалится. Источник может быть уже приёмника: старшие биты дополняются нулями. Если источник шире, лишние старшие биты отбрасываются: на приёмник идут младшие. Нужны другие биты — возьмите их «Разветвителем».</p>
  <p><b>Шины.</b> Квадратные контакты и толстые провода несут несколько бит. «Разветвитель» делит шину, «Объединитель» собирает. Ширина задаётся в «Настроить».</p>
  <p><b>Входы.</b> Тап по одиночному входу переключает 0 и 1, по шине — открывает ввод числа. Тап по выходу-шине меняет формат: 10-ичный, 16-ричный, двоичный, со знаком.</p>
  <p><b>Элементы.</b> Кнопка «+» добавляет элементы. Перетаскивайте за корпус. Долгое нажатие или перетаскивание выделяет элемент: «Удалить», «Копия», «Настроить».</p>
  <p><b>Группы.</b> ☐ — режим выделения. Тап по элементу добавляет или убирает его, рамка по пустому месту выделяет всё внутри. Выделенное можно двигать пальцем. «Копировать» и «Вырезать» кладут группу вместе с проводами в буфер, 📋 вставляет. Двумя пальцами поле можно двигать и в режиме выделения.</p>
  <p><b>Чипы.</b> В песочнице выделите свой чип и нажмите «Править»: он откроется как схема. «Сохранить» обновит все копии.</p>
  <p><b>Время.</b> «Задержка» запоминает вход на один такт. Такт делается кнопкой «Такт» или кнопкой ▶. Тактовый генератор меняет значение на каждом такте, поэтому его период — два такта. Осциллограф рисует сигналы по тактам.</p>
  <p><b>Периферия.</b> Экран, терминал, индикатор, звук и кнопка — в «+» (песочница и последний уровень). Экран и терминал пишут по фронту CLK, когда WE=1. «Внутри» на выделенном чипе показывает его схему.</p>
  <p><b>Вид.</b> Один палец двигает поле, два — масштабируют. ⌖ показывает всю схему. ↶ и ↷ отменяют и повторяют действия.</p>
  <p><b>Уровни.</b> Соберите нужное поведение и нажмите «Проверить». Пройденная схема превращается в чип для следующих уровней.</p>
  <p><b>Песочница.</b> Свои входы, выходы, такт и память. «В чип» сохраняет схему как новый элемент. Схемы с обратной связью работают: время идёт по одному такту на вентиль.</p>
  <p style="color:var(--dim)">Всё сохраняется автоматически на этом устройстве.</p>`,buttons:[{t:'Понятно',v:'ok',p:true}]});
}
async function showIO(){
  persist();
  const json=JSON.stringify(S);
  const r=await dlg({title:'Экспорт и импорт',html:'<p>Скопируйте текст, чтобы сохранить прогресс. Чтобы загрузить — вставьте текст в поле и нажмите «Загрузить».</p>',area:json,
    buttons:[{t:'Закрыть',v:null},
      {t:'Копировать',keep:async(vals,btn)=>{try{await navigator.clipboard.writeText(vals.text);btn.textContent='Скопировано';}catch(e){const ta=document.querySelector('.modal textarea');ta.select();btn.textContent='Выделено — копируйте';}}},
      {t:'Загрузить',v:'load',p:true}]});
  if(r.v==='load'){
    try{
      const s=JSON.parse(r.text);if(!s||typeof s!=='object'||!s.done)throw 0;
      S=s;persist();S=loadSave();rebuildChips();
      if(S.mode==='sandbox')enterSandbox();else enterLevel(+(S.mode.split(':')[1])||1,false);
      toast('Сохранение загружено');
    }catch(e){toast('Не удалось прочитать сохранение');}
  }
}

  {title:"13.1 · Миссии, проекты и инструменты большой схемы",html:"<ul><li><b>Больше миссий</b>: шлюз, тревога, чётность, посадочный огонь, термостат, накопитель, арбитр сервиса и др.</li><li><b>Большой проект</b> «Контроллер шлюза» с этапами.</li><li><b>Инструменты схемы</b>: проверка, трассировка сигнала, блоки-рамки, выравнивание.</li></ul>"},
  {title:"13.0 · Кампания и рабочее место",html:"<ul><li><b>Кампания</b>: шесть глав сюжета «Полярная станция» поверх списка уровней.</li><li><b>Рабочее место</b>: главное меню карточками.</li><li><b>Наставник</b> в подсказке: идея, план, карта.</li><li><b>Индикатор сохранения</b> и Ctrl/⌘+S.</li></ul>"},
  {title:"12.2 · Многоядерность",html:"<ul><li><b>Глава «Ядра» расширена</b>: почтовый ящик, взаимная блокировка, кэш с инвалидацией, барьер на три ядра, арбитр с тактом.</li><li><b>Процессор с паузой</b> и вершина главы <b>«Двухъядерный компьютер»</b>: два ядра печатают в общий порт, а арбитр и пауза проигравшего собираются вами из чипов главы. Есть схема-подсказка.</li><li>Новое достижение «Многоядерный».</li><li><b>12.1</b>: Процессор 2 и программы для него. <b>12.0</b>: звёзды и Акт V «Программист».</li></ul>"},
  {title:"12.1 · Процессор 2",html:"<ul><li><b>Процессор 2</b> (уровни 110–114): 12-битные команды, регистры A, B, C, вычитание, обмен, ADDI, цикл LOOP и остановка HLT. Сначала четыре блока (декодер, регистры A и B, счётчик цикла, условия перехода), затем сам процессор.</li><li><b>Программы для него</b> (120–124): кратные семи, умножение сложением, числа Фибоначчи, вычитание в цикле. Ассемблер понимает метки: пишите «L: ADD», «LOOP L».</li><li>Сигнал <b>STB</b> показывает выполнение команды OUT, поэтому можно выводить одинаковые числа подряд.</li><li><b>12.0</b>: звёзды за оптимизацию, Акт V «Программист», 8 новых схемных уровней, схемы-подсказки у большинства уровней.</li></ul>"},
  {title:"12.0 · Звёзды и Акт V «Программист»",html:"<ul><li><b>Звёзды</b>: за каждый уровень от одной до трёх. Три звезды — схема не больше эталона по NAND, две — не больше полутора эталонов. Лучший результат хранится, звёзды видно в окне результата. Новые достижения за звёзды.</li><li><b>Акт V · Программист</b> (100–105): ваш процессор из уровня 23 уже подключён к ПЗУ, а вы пишете программу в текстовом виде: LDI, ADDI, OUT, JNZ. Циклы, переполнение, остановка. Звёзды зависят от длины программы.</li><li><b>8 новых схемных уровней</b> (90–97): мультиплексор 4→1, дешифратор 3→8, делитель частоты, сдвиговый регистр, сравнение 8 бит, отрицание, вычитатель, двоичный→десятичный. Они открываются на путях Акта I по мере прохождения.</li><li><b>Схемы-подсказки</b> теперь есть у 96 уровней. Кнопка «Подсказка» рисует предположительную схему из ваших же чипов.</li></ul>"},
  {title:"11.5 · Широкие чипы и пропуск уровней",html:"<ul><li><b>Пропуск уровня</b>: меню «11.5» → «Пропустить уровень». Схема собирается автоматически из ROM и задержки и проверяется тестами уровня. Доступно, когда входов не больше 10 бит (для последовательных схем — 4 бита и состояние).</li><li><b>Шины разной ширины</b> соединяются свободно: лишние биты обрезаются, недостающие дополняются нулями.</li><li><b>Широкие чипы</b>: выделите чип из библиотеки с одноразрядными входами и нажмите «↔ Ширина»: чип будет работать на каждом бите шины.</li><li>Из меню убраны старые обновления.</li><li>Новый порядок: уровни 11 и 17 — маленькие «Сумматор 2 бита» и «АЛУ 2 бита» из одиночных битов, затем шинные «Сумматор 4 бита (шины)» и «АЛУ 4 бита (шины)» (уровни 82 и 83).</li></ul>"},
  {title:"11.0 · Акт III и Акт IV",html:"<ul><li><b>Акт III · GPU</b> (66–73): растровая развёртка, отрезок, квадрат, зеркало, Z-тест, смешивание, конвейер шейдера, синхросигналы кадра.</li><li><b>Акт IV · Солянка</b> (74–81): индикатор, кодовый замок, светофор, десятичный сумматор, эхо, сортировка трёх, секундные часы, АЛУ с флагами.</li><li>Четыре вкладки на карте-дереве, объяснения «Что это и зачем» для всех 81 уровня, два новых достижения.</li></ul>"},
  {title:"10.5 · Объяснения в начале уровней",html:"<ul><li>В начале каждого из 65 уровней блок «Что это и зачем»: суть компонента и для чего он нужен. Блок виден и по нажатию на название уровня вверху.</li><li>«Справочник компонентов» в меню «10.5»: NAND, Задержка, ROM, RAM, шины, экран, звук и другие.</li><li>Сохранено всё из 10.0: карта-дерево, ROM с записью, Акт II, музыка, достижения.</li></ul>"},
  {title:"10.0 · Большое обновление",html:"<ul><li><b>Карта-дерево.</b> Уровни снова деревом: перетаскивание, щипок двумя пальцами, ⌖ (весь граф) и ◎ (текущий уровень). Вкладки Акт I / II / III.</li><li><b>ROM с записью.</b> Входы DIN, WE, CLK, содержимое сохраняется между запусками. Таблица памяти: просмотр, правка, очистка, копирование.</li><li><b>Акт II:</b> 17 уровней про многоядерность (49–65): арбитры, замок, барьер, кэш, TMR, сторожевой таймер, карусель ядер, планировщик.</li><li><b>Звук:</b> эффекты, 4 новых тембра, фоновая музыка (меню «10.0»).</li><li><b>Достижения</b> и компактная панель на телефоне.</li></ul>"},

  {title:"8.0 · Сигналы и архитектура",html:"<ul><li>Автоматическое дополнение шин нулями из 7.7.</li><li>8 новых заданий и ответвлений: теперь 120 уровней.</li><li>Конструктор четырёх видов адаптеров.</li><li>Подписи проводов и браузер сигналов.</li><li>Зонд DEC / HEX / BIN при наведении.</li><li>Подсветка источника и приёмника выбранного провода.</li><li>Сводка расширяемых соединений и тесты совместимости.</li><li>Главное меню с быстрым доступом к разделам.</li></ul><p class=\"muted80\">Адаптеры генерируются из прежних компонентов. Симулятор остаётся двухсостоянийным и итеративным. Запускаемые проверки не заменяют полный браузерный прогон.</p>"},
  {title:"7.5 · Атлас и периферия",html:"<ul><li>Карта уровней вместо длинного списка: зависимости, поиск, цель и прогресс.</li><li>Вход-ползунок и назначаемая клавиатурная кнопка.</li><li>LED-линейка, RGB, шкала, ASCII и крупное табло.</li><li>Живой пульт входов и выходов.</li><li>Закладки камеры и фокус на выделении.</li><li>Пакеты до 100 тактов с отменой выполнения.</li><li>Пример «Пульт света» и проверки 7.5.</li></ul><p class=\"io75note\">Новые виды используют обычные in/out и не меняют модель симуляции. Клавиатуру необходимо включать отдельно кнопкой ⌨.</p>"},
  {title:"7.0 Studio · большой релиз",html:"<ul><li>Несколько именованных проектов и дубликаты.</li><li>Контрольные точки со схемой-предпросмотром.</li><li>Мини-карта с навигацией.</li><li>Мастер соединения контактов.</li><li>Собственные тесты, последовательности и CSV.</li><li>Галерея из 8 редактируемых узлов.</li><li>Компоновка и отражение групп.</li><li>Журнал проекта и аудит схемы.</li></ul><p class=\"s7hint\">Всё это дополняет боковую библиотеку и редактор шин 7.0. Новые функции открываются кнопкой ◈ Studio.</p>"},
  {title:"7.0 · Удобная мастерская",html:"<ul><li>Библиотека на компьютере вместо «+»: поиск, категории, избранное и недавние элементы.</li><li>Сворачиваемая панель с изменяемой шириной.</li><li>Инспектор выделения с быстрыми кнопками разрядности.</li><li>Редактор шин с диапазонами битов и равными группами.</li><li>Пакетная смена ширины и подтверждение отключения проводов.</li><li>Пресеты в диалогах ROM/RAM и других компонентов.</li></ul><p class=\"hint7\">Панель включается от 1000 px. Для телефонов сохранена прежняя палитра. Настройки библиотеки хранятся отдельно от прогресса.</p>"},
  {title:"6.0 · Отладка и инструменты",html:"<ul><li>10 новых уровней, всего 40.</li><li>Анализатор: каналы, курсор, 256 отсчётов, CSV, останов по значению.</li><li>Диагностика схемы и поиск элементов.</li><li>Ассемблер с метками, директивами и проверкой диапазонов.</li><li>Горячие клавиши и выравнивание групп.</li><li>Проверяемый импорт, резервная копия v5 и экспорт отдельной схемы.</li><li>Стабильные контакты чипов при редактировании, исправления пошагового режима, кнопок, 32-битных чисел и сброса.</li></ul><p class=\"v6status\">Движок остаётся учебным: два логических состояния, ноль на неподключённых входах, итеративное успокоение. Анализатор показывает такты, не физическое время. История анализатора очищается при пересборке схемы.</p><p>Все новые возможности — в кнопке «⚙ Инструменты» на поле.</p>"},

async function connectUI7s(){if(readonly())return;const outputs=ports7s(true),inputs=ports7s(false);if(!outputs.length||!inputs.length){toast('Нужны компоненты с входами и выходами');return;}stopRun();updateClk();let selectedOut=0,selectedIn=null;const startCircuit=cur;const r=await dlg({title:'Мастер соединений',html:'<p class="s7hint">Выберите выход, затем совместимый вход. Провод можно провести без поиска маленького контакта на Canvas.</p><div id="wirePreview7s" class="s7preview"></div>',fields:[{k:'from7s',label:'Источник',type:'select',value:0,options:outputs.map((p,i)=>[i,p.name])},{k:'to7s',label:'Получатель',type:'select',value:'',options:[]}],mount:m=>{const from=m.querySelector('[data-k="from7s"]'),to=m.querySelector('[data-k="to7s"]'),preview=m.querySelector('#wirePreview7s'),ok=m.querySelector('.btns button:last-child');const update=()=>{selectedOut=+from.value;const a=outputs[selectedOut];to.replaceChildren();const compatible=inputs.map((p,i)=>({p,i}));for(const {p,i} of compatible){const op=document.createElement('option');op.value=i;op.textContent=p.name;to.append(op);}show();};function show(){selectedIn=to.value===''?null:+to.value;const a=outputs[selectedOut],b=selectedIn===null?null:inputs[selectedIn];ok.disabled=!b;const occupied=b&&cur.wires.some(w=>w.to.node===b.n.id&&w.to.pin===b.k);preview.textContent=b?a.name+'\n→ '+b.name+'\n'+(occupied?'⚠ На этом входе уже есть провод. Потребуется подтверждение замены.':'Свободный вход.'):'Нет входов с достаточной шириной для '+a.w+' бит.';preview.className='s7preview'+(occupied?' s7bad':'');}from.onchange=update;to.onchange=show;update();},buttons:[{t:'Отмена',v:null},{t:'Соединить',v:'yes',p:true}]});if(r.v!=='yes'||cur!==startCircuit||selectedIn===null)return;const a=outputs[selectedOut],b=inputs[selectedIn];if(!cur.nodes.includes(a.n)||!cur.nodes.includes(b.n))return;const existing=cur.wires.find(w=>w.to.node===b.n.id&&w.to.pin===b.k);if(existing&&existing.from.node===a.n.id&&existing.from.pin===a.k){to // Шаблоны без зависимости от разблокированных чипов.
function gateTemplate7s(kind){const b=exBuilder();const input=(label,x,y)=>b.add({type:'in',label,w:1,val:0,x,y});const nand=(x,y)=>b.add({type:'chip',chip:'NAND',w:1,x,y});const output=(label,a,x,y,w=1)=>{const o=b.add({type:'out',label,w,x,y});b.wire(a,0,o,0);return o;};const wire=(a,z,k)=>b.wire(a,0,z,k);const inv=(a,x,y)=>{const n=nand(x,y);wire(a,n,0);wire(a,n,1);return n;};const and=(a,c,x,y)=>{const n=nand(x,y);wire(a,n,0);wire(c,n,1);return inv(n,x+130,y);};const xor=(a,c,x,y)=>{const n=nand(x,y),u=nand(x+140,y-65),v=nand(x+140,y+65),o=nand(x+280,y);wire(a,n,0);wire(c,n,1);wire(a,u,0);wire(n,u,1);wire(n,v,0);wire(c,v,1);wire(u,o,0);wire(v,o,1);return o;};if(kind==='not'){const a=input('A',0,40);output('Y',inv(a,150,30),310,40);}if(['and','or','xor','half'].includes(kind)){const a=input('A',0,0),c=input('B',0,140);if(kind==='and')output('Y',and(a,c,140,60),450,70);if(kind==='or'){const u=inv(a,140,-10),v=inv(c,140,130),n=nand(300,60);wire(u,n,0);wire(v,n,1);output('Y',n,470,70);}if(kind==='xor'||kind==='half'){const x=xor(a,c,140,60);output(kind==='half'?'S':'Y',x,590,70);if(kind==='half')output('C',and(a,c,140,250),590,260);}}if(kind==='mux'){const a=input('A',0,0),c=input('B',0,140),s=input('S',0,280),ns=inv(s,140,270),u=nand(300,0),v=nand(300,140),n=nand(460,70);wire(a,u,0);wire(ns,u,1);wire(c,v,0);wire(s,v,1);wire(u,n,0);wire(v,n,1);output('Y',n,610,80);}if(kind==='delay'){const a=input('A',0,40);let prev=a;for(let i=0;i<3;i++){const d=b.add({type:'delay',w:1,x:140+i*160,y:40});wire(prev,d,0);prev=d;}output('Y',prev,650,40);}if(kind==='counter'){const rom=b.add({type:'rom',aw:4,dw:4,data:Array.from({length:16},(_,i)=>(i+1)&15),x:0,y:0}),d=b.add({type:'delay',w:4,x:180,y:0}),seg=b.add({type:'seg',w:4,x:380,y:0});wire(rom,d,0);wire(d,rom,0);wire(d,seg,0);output('Q',d,380,130,4);}return b.done();}

function insertCircuit7s(fragment){if(mode.kind!=='sandbox')return;const idMap=new Map(),center=toWorld(W/2,H/2),bounds=bounds7s(fragment.nodes),dx=snap(center.x-bounds.x-bounds.w/2),dy=snap(center.y-bounds.y-bounds.h/2),ids=[];for(const n of fragment.nodes){const c=clone(n);let id;do{id='n'+cur.next++;}while(nodeById(id));idMap.set(n.id,id);c.id=id;c.x+=dx;c.y+=dy;delete c.fixed;cur.nodes.push(c);ids.push(id);}for(const w of fragment.wires)cur.wires.push({from:{node:idMap.get(w.from.node),pin:w.from.pin},to:{node:idMap.get(w.to.node),pin:w.to.pin}});setSelMode(true);selSet=new Set(ids);sel=null;changed();toast('Шаблон вставлен. Группа выделена — переместите за корпус.');}
async function galleryUI7s(){if(mode.kind!=='sandbox'){toast('Галерея доступна в песочнице. Перейдите в проект через Studio.');return;}await dlg({title:'Галерея редактируемых узлов',html:'<p class="s7hint">Вставляются настоящие компоненты и провода, не непрозрачная картинка. Текущая схема не заменяется.</p><div class="s7cards">'+templates7s.map(([id,name,desc])=>'<article class="s7item"><h3>'+name+'</h3><p>'+desc+'</p><button data-template7s="'+id+'">Предпросмотр</button></article>').join('')+'</div>',mount:m=>{m.classList.add('s7wide');markClose7s(m);m.querySelector('.body').onclick=async e=>{const b=e.target.closest('[data-template7s]');if(!b)return;const id=b.dataset.template7s,c=gateTemplate7s(id),name=templates7s.find(t=>t[0]===id)[1];const r=await dlg({title:name,html:previewSVG7s(c)+'<p class="s7hint">'+c.nodes.length+' компонентов · '+c.wires.length+' проводов</p>',buttons:[{t:'Назад',v:null},{t:'Вставить в проект',v:'yes',p:true}]});if(r.v==='yes'){closeDialog7s(b);insertCircuit7s(c);}};},buttons:[{t:'Закрыть',v:null,p:true}]});}
