async function groupUI7s(){if(readonly())return;const nodes=movable7s();if(nodes.length<2){toast('Выделите минимум два незакреплённых элемента кнопкой ☐');return;}const r=await dlg({title:'Компоновка группы · '+nodes.length,html:'<p class="s7hint">Меняются позиции корпусов. Провода сохраняются. Отражение меняет расположение элементов, но не ориентацию их контактов.</p>',fields:[{k:'gap',label:'Промежуток между корпусами, px (0–400)',value:60,num:1}],buttons:[{t:'Отмена',v:null},{t:'В ряд →',v:'row'},{t:'В столбец ↓',v:'column'},{t:'Отразить X',v:'mirrorX'},{t:'Отразить Y',v:'mirrorY'},{t:'Дубликат',v:'duplicate'}]});if(!r.v)return;if(nodes.some(n=>!cur.nodes.includes(n))){toast('Выделение устарело');return;}if(r.v==='duplicate'){if(copySel())pasteClip();return;}const gap=Number(r.vals.gap);if(!Number.isInteger(gap)||gap<0||gap>400){toast('Промежуток: целое число 0–400');return;}if(r.v==='row'||r.v==='column'){const horizontal=r.v==='row',axis=horizontal?'x':'y',other=horizontal?'y':'x';nodes.sort((a,b)=>a[axis]-b[axis]);let pos=Math.min(...nodes.map(n=>n[axis]));const base=Math.min(...nodes.map(n=>n[other]));for(const n of nodes){n[axis]=snap(pos);n[other]=snap(base);pos+=nodeSize(n)[horizontal?0:1]+gap;}}else{const axis=r.v==='mirrorX'?'x':'y',idx=axis==='x'?0:1,min=Math.min(...nodes.map(n=>n[axis])),max=Math.max(...nodes.map(n=>n[axis]+nodeSize(n)[idx]));for(const n of nodes)n[axis]=snap(min+max-n[axis]-nodeSize(n)[idx]);}commit();persistSoon();need();toast('Расположение обновлено');}
// Тестовый стенд: независимые векторы или последовательность settle/tick.
function number7s(s,w,expected){if(expected&&s==='*')return null;if(!/^(?:0x[0-9a-f]+|0b[01]+|\d+)$/i.test(s))throw Error('Некорректное число «'+s+'»');const v=/^0x/i.test(s)?parseInt(s.slice(2),16):/^0b/i.test(s)?parseInt(s.slice(2),2):Number(s);if(!Number.isSafeInteger(v)||v<0||v>=2**w)throw Error('Значение '+s+' не помещается в '+w+' бит');return v;}
function parseVectors7s(text,ins,outs){const rows=[];String(text).split(/\r?\n/).forEach((line,i)=>{line=line.replace(/[;#].*$/,'').trim();if(!line)return;try{const parts=line.split('=>');if(parts.length!==2)throw Error('Нужен разделитель =>');const left=parts[0].trim().split(/[\s,]+/).filter(Boolean),right=parts[1].trim().split(/[\s,]+/).filter(Boolean);if(left.length!==ins.length||right.length!==outs.length)throw Error('Ожидается '+ins.length+' входных и '+outs.length+' выходных значений');rows.push({line:i+1,input:left.map((s,k)=>number7s(s,ins[k].w||1,false)),expected:right.map((s,k)=>number7s(s,outs[k].w||1,true))});if(rows.length>256)throw Error('Не больше 256 векторов');}catch(e){throw Error('Строка '+(i+1)+': '+e.message);}});if(!rows.length)throw Error('Нет тестовых векторов');return rows;}
function runVectors7s(circuit,rows,ins,outs,kind){const fl=flatten(circuit);if(fl.nand>15000)throw Error('Для интерактивного стенда лимит — 15000 NAND');const sim=new Sim(fl);const base=()=>{sim.reset();for(const n of circuit.nodes){if(['switch','btn'].includes(n.type)){const nets=fl.outs[n.id]?.[0];if(nets)nets.forEach((net,k)=>sim.v[net]=((n.val||0)>>>k)&1);}}};base();const result=[];for(const row of rows){if(kind==='independent')base();ins.forEach((n,i)=>{const nets=fl.outs[n.id]?.[0];if(!nets)throw Error('Не найден вход '+n.id);nets.forEach((net,k)=>sim.v[net]=(row.input[i]>>>k)&1);});let stable=sim.settle();if(kind==='after')stable=sim.tick()&&stable;const got=outs.map(n=>sim.rd(fl.res[n.id]));result.push({...row,got,stable,ok:stable&&row.expected.every((x,i)=>x===null||x===got[i])});if(kind==='before'){if(!sim.tick())result[result.length-1].ok=false;}}return result;}
function testCsv7s(results,ins,outs){const quote=s=>'"'+String(s).replace(/"/g,'""')+'"';const head=['line','ok',...ins.map(n=>'in:'+n.label),...outs.map(n=>'expected:'+n.label),...outs.map(n=>'got:'+n.label)];return[head.map(quote).join(','),...results.map(r=>[r.line,r.ok?1:0,...r.input,...r.expected.map(x=>x===null?'*':x),...r.got].join(','))].join('\n');}

function adapter80(kind,from,to,offset=0){if(!['zero','sign','slice','repeat'].includes(kind))throw Error('Неизвестный адаптер');for(const w of [from,to])if(!Number.isInteger(w)||w<1||w>32)throw Error('Ширина 1–32 бита');if((kind==='zero'||kind==='sign')&&to<from)throw Error('Ширина результата должна быть не меньше входной');if(kind==='repeat'&&from!==1)throw Error('Размножение принимает один бит');if(kind==='slice'&&(!Number.isInteger(offset)||offset<0||offset+to>from))throw Error('Диапазон выходит за границы входа');const b=exBuilder(),input=b.add({type:'in',label:'A',w:from,val:0,x:0,y:80}),output=b.add({type:'out',label:'Y',w:to,x:550,y:80});const connect=(a,ap,z,zp)=>b.wire(a,ap,z,zp);if(from===to&&kind!=='repeat'&&offset===0){connect(input,0,output,0);return b.done();}if(kind==='zero'){const merge=b.add({type:'merge',ws:[from,to-from],x:330,y:60}),zero=b.add({type:'const',val:0,w:to-from,x:140,y:180});connect(input,0,merge,0);connect(zero,0,merge,1);connect(merge,0,output,0);}if(kind==='sign'){const split=b.add({type:'split',ws:Array(from).fill(1),x:160,y:30}),merge=b.add({type:'merge',ws:Array(to).fill(1),x:360,y:30});connect(input,0,split,0);for(let k=0;k<to;k++)connect(split,Math.min(k,from-1),merge,k);connect(merge,0,output,0);}if(kind==='repeat'){const merge=b.add({type:'merge',ws:Array(to).fill(1),x:300,y:30});for(let k=0;k<to;k++)connect(input,0,merge,k);connect(merge,0,output,0);}if(kind==='slice'){const widths=[],index=offset?1:0;if(offset)widths.push(offset);widths.push(to);if(from-offset-to>0)widths.push(from-offset-to);const split=b.add({type:'split',ws:widths,x:270,y:50});connect(input,0,split,0);connect(split,index,output,0);}return b.done();}
function insert80(fragment){if(mode.kind!=='sandbox')return;const map=new Map(),added=[],center=toWorld(W/2,H/2),dx=snap(center.x-300),dy=snap(center.y-100);for(const n of fragment.nodes){const nn=clone(n);let id;do{id='n'+cur.next++;}while(nodeById(id));map.set(n.id,id);nn.id=id;nn.x+=dx;nn.y+=dy;cur.nodes.push(nn);added.push(id);}for(const w of fragment.wires)cur.wires.push({from:{node:map.get(w.from.node),pin:w.from.pin},to:{node:map.get(w.to.node),pin:w.to.pin}});setSelMode(true);selSet=new Set(added);sel=null;changed();toast('Адаптер вставлен. Группа выделена.');}
async function adapterUI80(){if(mode.kind!=='sandbox'){toast('Конструктор адаптеров доступен в песочнице');return;}let fragment=null,description='';const r=await dlg({title:'Конструктор адаптеров шин',html:'<p class="muted80">Результат — обычные входы, выходы, разветвители, объединители и константы. Можно вставить схему или сохранить её как переиспользуемый чип.</p><div id="adapterPreview80" class="preview80"></div>',fields:[{k:'kind80',label:'Операция',type:'select',value:'zero',options:[['zero','Дополнить нулями'],['sign','Расширить знак'],['slice','Выделить диапазон'],['repeat','Размножить один бит']]},{k:'from80',label:'Входная ширина (для размножения — 1)',value:4,num:1},{k:'to80',label:'Выходная ширина',value:8,num:1},{k:'offset80',label:'Младший бит диапазона (только для выделения)',value:0,num:1}],mount:m=>{const body=m.querySelector('.body'),preview=m.querySelector('#adapterPreview80');function update(){try{const kind=m.querySelector('[data-k="kind80"]').value,from=Number(m.querySelector('[data-k="from80"]').value),to=Number(m.querySelector('[data-k="to80"]').value),offset=Number(m.querySelector('[data-k="offset80"]').value);fragment=adapter80(kind,from,to,offset);description=kind==='slice'?'Биты '+(offset+to-1)+':'+offset+' → '+(to-1)+':0':kind==='repeat'?'Входной бит копируется в '+to+' позиций':kind==='sign'?'Бит '+(from-1)+' повторяется в старших разрядах':'Старшие '+(to-from)+' битов равны нулю';preview.textContent=from+' → '+to+' бит\n'+description+'\n'+fragment.nodes.length+' компонентов · '+fragment.wires.length+' проводов';preview.className='preview80 ok80';}catch(e){fragment=null;preview.textContent=e.message;preview.className='preview80 bad80';}m.querySelectorAll('.btns button').forEach((b,i)=>{if(i)b.disabled=!fragment;});}body.addEventListener('input',update);body.addEventListener('change',update);update();},buttons:[{t:'Отмена',v:null},{t:'Сохранить как чип',v:'chip'},{t:'Вставить схему',v:'insert',p:true}]});if(!fragment||!r.v)return;if(r.v== async function checks80(silent){const results=[];function test(name,fn){try{if(!fn())throw Error('неверный результат');results.push({name,ok:true});}catch(e){results.push({name,ok:false,error:e.message});}}const direct=(a,b)=>({next:1,nodes:[{id:'a',type:'in',w:a,x:0,y:0},{id:'b',type:'out',w:b,x:200,y:0}],wires:[{from:{node:'a',pin:0},to:{node:'b',pin:0}}]});test('Совместимость: расширение и сужение (обрезание) разрешены',()=>compatible(1,8)&&compatible(8,8)&&compatible(8,1));test('Прямой провод 1 → 8',()=>evaluate80(direct(1,8),1)===1&&evaluate80(direct(1,8),0)===0);test('Прямой провод 4 → 32',()=>evaluate80(direct(4,32),15)===15);test('pruneCirc сохраняет 1 → 8',()=>{const c=direct(1,8);return pruneCirc(c)===0&&c.wires.length===1;});test('pruneCirc сохраняет 8 → 1',()=>{const c=direct(8,1);return pruneCirc(c)===0&&c.wires.length===1;});test('Прямой провод 8 → 1 берёт младший бит',()=>evaluate80(direct(8,1),0xA5)===1&&evaluate80(direct(8,1),0xA4)===0);test('Прямой провод 8 → 4 берёт младшие биты',()=>evaluate80(direct(8,4),0xA7)===7);test('NAND 8 бит получает однобитовый вход',()=>{const b=exBuilder(),a=b.add({type:'in',w:1}),n=b.add({type:'chip',chip:'NAND',w:8}),o=b.add({type:'out',w:8});b.wire(a,0,n,0);b.wire(a,0,n,1);b.wire(n,0,o,0);return evaluate80(b.done(),1)===254;});test('Знаковое расширение 4 → 8',()=>evaluate80(adapter80('sign',4,8),9)===249);test('Знаковое расширение 1 → 32',()=>evaluate80(adapter80('sign',1,32),1)===4294967295);test('Явное дополнение нулями',()=>evaluate80(adapter80('zero',4,16),9)===9);test('Выделение битов 7:4',()=>evaluate80(adapter80('slice',8,4,4),0xab)===10);test('Размножение бита',()=>evaluate80(adapter80('repeat',1,8),1)===255);test('Вложенный чип с входом 8 бит',()=>{const id='__TEST80_TEMP',previous=CHIPS[id];try{CHIPS[id]={id,name:'TEST',inputs:['A'],outputs:['Y'],inIds:['a'],outIds:['b'],inW:[8],outW:[8],circuit:direct(8,8)};const b=exBuilder(),a=b.add({type:'in',w:1}),n=b.add({type:'chip',chip:id}),o=b.add({type:'out',w:8});b.wire(a,0,n,0);b.wire(n,0,o,0);return evaluate80(b.done(),1)===1;}finally{if(previous)CHIPS[id]=previous;else delete CHIPS[id];}});test('Все новые уровни имеют существующие зависимости',()=>extraLevels.every(l=>l.req.every(id=>LEVELS.some(x=>x.id===id)))&&new Set(LEVELS.map(x=>x.id)).size===LEVELS.length);if(silent)return results.map(r=>Array.isArray(r)?{name:r[0],ok:!!r[1],msg:r[2]||''}:{name:r.name,ok:!!r.ok,msg:r.msg||r.error||''});await dlg({title:'Проверки 8.0 · '+results.filter(r=>r.ok).length+'/'+results.length,html:results.map(r=>'<p class="'+(r.ok?'ok80':'bad80')+'">'+(r.ok?'✓ ':'✕ ')+esc(r.name)+(r.error?' · '+esc(r.error):'')+'</p>').join('')+'<h3>Проверить вручную</h3><ol class="muted80"><li>Соедините 1-битный вход с 8-битным выходом жестом и через мастер Studio.</li><li>Поменяйте 0/1: выход должен показывать 0/1, не 255.</li><li>Экспортируйте и импортируйте такое соединение.</li><li>Переименуйте провод, найдите его через браузер сигналов.</li><li>На карте найдите уровни 41–48 и проверьте их требования.</li><li>Сохраните знаковый адаптер как чип и проверьте 1001 → 11111001.</li></ol>',mount:m=>m.classList.add('wide80'),buttons:[{t:'Закрыть',v:null,p:true}]});}

function setWave9(osc,wv){
  if(['sine','square','triangle','sawtooth'].includes(wv)){osc.type=wv;return;}
  const N=16,re=new Float32Array(N),im=new Float32Array(N);
  for(let k=1;k<N;k++){
    if(wv==='organ')im[k]=[0,1,.6,.35,.25,.12,.08,.05][k]||0;
    else if(wv==='pulse')re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*.25);
    else if(wv==='bell')im[k]=[0,1,0,.55,0,.4,0,.25][k]||0;
    else im[k]=(k%2?1/k:0);
  }
  try{osc.setPeriodicWave(AC.createPeriodicWave(re,im));}catch(e){osc.type='square';}
}
function tone9(f,at,d,type,v){
  const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function sfx9(k){
  if(S.set.sfx===0||muted)return;initAudio();if(!AC)return;if(AC.state==='suspended')AC.resume();
  if(k==='tap')tone9(880,0,.04,'triangle',.5);
  else if(k==='ok')[523,659,784,1047].forEach((f,i)=>tone9(f,i*.1,.22,'square',.7));
  else if(k==='bad')tone9(110,0,.25,'sawtooth',.9);
  else if(k==='write')tone9(1320,0,.05,'square',.4);
}

async function wipeAll(){
  const c=await dlg({title:'Сбросить всё?',html:'<p>Прогресс, чипы и схемы будут удалены без возможности восстановления, вместе с резервными копиями в этом браузере. Сначала можно скачать сохранение: меню → «Сохранение».</p>',buttons:[{t:'Отмена',v:null},{t:'Сбросить',v:'ok',p:true}]});
  if(c.v!=='ok')return;

  try{for(const k of Object.keys(localStorage))if(/^nandlab/i.test(k)&&k!==KEY)localStorage.removeItem(k);}catch(e){}
  S={done:{},lchips:{},chips:{},work:{},sandbox:null,nextChip:1,mode:'level:1',seen:VER};
  clip=null;rebuildChips();persist();
  try{await idb105('put',JSON.stringify(S));}catch(e){}
  viewStack.length=0;enterLevel(1,true);
}
if(!hasProg105(S)&&lsOK105){
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k===KEY||!/^nandlab/i.test(k)||k==='nandlab.test')continue;
    const o=JSON.parse(localStorage.getItem(k)||'null');if(hasProg105(o)){Object.assign(S,loadSaveFrom105(o));rebuildChips();setTimeout(()=>toast('Найден прогресс из старого сохранения'),1200);break;}}}catch(e){}
}
function loadSaveFrom105(o){o.done=o.done||{};o.lchips=o.lchips||{};o.chips=o.chips||{};o.work=o.work||{};o.nextChip=o.nextChip||1;o.mode=o.mode||'level:1';o.seen=o.seen||0;o.set=Object.assign({wire:'curve',grid:1,mute:0},o.set||{});o.clip=o.clip||null;return o;}
if(!hasProg105(S)){idb105('get').then(async j=>{if(!j||hasProg105(S))return;let o;try{o=JSON.parse(j);}catch(e){return;}if(!hasProg105(o))return;
  const r=await dlg({title:'Найден сохранённый прогресс',html:'<p>Пройдено уровней: '+Object.keys(o.done||{}).length+'. Восстановить?</p>',buttons:[{t:'Нет',v:'no'},{t:'Восстановить',v:'ok',p:true}]});
  if(r.v==='ok'){Object.assign(S,loadSaveFrom105(o));rebuildChips();persist();location.reload();}});}

    const sig=h=>{let o='';for(const w of W){const m=L.model();for(const a of h)m(alph[a]);for(const a of w)o+=m(alph[a]).join(',')+';';o+='|';}return o;};
    const maxS=1<<(8-Ti),hs=[[]],sg=new Map([[sig([]),0]]),nx=[],ou=[];
    for(let s=0;s<hs.length;s++){nx[s]=[];ou[s]=[];for(let a=0;a<A;a++){const m=L.model();for(const x of hs[s])m(alph[x]);ou[s][a]=m(alph[a]);const g=sig(hs[s].concat(a));let t=sg.get(g);
      if(t===undefined){t=hs.length;if(t>=maxS)return null;sg.set(g,t);hs.push(hs[s].concat(a));}nx[s][a]=t;}}

  const nand=(a,b,w,x,y)=>{const g=add({type:'chip',chip:'NAND',w},x,y);wr(a[0],a[1],g,0);wr(b[0],b[1],g,1);return [g,0];};

function progWords(c){const r=c.nodes.find(n=>n.id==='rom'&&n.type==='rom');if(!r)return 0;const d=r.data||[];let k=d.length;while(k>0&&!d[k-1])k--;return k;}
function progDriver(exp,cycles){
  return io=>{
    io.reset();
    const clock=rst=>{io.set(1,rst);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};
    clock(1);let last=io.get(0);const got=[];
    for(let i=0;i<cycles;i++){clock(0);const v=io.get(0);if(v!==last){got.push(v);last=v;}}
    const rows=[],n=Math.max(exp.length,got.length);
    for(let k=0;k<n;k++)rows.push({in:[k+1],exp:[k<exp.length?exp[k]:-1],got:[k<got.length?got[k]:-1]});
    return rows;
  };
}

/* --- ассемблер и модель команд второго процессора (слово 12 бит: код 4 бита + число 8 бит) --- */
const ISA2={NOP:0,LDA:1,LDB:2,LDC:3,ADD:4,SUB:5,SWAP:6,OUT:7,JMP:8,JNZ:9,LOOP:10,HLT:11,ADDI:12};
const ISA2_ARG={LDA:1,LDB:1,LDC:1,JMP:1,JNZ:1,LOOP:1,ADDI:1};
function assemble12(text,aw){
  const lines=String(text).split('\n').map(l=>l.replace(/(;|\/\/).*$/,'').trim());
  const labels={},items=[];let addr=0;
  lines.forEach((l0,i)=>{
    let l=l0,m;if(!l)return;
    while((m=l.match(/^([A-Za-z_]\w*):\s*(.*)$/))){labels[m[1].toUpperCase()]=addr;l=m[2];}
    if(!l)return;
    items.push({l,ln:i+1,addr});addr++;

  const size=1<<aw;
  if(addr>size)throw new Error('Программа длиннее ПЗУ: '+addr+' слов из '+size);
  const words=Array(size).fill(0);
  const val=(t,ln)=>{const T=t.toUpperCase();if(Object.prototype.hasOwnProperty.call(labels,T))return labels[T];const x=parseNum(t);if(Number.isNaN(x))throw new Error('Строка '+ln+': не понимаю «'+t+'»');return x;};
  for(const it of items){
    const p=it.l.split(/[\s,]+/).filter(Boolean),mn=p[0].toUpperCase();
    if(Object.prototype.hasOwnProperty.call(ISA2,mn)){
      let n=0;
      if(ISA2_ARG[mn]){
        if(p.length<2)throw new Error('Строка '+it.ln+': '+mn+' требует число');
        n=val(p[1],it.ln)|0;
        if(n<-128||n>255)throw new Error('Строка '+it.ln+': число '+n+' не помещается в 8 бит');
        if((mn==='JMP'||mn==='JNZ'||mn==='LOOP')&&(n<0||n>=size))throw new Error('Строка '+it.ln+': адрес вне ПЗУ');
      }else if(p.length>1)throw new Error('Строка '+it.ln+': '+mn+' не принимает число');

      words[it.addr]=parseInt(p[0],16);

  }

{ext.wrap('memToText',mt0=>function(data,dw){

  for(let i=0;i<k;i++){const w=data[i]|0,op=w>>8,n=w&255,nm=names.find(x=>ISA2[x]===op);out.push(nm?(ISA2_ARG[nm]?nm+' '+(nm==='ADDI'&&n>127?n-256:n):nm):w.toString(16).toUpperCase().padStart(3,'0'));}

function isa2Run(prog){
  let pc=0,A=0,B=0,C=0,out=0,stb=0;
  return {
    reset(){pc=0;A=0;B=0;C=0;out=0;stb=0;},
    step(){
      const w=prog[pc]??0,op=w>>8,n=w&255;let np=(pc+1)&255;stb=+(op===7);
      switch(op){
        case 1:A=n;break;case 2:B=n;break;case 3:C=n;break;
        case 4:A=(A+B)&255;break;case 5:A=(A-B)&255;break;
        case 6:{const t=A;A=B;B=t;break;}
        case 7:out=A;break;case 8:np=n;break;case 9:if(A!==0)np=n;break;
        case 10:C=(C-1)&255;if(C!==0)np=n;break;
        case 11:np=pc;break;case 12:A=(A+n)&255;break;
      }
      pc=np;
    },
    get pc(){return pc;},get out(){return out;},get stb(){return stb;}
  };

function cpu2Driver(io){
  const rows=[],m=isa2Run(CPU2_PROG);

  const clock=(rst,ins)=>{io.set(1,rst);io.set(2,ins);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};
  clock(1,0);m.reset();

    const ins=CPU2_PROG[io.get(0)]??0;
    io.set(1,0);io.set(2,ins);io.settle();const stb=io.get(2);
    clock(0,ins);m.step();
    rows.push({in:[0,ins],exp:[m.pc,m.out,m.stb],got:[io.get(0),io.get(1),stb]});

}
function strobeDriver(exp,cycles){
  return io=>{
    io.reset();
    const clock=rst=>{io.set(1,rst);io.settle();io.set(0,1);io.settle();io.set(0,0);io.settle();};
    clock(1);const got=[];
    for(let i=0;i<cycles;i++){io.set(1,0);io.settle();const stb=io.get(1);clock(0);if(stb)got.push(io.get(0));}

    return rows;
  };

      buttons:[{t:'Понятно',v:null,p:true}]});
  }});
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload();});
  const offer=async reg=>{
    const r=await dlg({title:'Доступна новая версия',html:'<p>Игра обновлена. Ваш прогресс и схемы останутся на месте. Страница перезагрузится.</p>',buttons:[{t:'Позже',v:null},{t:'Обновить',v:'go',p:true}]});
    if(r.v==='go'&&reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
  };
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg);
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(reg);});
    });
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(e=>console.warn('[pwa] sw:',e.message));
  // Просим браузер не вычищать сохранения при нехватке места.
  navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});
});

const THEME_ORDER=['dark','light','contrast','colorblind'];
function currentTheme(){
  const t=S.set&&S.set.theme;if(THEMES[t])return t;
  return matchMedia('(prefers-contrast: more)').matches?'contrast':'dark';
}
function applyPrefs(){
  const root=document.documentElement,set=S.set||{},theme=currentTheme();
  root.dataset.theme=theme;
  for(const k of Object.keys(COL))COL[k]=(THEMES[theme].col&&THEMES[theme].col[k])||COL_DEFAULT[k];
  root.dataset.text=set.text==='large'?'large':'normal';
  root.dataset.motion=set.motion||(matchMedia('(prefers-reduced-motion: reduce)').matches?'reduced':'full');
  root.lang=set.lang==='en'?'en':'ru';
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=THEMES[theme].bar;
  try{need();}catch(_){}
}
const themeLabel=()=>THEMES[currentTheme()].name;

ext.feature('a11y',()=>{
  const toastEl=$('#toast');if(toastEl){toastEl.setAttribute('role','status');toastEl.setAttribute('aria-live','polite');}
  const cvEl=$('#cv');
  if(cvEl){cvEl.setAttribute('role','img');
    const upd=()=>{try{cvEl.setAttribute('aria-label','Схема: элементов '+cur.nodes.length+', проводов '+cur.wires.length+'. '+$('#tName').textContent+'. Редактирование без указателя: «Инструменты» → «Соединить контакты».');}catch(_){}};
    ext.after('setHeader',upd);ext.after('changed',upd);upd();}
  const live=document.createElement('div');live.className='sr-only';live.setAttribute('aria-live','assertive');live.id='srLive';document.body.append(live);
  window.announce=msg=>{live.textContent='';setTimeout(()=>{live.textContent=msg;},30);};
  const sheet=$('#sheet');if(sheet){sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label','Меню');}
  const stack=[];                       // стек возвратов фокуса
  const topModal=()=>{const ms=[...document.querySelectorAll('.modal')];return ms[ms.length-1]||null;};
  const container=()=>topModal()||(sheet&&sheet.classList.contains('on')?sheet:null);
  const firstFocus=c=>c===sheet?(sheet.tabIndex=-1,sheet):(c.querySelector('input,textarea,select')||c.querySelector('.btns .pri')||c.querySelector('.row,[data-tool],button'));   // в шторке — сама шторка, чтобы не открывать экранную клавиатуру
  new MutationObserver(ms=>{
    for(const m of ms){
      for(const n of m.addedNodes){
        if(!(n instanceof HTMLElement)||!n.classList.contains('modal'))continue;
        stack.push(document.activeElement);
        n.setAttribute('role','dialog');n.setAttribute('aria-modal','true');
        const h=n.querySelector('h1,h2,h3,.ttl,.title');if(h){h.id=h.id||'dlgT'+Date.now();n.setAttribute('aria-labelledby',h.id);announce(h.textContent);}
        setTimeout(()=>{const f=firstFocus(n);if(f&&!n.contains(document.activeElement))f.focus({preventScroll:true});},30);
      }
      for(const n of m.removedNodes){
        if(!(n instanceof HTMLElement)||!n.classList.contains('modal'))continue;
        const back=stack.pop();if(back&&document.contains(back)&&!container())setTimeout(()=>back.focus({preventScroll:true}),0);
      }
    }
  }).observe(document.body,{childList:true});
  if(sheet)new MutationObserver(()=>{
    if(sheet.classList.contains('on')){stack.push(document.activeElement);setTimeout(()=>{const f=firstFocus(sheet);if(f)f.focus({preventScroll:true});},30);}
    else{const back=stack.pop();if(back&&document.contains(back)&&!topModal())back.focus({preventScroll:true});}
  }).observe(sheet,{attributes:true,attributeFilter:['class']});
  document.addEventListener('keydown',e=>{
    const c=container();
    // Enter/Space на role=button
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]:not(button)')){e.preventDefault();e.target.click();return;}
    if(!c)return;
    if(e.key==='Tab'){                  // ловушка фокуса
      const f=[...c.querySelectorAll('button,input,textarea,select,[tabindex]:not([tabindex="-1"]),[role="button"]')].filter(x=>!x.disabled&&x.offsetParent!==null);
      if(!f.length)return;const i=f.indexOf(document.activeElement);
      if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus();}
      else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus();}
    }else if(e.key==='Escape'&&!e.target.matches('input,textarea,select')){
      e.preventDefault();
      if(c===sheet){closeSheet();return;}
      const bs=[...c.querySelectorAll('.btns button')];
      const cancel=bs.find(b=>!b.classList.contains('pri'))||bs[0];if(cancel)cancel.click();
    }
  },true);
});

function trEn(s){
  const t=s.trim();if(!t)return s;
  let r=EN_DICT.get(t);if(r!==undefined)return s.replace(t,r);
  for(const [re,rep] of EN_RULES){const m=t.match(re);if(m){const o=typeof rep==='function'?rep(...m):t.replace(re,rep);if(o!=null)return s.replace(t,o);}}
  if(typeof LEVELS!=='undefined'){const L=LEVELS.find(x=>x.name===t);if(L&&EN_LEVELS[L.id])return s.replace(t,EN_LEVELS[L.id]);}
  return s;
}

    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
    while(n=w.nextNode()){
      if(n.nodeType===3){if(n.parentElement&&n.parentElement.closest('pre,textarea,script,style'))continue;if(cyr.test(orig.get(n)||n.nodeValue)||orig.has(n))textNode(n);}
      else for(const a of ATTRS)if(n.hasAttribute(a))attr(n,a);
    }
    for(const a of ATTRS)if(root.hasAttribute&&root.hasAttribute(a))attr(root,a);
  }
  let busy=false;
  const mo=new MutationObserver(ms=>{
    if(busy)return;busy=true;
    try{for(const m of ms){
      if(m.type==='childList')m.addedNodes.forEach(scan);
      else if(m.type==='characterData')textNode(m.target);
      else if(m.type==='attributes')attr(m.target,m.attributeName);
    }}finally{busy=false;}
  });
  const start=()=>mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});
  window.i18nRefresh=()=>{busy=true;try{scan(document.body);}finally{busy=false;}};
  window.t=s=>isEn()?trEn(s):s;
  ext.setting({id:'lang',group:'Вид',title:()=>S.set.lang==='en'?'Язык: English':'Язык: Русский',sub:'Переключить язык интерфейса',keepOpen:true,run:()=>{S.set.lang=S.set.lang==='en'?'ru':'en';persist();applyPrefs();i18nRefresh();}});
  ext.after('setHeader',()=>i18nRefresh());
  start();i18nRefresh();
});
/* =====================================================================
   УДОБСТВО ИГРЫ: быстрые клавиши и подтверждения.
   Enter в диалоге = главная кнопка · Ctrl/⌘+Enter = «Проверить» · «/» = поиск инструмента.
   ===================================================================== */
ext.feature('qol',()=>{
  const typing=t=>t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]');
  document.addEventListener('keydown',e=>{
    const modal=[...document.querySelectorAll('.modal')].pop(),sheetOn=$('#sheet').classList.contains('on');
    // Enter в диалоге подтверждает главную кнопку (если фокус не на кнопке и не в поле ввода)
    if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&modal&&!typing(e.target)&&!e.target.closest('button,[role="button"]')){
      const pri=modal.querySelector('.btns .pri');if(pri){e.preventDefault();pri.click();return;}
    }
    // Ctrl/⌘+Enter — проверить уровень / сохранить в чип, где бы ни был фокус (кроме открытого окна)
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!modal&&!sheetOn){
      const b=$('#bAct');if(b&&!b.disabled&&b.offsetParent!==null){e.preventDefault();b.click();}
      return;
    }
    // «/» — быстрый поиск инструмента (как в большинстве приложений)
    if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!modal&&!sheetOn&&!typing(e.target)){
      e.preventDefault();openToolbox();setTimeout(()=>$('#tbq')&&$('#tbq').focus(),60);
    }
  },true);
});
</script>
